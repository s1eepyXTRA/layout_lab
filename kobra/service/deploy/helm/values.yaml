# Значения по умолчанию.
#
# Postgres и Redis — внешние: чарт их не ставит. База с данными не должна
# удаляться вместе с релизом приложения, а подсовывать её подчартом — верный
# способ однажды снести продуктив командой `helm uninstall`.

image:
  repository: kobra
  tag: ""            # пусто — берётся appVersion из Chart.yaml
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicas: 2          # сервис без состояния: масштабируется горизонтально
worker:
  enabled: true
  replicas: 1
  concurrency: 2

# Адреса внешних Postgres и Redis. Строка подключения — секрет, поэтому
# задаётся через existingSecret или через .Values.secrets.databaseUrl.
redis:
  url: redis://kobra-redis:6379/0

secrets:
  # Если заполнить здесь — чарт создаст Secret сам. Для продуктива лучше
  # existingSecret: туда положит пароль тот, кому положено.
  existingSecret: ""
  databaseUrl: ""    # postgresql+psycopg://user:pass@host:5432/kobra
  secretKey: ""      # KOBRA_SECRET_KEY: им шифруются строки подключения
  # Виртуальный ключ Кобры в шлюзе модели (LiteLLM). Это секрет и только
  # секрет: в браузер он не уходит ни в одном ответе. Пусто — сборка шаблона
  # по описанию через сервис выключена, остаётся перенос вручную.
  aiToken: ""        # KOBRA_AI_TOKEN

env:
  # db — пароль по своей базе, ldap — bind в каталог. Параметры каталога названы
  # именами FAB: администратор, настраивавший Superset, узнаёт их без перевода.
  KOBRA_AUTH_TYPE: db
  # KOBRA_AUTH_LDAP_SERVER: ldap://dc.company.local:389
  # KOBRA_AUTH_LDAP_SEARCH: ou=users,dc=company,dc=local
  # KOBRA_AUTH_LDAP_UID_FIELD: sAMAccountName
  # KOBRA_AUTH_LDAP_BIND_USER: cn=kobra-service,ou=service,dc=company,dc=local
  # KOBRA_AUTH_ROLES_MAPPING: '{"cn=kobra-admins,...": "Admin"}'
  KOBRA_RATE_LIMIT_LOGIN: "10"
  KOBRA_LOAD_DEMO: "0"        # в рабочем контуре демо обычно не нужно
  KOBRA_LOG_LEVEL: info
  KOBRA_SESSION_DAYS: "14"
  # Пределы загрузки: оба применяет сервис, и оба он называет человеку до
  # загрузки. Строки режутся по пределу — набор остаётся рабочим, а на его
  # странице написано, что загружены первые N строк
  KOBRA_MAX_UPLOAD_ROWS: "1000000"
  KOBRA_MAX_FILE_MB: "512"
  # Пулы: соединения к базе и потоки под синхронные маршруты. Потоков не
  # больше, чем соединений, иначе часть потоков ждёт очередь к пулу, а не
  # базу — и это выглядит как «база медленная».
  #
  # Считать на число подов: (KOBRA_DB_POOL + KOBRA_DB_POOL_OVERFLOW) × replicas
  # плюс воркер и job миграций должны остаться меньше max_connections базы.
  # При 10 + 20 и двух подах это 60 из обычных 100 — третий под уже за гранью,
  # поэтому с ростом replicas пул уменьшают, а не оставляют по умолчанию.
  KOBRA_DB_POOL: "10"
  KOBRA_DB_POOL_OVERFLOW: "20"
  KOBRA_THREADPOOL: "30"
  # Порог медленного расчёта: такие попадают в лог с текстом запроса
  KOBRA_SLOW_QUERY_MS: "2000"
  # Пределы частоты на человека. Предел на расчёт обязан быть заметно выше
  # одновременности клиента: дашборд из двадцати блоков — нормальная работа
  KOBRA_RATE_QUERY: "600"
  KOBRA_RATE_WRITE: "300"
  KOBRA_RATE_UPLOAD: "20"

# Доступ к модели: сборка шаблона по описанию. Уезжает **только в под сервиса** —
# воркер к модели не ходит. Токен берётся из секрета (secrets.aiToken).
#
# Пока адрес и модель не заданы, /api/ping отвечает ai: false, и окно описания
# предлагает перенос вручную — как до изменения. Это же и способ выключить
# обращения к модели, не возвращая образ назад.
ai:
  # Адрес шлюза с /v1 на конце и алиас модели в нём (не идентификатор вендора:
  # смена модели не должна требовать нового образа)
  # KOBRA_AI_URL: https://litellm.company.local/v1
  # KOBRA_AI_MODEL: kobra-draft
  #
  # Цепочка таймаутов сверху вниз: обратный прокси 120 с (аннотация ingress
  # ниже) > KOBRA_AI_TIMEOUT_SEC 60 > клиент ждёт 70. Нарушишь порядок — человек
  # получит обрыв соединения вместо внятного «модель не ответила», а токен уже
  # будет потрачен.
  KOBRA_AI_TIMEOUT_SEC: "60"
  # Кому разрешено тратить служебный ключ. Пусто — всем вошедшим
  # KOBRA_AI_ROLES: Admin,Alpha
  KOBRA_AI_MAX_CHARS: "4000"
  KOBRA_AI_MAX_COLS: "40"
  # Пределы частоты — защита от цикла, а не бюджет: потолок расхода ставится
  # бюджетом виртуального ключа в самом шлюзе, там, где деньги
  KOBRA_AI_LIMIT_USER: "20"
  KOBRA_AI_LIMIT_ALL: "200"
  KOBRA_AI_LOG_DAYS: "90"
  # 0, если тексты запросов пишет сам шлюз: чужие тексты не нужны в двух местах
  KOBRA_AI_LOG_TEXT: "1"
  # Шлюз внутри контура нужно внести в NO_PROXY, иначе запрос уйдёт во внешний
  # прокси и встанет на таймауте, а симптом будет «модель не отвечает»
  # HTTPS_PROXY: http://proxy.company.local:3128
  # NO_PROXY: litellm.company.local,.company.local

# Миграции катит отдельный job перед обновлением: приложение не должно
# стартовать на несовпадающей схеме, а катить их каждым подом нельзя — они
# столкнутся друг с другом.
migrations:
  enabled: true

service:
  type: ClusterIP
  port: 80

# Метрики: /metrics отдаётся без входа, персональных данных в нём нет.
# Аннотации — для сборщика, который смотрит на поды сам.
metrics:
  enabled: true
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"

ingress:
  enabled: false
  className: ""
  host: kobra.company.local
  tls: []
  # Обращение к модели идёт синхронно и ждёт до KOBRA_AI_TIMEOUT_SEC. У
  # nginx-ingress таймаут по умолчанию 60 секунд — то есть ровно столько же, и
  # обрыв прилетит раньше нашего внятного отказа. Поэтому таймаут прокси задан
  # явно и с запасом.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

resources:
  api:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  worker:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}   # разбор файла упирается в процессор

probes:
  # Проба жизни не ходит в базу намеренно: короткая недоступность базы не
  # должна перезапускать все поды разом
  liveness: /healthz
  readiness: /readyz

nodeSelector: {}
tolerations: []
affinity: {}
