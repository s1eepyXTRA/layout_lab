{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kobra.fullname" . }}
  labels: {{- include "kobra.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Без ключа сервис поднимется, но предупредит, что работает на ключе для
  # разработки: шифрование строк подключения им защищено только на словах.
  databaseUrl: {{ required "Нужен secrets.databaseUrl или secrets.existingSecret" .Values.secrets.databaseUrl | quote }}
  secretKey: {{ required "Нужен secrets.secretKey или secrets.existingSecret" .Values.secrets.secretKey | quote }}
{{- end }}
