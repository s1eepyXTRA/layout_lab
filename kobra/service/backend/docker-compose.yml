# Окружение разработки: одна команда — и всё работает.
#
#   cd kobra/service/backend
#   docker compose up --build
#   → http://localhost:8000, вход admin / admin
#
# Postgres и Redis здесь свои, одноразовые. В рабочем контуре они внешние:
# образу всё равно, он знает только KOBRA_DATABASE_URL и KOBRA_REDIS_URL.

name: kobra

x-env: &env
  KOBRA_DATABASE_URL: postgresql+psycopg://kobra:kobra@db:5432/kobra
  KOBRA_REDIS_URL: redis://redis:6379/0
  KOBRA_SECRET_KEY: razrabotka-klyuch-ne-dlya-produktiva-32
  KOBRA_ADMIN_USER: admin
  KOBRA_ADMIN_PASSWORD: admin
  KOBRA_LOAD_DEMO: "1"
  # Вход по умолчанию — по базе. Каталог включается вместе с профилем ldap:
  #   docker compose --profile ldap up -d ldap
  #   docker compose up -d --force-recreate api   (с KOBRA_AUTH_TYPE=ldap в окружении)
  KOBRA_AUTH_TYPE: ${KOBRA_AUTH_TYPE:-db}
  KOBRA_AUTH_LDAP_SERVER: ldap://ldap:389
  KOBRA_AUTH_LDAP_SEARCH: ou=users,dc=company,dc=local
  KOBRA_AUTH_LDAP_BIND_USER: cn=admin,dc=company,dc=local
  KOBRA_AUTH_LDAP_BIND_PASSWORD: adminpassword
  KOBRA_AUTH_ROLES_MAPPING: '{"cn=kobra-admins,ou=groups,dc=company,dc=local": "Admin", "cn=kobra-analysts,ou=groups,dc=company,dc=local": "Alpha"}'


services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kobra
      POSTGRES_PASSWORD: kobra
      POSTGRES_DB: kobra
    volumes: [kobra-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kobra"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Схему приводит в порядок отдельный шаг — до того, как кто-то начнёт работать.
  # Так же это устроено в кластере: там это job, здесь — контейнер, который
  # отработал и вышел.
  migrate:
    build:
      context: ../../..
      dockerfile: kobra/service/backend/Dockerfile
    command: ["migrate"]
    environment: *env
    depends_on:
      db: {condition: service_healthy}

  api:
    build:
      context: ../../..
      dockerfile: kobra/service/backend/Dockerfile
    environment: *env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/readyz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../../..
      dockerfile: kobra/service/backend/Dockerfile
    command: ["worker"]
    environment: *env
    volumes: [kobra-uploads:/app/uploads]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  # Каталог для проверки входа по LDAP. Поднимается только когда нужен:
  #   docker compose --profile ldap up -d ldap
  # Наполнение — свой LDIF: нужны не просто люди, а группы, по которым
  # раздаются роли, иначе сопоставление AUTH_ROLES_MAPPING нечем проверить.
  ldap:
    image: osixia/openldap:1.5.0
    profiles: ["ldap"]
    command: ["--copy-service", "--loglevel", "warning"]
    environment:
      LDAP_ORGANISATION: Кобра
      LDAP_DOMAIN: company.local
      LDAP_ADMIN_PASSWORD: adminpassword
    volumes:
      - ./dev/ldap-seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-kobra.ldif:ro
    ports: ["1389:389"]

volumes:
  kobra-db:
  kobra-uploads:
