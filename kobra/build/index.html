/* ============================================================
   Кобра · простая правка
   Режим для тех, кому нужно поменять подписи и разрезы, а не строить
   график заново: ни «метрик», ни «агрегаций», ни конструктора.
   Своего формата не вводит — правит обычные графики дашборда.
   ============================================================ */

/* Разрезы, которые правятся в простом режиме, по одному слоту на параметр
   вида визуализации. Их бывает два: «по дате и по городу» — обычная просьба,
   и у линии, таблицы, сводной и тепловой карты второй разрез есть в самом
   графике. Нет записи — разрез у этого типа не меняется (большое число
   разреза не имеет, у комбинированного по оси X всегда время).
   `optional: true` — слот, который человек включает и убирает сам. */
const GUIDED_DIMS = {
  line: [{ spec: 'x_col' }, { spec: 'series_col', label: 'Серии', add: 'Разбить на серии', optional: true }],
  area: [{ spec: 'x_col' }, { spec: 'series_col', label: 'Серии', add: 'Разбить на серии', optional: true }],
  bar: [{ spec: 'x_col' }, { spec: 'series_col', label: 'Серии', add: 'Разбить на серии', optional: true }],
  mixed: [{ spec: 'x_col' }],
  pie: [{ spec: 'dim' }],
  funnel: [{ spec: 'dim' }],
  bullet: [{ spec: 'dim', add: 'Разбить по разрезу', optional: true }],
  big_number_trend: [{ spec: 'time_col' }],
  heatmap: [{ spec: 'y_col' }, { spec: 'x_col', label: 'Второй разрез' }],
  table: [{ spec: 'groupby[0]' }, { spec: 'groupby[1]', label: 'Второй разрез', optional: true }],
  treemap: [{ spec: 'groupby[0]' }, { spec: 'groupby[1]', label: 'Второй разрез', optional: true }],
  pivot: [{ spec: 'rows[0]' }, { spec: 'cols[0]', label: 'Столбцы', add: 'Добавить столбцы', optional: true }],
};
const GUIDED_ARR = /^(\w+)\[(\d+)\]$/;

/* Путь к параметру: `series_col` или `groupby[1]` */
function guidedParamGet(chart, spec) {
  const p = chart.params || {};
  const m = GUIDED_ARR.exec(spec);
  return m ? ((p[m[1]] || [])[+m[2]] || null) : (p[spec] || null);
}
function guidedParamSet(chart, spec, key) {
  const p = chart.params || (chart.params = {});
  const m = GUIDED_ARR.exec(spec);
  if (!m) { if (key) p[spec] = key; else delete p[spec]; return; }
  const arr = [...(p[m[1]] || [])];
  if (key) arr[+m[2]] = key; else arr.splice(+m[2], 1);
  p[m[1]] = arr.filter(Boolean);
}
/* Разрезы блока: заполненные и те, которые можно включить. У таблицы в режиме
   исходных строк группировок нет вовсе — там печатаются сами строки. */
function guidedDimSlots(ds, chart) {
  if (!chart || !GUIDED_DIMS[chart.viz]) return [];
  if (chart.viz === 'table' && (chart.params || {}).mode === 'raw') return [];
  return GUIDED_DIMS[chart.viz].map((s, nth) => {
    const key = guidedParamGet(chart, s.spec);
    const col = key ? dsCol(ds, key) : null;
    return Object.assign({ label: 'Разрез' }, s,
      { nth, key: col ? key : null, col, time: !!(col && col.type === 'date') });
  }).filter(s => s.key || s.optional);
}
/* Первый разрез — он же тот, по которому собирается заголовок */
function guidedDimKey(chart) {
  const list = chart && GUIDED_DIMS[chart.viz];
  if (!list || (chart.viz === 'table' && (chart.params || {}).mode === 'raw')) return null;
  return guidedParamGet(chart, list[0].spec);
}
/* Поля, по которым этот разрез построится: тот же тип, что и сейчас (у пустого
   слота — текстовые), без идентификаторов (по номеру документа разрез
   бессмыслен) и без того, что уже занято другим разрезом этого же блока */
function guidedDimOptions(ds, chart, slot) {
  const type = slot && slot.col ? slot.col.type : 'string';
  const busy = guidedDimSlots(ds, chart).filter(s => !slot || s.spec !== slot.spec).map(s => s.key);
  return ds.columns
    .filter(c => c.type === type && !AUTO_ID_RE.test(c.key + ' ' + (c.label || '')) && !busy.includes(c.key))
    .map(c => ({ key: c.key, label: colLabel(ds, c.key) }));
}
function guidedMainMetric(chart) {
  const p = chart.params || {};
  return p.metric || (Array.isArray(p.metrics) && p.metrics[0]) || null;
}
const GUIDED_BY = { day: 'по дням', week: 'по неделям', month: 'по месяцам', quarter: 'по кварталам', year: 'по годам' };
const GUIDED_FOR = { day: 'за день', week: 'за неделю', month: 'за месяц', quarter: 'за квартал', year: 'за год' };
/* Заголовок пересобираем только у тех графиков, которым его придумала Кобра */
function guidedRetitle(ds, chart) {
  if (!chart.autoName) return;
  const met = guidedMainMetric(chart);
  const dim = guidedDimKey(chart);
  if (!met) return;
  const t = autoMetricTitle(ds, met);
  const col = dim && dsCol(ds, dim);
  if (col && col.type === 'date') {
    // «Выручка по месяцам» у графика и «Выручка за месяц» у большого числа
    const words = chart.viz === 'big_number_trend' ? GUIDED_FOR : GUIDED_BY;
    chart.name = `${t} ${words[guidedGrainOf(chart)] || words.month}`;
    return;
  }
  if (!dim) { chart.name = t; return; }
  const label = colLabel(ds, dim);
  if (chart.viz === 'table') { const d = autoDative(label); chart.name = d ? `Показатели по ${d}` : `Показатели: ${label}`; return; }
  chart.name = autoTitleBy(t, label);
}
function guidedRename(chart, name) {
  const v = String(name || '').trim();
  if (!v) return false;
  chart.name = v;
  chart.autoName = false;   // дальше заголовок наш не трогает
  return true;
}
/* ---------- Правка придуманных данных ----------
   Работает только на макете: у настоящего набора подписи и значения трогать
   нельзя, там правятся лишь названия блоков. */
const isMockupDs = d => !!(d && d.owner && isSchemaDs(d));

/* Сохранённая метрика блока в наборе: её подпись и формат и есть «показатель» */
function guidedMetricOf(ds, chart) {
  const m = guidedMainMetric(chart);
  if (!m || m.kind !== 'saved') return null;
  return (ds.metrics || []).find(x => x.key === m.key) || null;
}
function guidedSetMetricLabel(ds, chart, text) {
  const met = guidedMetricOf(ds, chart);
  const v = String(text || '').trim();
  if (!met || !v) return false;
  met.label = v;
  persistDs(ds);
  return true;
}
function guidedSuffixOf(ds, chart) {
  const met = guidedMetricOf(ds, chart);
  if (!met) return null;
  const s = fmtSuffix(met.format);
  return s === null ? '' : s;
}
function guidedSetSuffix(ds, chart, text) {
  const met = guidedMetricOf(ds, chart);
  if (!met) return false;
  const v = String(text || '').trim();
  met.format = v ? withSuffix(v) : 'smart';
  persistDs(ds);
  return true;
}

/* Колонка схемы, по которой построен разрез. Дальше всё считается по колонке,
   а не по графику: разрезов у блока бывает два, и правятся они по отдельности. */
function guidedSchemaCol(ds, key) {
  if (!key || !isMockupDs(ds)) return null;
  const col = (ds.schema.columns || []).find(c => c.key === key);
  return col && col.type === 'string' ? col : null;
}
function guidedCats(ds, key) {
  const col = guidedSchemaCol(ds, key);
  if (!col) return null;
  const values = (col.values && col.values.length) ? col.values : schemaFallbackValues(col.label);
  return { col, values, count: values.length };
}
/* Новые названия категорий: чего человек не назвал — дополняем в его же стиле.
   Если он писал «Категория А, Категория Б», продолжаем буквами, а не цифрами:
   иначе в легенде оказывается «Категория Б» вперемешку с «Категория 3». */
const CAT_LETTERS = 'АБВГДЕЖЗИКЛМН';
function guidedCatValues(col, count, names) {
  const given = names.map(x => String(x || '').trim()).filter(Boolean);
  const n = Math.max(2, Math.min(+count || 0, 12));
  const letterStyle = given.length ? /^(.*?) ([А-Я])$/.exec(given[given.length - 1]) : null;
  const base = schemaFallbackValues(col.label);
  const out = [];
  for (let i = 0; i < n; i++) {
    if (given[i]) { out.push(given[i]); continue; }
    if (letterStyle) { out.push(`${letterStyle[1]} ${CAT_LETTERS[i % CAT_LETTERS.length]}`); continue; }
    out.push(base[i % base.length].replace(/\s\d+$/, ' ' + (i + 1)));
  }
  return out;
}
/* Меняет категории в скрытом наборе и пересчитывает строки тем же seed.
   Возвращает старый и новый списки: по ним потом чинятся фильтры дашборда. */
function guidedSetCats(ds, key, count, names) {
  const cur = guidedCats(ds, key);
  if (!cur) return null;
  const next = guidedCatValues(cur.col, count, names);
  if (JSON.stringify(next) === JSON.stringify(cur.values)) return null;
  cur.col.values = next;
  ds.rows = generateSchemaRows(ds.schema);
  delete ds._maxCache;
  persistDs(ds);
  return { col: cur.col.key, old: cur.values, next };
}

/* Второй разрез на макете: берём свободную текстовую колонку схемы, а если
   все заняты — дописываем новую и пересчитываем строки. Данные всё равно
   придуманные, зато «по департаменту и по городу» собирается без конструктора. */
function guidedAddMockDim(ds, chart) {
  const cols = ds.schema.columns || [];
  const busy = guidedDimSlots(ds, chart).map(s => s.key).filter(Boolean);
  const free = cols.find(c => c.type === 'string' && !busy.includes(c.key));
  if (free) return free;
  const label = 'Разрез ' + (cols.filter(c => c.type === 'string').length + 1);
  const col = { key: slugKey(label, cols.length, new Set(cols.map(c => c.key))), label, type: 'string',
    values: guidedCatValues({ label }, 4, ['Категория А']) };
  cols.push(col);
  ds.columns.push({ key: col.key, label, type: 'string' });
  ds.rows = generateSchemaRows(ds.schema);
  delete ds._maxCache;
  persistDs(ds);
  return col;
}

/* У блоков со временем разрез — это сама дата, выбирать тут нечего.
   Зато полезно менять шаг: день, неделя, месяц, квартал, год. */
const GUIDED_GRAIN = { line: 'x_grain', area: 'x_grain', bar: 'x_grain', mixed: 'x_grain', heatmap: 'x_grain',
  table: 'time_grain', big_number_trend: 'x_grain', pivot: 'time_grain' };
function guidedGrainOf(chart) {
  const p = chart.params || {};
  return p[GUIDED_GRAIN[chart.viz]] || 'month';
}
function guidedSetGrain(chart, grain) {
  const key = GUIDED_GRAIN[chart.viz];
  if (!key) return false;
  chart.params[key] = grain;
  return true;
}

/* Разрез в макете — это подпись колонки: человеку всё равно, как она
   называется внутри, ему важно, что написано на экране */
function guidedDimLabel(ds, key) {
  const col = guidedSchemaCol(ds, key);
  return col ? col.label : null;
}
function guidedRenameDim(ds, key, text) {
  const col = guidedSchemaCol(ds, key);
  const v = String(text || '').trim();
  if (!col || !v || col.label === v) return false;
  col.label = v;
  const c = (ds.columns || []).find(x => x.key === col.key);
  if (c) c.label = v;
  persistDs(ds);
  return true;
}
/* Другая форма распределения: подписи те же, пропорции другие */
function guidedCycleSpread(ds, key) {
  const col = guidedSchemaCol(ds, key);
  if (!col) return false;
  col.spread = ((col.spread || 0) + 1) % SCHEMA_SPREADS;
  ds.rows = generateSchemaRows(ds.schema);
  delete ds._maxCache;
  persistDs(ds);
  return true;
}

/* Что человек меняет в этом блоке: словами задачи, без терминов движка */
function guidedWhat(ds, chart) {
  const met = guidedMainMetric(chart);
  return met ? autoMetricTitle(ds, met) : 'строки набора';
}

/* ============================================================
   Кобра · помощник на дашборде
   Человек описывает задачу словами — помощник предлагает состав
   дашборда или описание данных. Ничего не применяется без
   подтверждения, наружу уходит описание, а не строки данных.
   ============================================================ */
const AI_LS_CFG = 'kobra.ai.cfg';          // адрес, токен и модель — только в этом браузере
const AI_MAX_MSGS = 40;                     // предел хранимой переписки
const AI_SAMPLE_ROWS = 20;                  // сколько строк уходит при согласии
const AI_CSV_MAX = 50000;

/* ---------- Доступ к модели ---------- */
/* Транспорт назван по протоколу, а не по имени шлюза: один и тот же код
   работает с личным эндпоинтом и с LiteLLM компании — меняется настройка. */
function aiCfg() {
  const c = lsGet(AI_LS_CFG) || {};
  return { url: c.url || '', token: c.token || '', model: c.model || '', sendSamples: false };
}
function aiSaveCfg(cfg) { lsSet(AI_LS_CFG, { url: cfg.url || '', token: cfg.token || '', model: cfg.model || '' }); }
const aiReady = () => { const c = aiCfg(); return !!(c.url && c.model); };

/* Обращение к OpenAI-совместимому эндпоинту. Ошибки разделяем по видам:
   человеку нужно знать, чинить доступ, ждать лимита или смотреть сеть. */
async function aiAsk(messages) {
  const c = aiCfg();
  if (!c.url || !c.model) throw Object.assign(new Error('доступ к модели не настроен'), { kind: 'no_access' });
  const url = c.url.replace(/\/+$/, '') + (/\/chat\/completions$/.test(c.url) ? '' : '/chat/completions');
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, c.token ? { Authorization: 'Bearer ' + c.token } : {}),
      body: JSON.stringify({ model: c.model, messages, temperature: 0.2 }),
    });
  } catch (e) {
    // Сюда же приходит запрет по CORS: браузер не отличает его от обрыва сети
    throw Object.assign(new Error('сеть недоступна или шлюз не разрешает запрос из браузера'), { kind: 'network' });
  }
  if (res.status === 401 || res.status === 403) throw Object.assign(new Error('доступ отклонён: проверьте токен'), { kind: 'no_access' });
  if (res.status === 429) throw Object.assign(new Error('превышен лимит обращений'), { kind: 'limit' });
  if (!res.ok) throw Object.assign(new Error(`шлюз ответил ${res.status}`), { kind: 'http' });
  const data = await res.json().catch(() => null);
  const text = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (!text) throw Object.assign(new Error('ответ не разобрать'), { kind: 'parse' });
  return String(text);
}

/* ---------- Бриф: первый диалог ----------
   Четыре вопроса, которые заказчик и так держит в голове, плюс уточнения.
   Форма необязательная — её закрывают, если макет уже начат и от помощника
   нужно только дополнение. Ответы хранятся в дашборде и уходят с каждым
   запросом отдельным разделом: модель перестаёт угадывать название,
   показатели и разрезы. `tag` — короткая подпись для запроса: в форме вопрос
   звучит по-человечески, а в промпте нужна одна строка без вопросительного знака. */
const AI_BRIEF_FIELDS = [
  { key: 'title', tag: 'Название дашборда', label: 'Название дашборда', ph: 'Продажи филиалов' },
  { key: 'problem', tag: 'Какие проблемы решает', label: 'Какие проблемы поможет решить дашборд?', ph: 'Не видно, где падает выручка и из-за чего', area: true },
  { key: 'metrics', tag: 'Показатели, за которыми следят', label: 'За какими показателями необходимо следить?', ph: 'Выручка, средний чек, доля возвратов' },
  { key: 'docs', tag: 'Проваливаться до документов', label: 'Необходимо ли проваливаться до документов?', pick: ['да', 'нет'],
    hint: 'Нижний уровень — таблица исходных строк: заказы, заявки, чеки' },
  { key: 'dims', tag: 'Разрезы', label: 'В каких разрезах смотрите?', ph: 'Филиалы, категории, менеджеры', more: true },
  { key: 'period', tag: 'Период и шаг', label: 'Период и шаг', ph: 'Последний год по месяцам', more: true },
  { key: 'compare', tag: 'С чем сравнивать', label: 'С чем сравнивать', ph: 'План, прошлый год, норматив', more: true },
  { key: 'who', tag: 'Кто смотрит и как часто', label: 'Кто смотрит и как часто', ph: 'Директор раз в неделю', more: true },
];
const aiBrief = D => (D && D.chatBrief) || null;
const aiBriefFilled = b => !!b && AI_BRIEF_FIELDS.some(f => String(b[f.key] || '').trim());
/* В запрос идёт только отвеченное: пустые пункты модель принимает за задачу
   и начинает выспрашивать их вместо того, чтобы собирать дашборд. */
function aiBriefLines(b) {
  if (!b) return [];
  return AI_BRIEF_FIELDS.map(f => {
    const v = String(b[f.key] || '').trim();
    return v ? f.tag + ': ' + v : null;
  }).filter(Boolean);
}

/* ---------- Что уходит наружу ----------
   Единственное место сборки отправляемого: его целиком можно показать
   человеку и службе безопасности. Строк здесь нет, пока не разрешили. */
function aiContext(D, ds, { samples } = {}) {
  const out = { бриф: null, набор: null, дашборд: null };
  if (aiBriefFilled(aiBrief(D))) out.бриф = aiBriefLines(aiBrief(D));
  if (ds) {
    out.набор = {
      название: ds.name,
      придуманные_данные: !!isMockupDs(ds) || !!isSchemaDs(ds),
      колонки: ds.columns.map(c => ({ поле: c.key, подпись: c.label || c.key, тип: c.type })),
      показатели: (ds.metrics || []).map(m => ({ подпись: m.label, формула: exprText(ds, m.expr) })),
      строк: ds.rows.length,
    };
    if (samples) out.набор.примеры_строк = ds.rows.slice(0, AI_SAMPLE_ROWS);
  }
  if (D) {
    out.дашборд = {
      название: D.title,
      вкладки: D.tabs.map(t => ({
        название: t.title,
        блоки: t.items.filter(i => i.chartId && STATE.charts[i.chartId]).map(i => {
          const c = STATE.charts[i.chartId];
          return { название: c.name, вид: (VIZ[c.viz] || {}).label || c.viz };
        }),
      })),
      фильтры: (D.filters || []).map(f => ({ название: f.name, поле: f.col })),
    };
  }
  return out;
}

/* Текст запроса: бриф и контекст разделены явными границами. Без них модель
   путает ответы заказчика с описанием набора и отвечает на бриф, а не на
   задачу. Собирается из того же `aiContext`, второго источника нет. */
function aiPrompt(q, ctx) {
  const rest = Object.assign({}, ctx);
  const brief = rest.бриф;
  delete rest.бриф;
  const parts = ['Задача: ' + (String(q || '').trim() || '(опишите задачу)')];
  if (brief && brief.length) parts.push('=== БРИФ (ответы заказчика) ===\n' + brief.join('\n') + '\n=== КОНЕЦ БРИФА ===');
  parts.push('=== КОНТЕКСТ (набор и дашборд) ===\n' + JSON.stringify(rest, null, 1) + '\n=== КОНЕЦ КОНТЕКСТА ===');
  return parts.join('\n\n');
}

/* ---------- Что помощник умеет вернуть ---------- */
const AI_SYSTEM = [
  'Ты помогаешь собрать дашборд в конструкторе «Кобра». Отвечай по-русски и только JSON, без пояснений вокруг.',
  'Формат ответа: {"ответ": "<текст человеку>", "блоки": [...], "набор": {...}}. Поля «блоки» и «набор» необязательны.',
  'Блок: {"вид": "line|bar|pie|area|table|treemap|heatmap|funnel|pivot|big_number_trend", "название": "...", "зачем": "на какой вопрос отвечает"}.',
  'Набор (только если человек просит придумать данные): {"колонки": [{"подпись": "Дата заявки", "тип": "date|string|number", "значения": ["..."], "от": 1, "до": 1000}], "строк": 2000}.',
  'Строки данных не придумывай и не присылай: их сгенерирует Кобра по описанию колонок.',
  'Раздел БРИФ — требования заказчика, а не задача: выполняй то, что в «Задача», опираясь на бриф.',
  'Из брифа бери название и подписи блоков под его показатели, категории — под его разрезы. «Проваливаться до документов: да» значит, что нужен блок с таблицей исходных строк.',
  'Если запрос не про дашборд и не про данные, верни только «ответ».',
].join('\n');

function aiParse(text) {
  const raw = String(text || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  let j;
  try { j = JSON.parse(raw); } catch (e) {
    const m = raw.match(/\{[\s\S]*\}/);
    if (!m) return { ответ: raw, blocks: [], schema: null, plain: true };
    try { j = JSON.parse(m[0]); } catch (e2) { return { ответ: raw, blocks: [], schema: null, plain: true }; }
  }
  const blocks = (Array.isArray(j.блоки) ? j.блоки : []).map(b => ({
    viz: String(b.вид || '').trim(), name: String(b.название || '').trim(), why: String(b.зачем || '').trim(),
  })).filter(b => VIZ[b.viz] && MOCKUP_BLOCKS.some(x => x.viz === b.viz));   // неизвестный вид отбрасываем
  const sc = j.набор && Array.isArray(j.набор.колонки) ? j.набор : null;
  const schema = sc ? aiSchemaFrom(sc) : null;
  return { ответ: String(j.ответ || '').trim(), blocks, schema, plain: false };
}
/* Описание колонок от модели → схема набора Кобры. Непонятное отбрасываем:
   лучше собрать меньше, чем построить набор на выдуманных типах. */
function aiSchemaFrom(sc) {
  const used = new Set();
  const columns = sc.колонки.map((c, i) => {
    const label = String(c.подпись || '').trim();
    if (!label) return null;
    const type = ['date', 'string', 'number'].includes(c.тип) ? c.тип : guessSchemaCol(label).type;
    const col = Object.assign({ key: slugKey(label, i, used), label, type }, guessSchemaCol(label), { type });
    if (type === 'string' && Array.isArray(c.значения) && c.значения.length) col.values = c.значения.map(String).slice(0, 12);
    if (type === 'number') { if (c.от != null) col.min = +c.от; if (c.до != null) col.max = +c.до; }
    return col;
  }).filter(Boolean);
  if (!columns.length) return null;
  return Object.assign({ seed: (Date.now() % 100000) + 1, rowCount: Math.min(Math.max(+sc.строк || 2000, 100), SCHEMA_ROWS_MAX), columns }, defaultSchemaPeriod());
}

/* Показ длинного текста: состав отправляемого и запрос для внешнего чата */
function showTextModal(title, text) {
  const area = h('textarea', { class: 'textarea', rows: 18, readonly: true, 'aria-label': title });
  area.value = text;
  openModal({ title, wide: true, body: area, foot: close => [h('button', { class: 'btn primary', onclick: close }, 'Закрыть')] });
}

/* ---------- Переписка ---------- */
function aiLog(D) { return (D.chat = D.chat || []); }
function aiPush(D, role, text, extra) {
  const log = aiLog(D);
  log.push(Object.assign({ role, text, at: Date.now() }, extra || {}));
  if (log.length > AI_MAX_MSGS) { D.chatTrimmed = true; log.splice(0, log.length - AI_MAX_MSGS); }
  saveSoon();
  return log[log.length - 1];
}

/* ---------- Выгрузка придуманных строк ---------- */
function aiRowsToCsv(ds) {
  const cols = ds.columns;
  const esc = v => { const s = v == null ? '' : String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [cols.map(c => esc(c.label || c.key)).join(',')];
  ds.rows.slice(0, AI_CSV_MAX).forEach(r => lines.push(cols.map(c => {
    const v = r[c.key];
    return esc(c.type === 'date' && typeof v === 'number' ? isoDate(v) : v);
  }).join(',')));
  return lines.join('\n');
}
async function aiExportCsv(ds) {
  const n = Math.min(ds.rows.length, AI_CSV_MAX);
  const cut = ds.rows.length > AI_CSV_MAX ? ` Это первые ${fmtNum(AI_CSV_MAX, 'int')} из ${fmtNum(ds.rows.length, 'int')}.` : '';
  if (!(await confirmDialog('Выгрузить данные в CSV',
    `Будет выгружено ${fmtNum(n, 'int')} ${plural(n, 'строка', 'строки', 'строк')} и ${ds.columns.length} ${plural(ds.columns.length, 'колонка', 'колонки', 'колонок')}.${cut} Данные придуманные.`,
    'Выгрузить', false))) return;
  const name = `kobra-vymyshlennye-dannye-${slugKey(ds.name, 0, new Set())}-${isoDate(Date.now())}.csv`;
  if (downloadFile(name, '﻿' + aiRowsToCsv(ds), 'text/csv')) toast('Файл сохранён');
}

/* ---------- Панель помощника ---------- */
const aiOpenState = () => lsGet('kobra.ai.open') || {};
const aiIsOpen = id => !!aiOpenState()[id];
function aiSetOpen(id, v) { const s = aiOpenState(); if (v) s[id] = 1; else delete s[id]; lsSet('kobra.ai.open', s); }

/* api: { ds, applyBlocks, applySchema, rollback, canRollback } — всё, что помощник
   умеет сделать с дашбордом, живёт в dashboard.js и приходит сюда функциями. */
function renderAssistant(D, host, api) {
  let pending = null;      // последнее предложение, которого ещё не применили
  let samples = false;     // согласие приложить примеры строк — на один запрос
  let busy = false;
  // Бриф показываем первым, пока на него не ответили и не закрыли
  let briefOpen = !aiBriefFilled(aiBrief(D)) && !D.chatBriefSkipped && !aiLog(D).length;
  const ds = () => api.ds();

  /* Форма брифа. Живёт в переписке и закрывается крестиком: человек, который
     уже собрал половину макета, не должен отвечать на восемь вопросов, чтобы
     попросить добавить один блок. */
  const briefForm = () => {
    const draft = Object.assign({ title: D.title || '' }, aiBrief(D) || {});
    const box = h('div', { class: 'ai-form' });
    box.appendChild(h('div', { class: 'ai-form-head' }, h('b', null, 'Коротко о дашборде'), h('div', { class: 'grow' }),
      iconBtn('x', 'Закрыть форму', () => { briefOpen = false; D.chatBriefSkipped = true; saveSoon(); paint(); }, 'sm')));
    box.appendChild(h('div', { class: 'ai-note' },
      'Ответы уходят с каждым запросом отдельным разделом — помощник меньше придумывает от себя. Можно заполнить частью или закрыть.'));
    const add = (to, f) => {
      let ctl;
      if (f.pick) ctl = selectEl([['', 'Не указано']].concat(f.pick.map(v => [v, v[0].toUpperCase() + v.slice(1)])),
        draft[f.key] || '', v => { draft[f.key] = v; }, { 'aria-label': f.label });
      else {
        ctl = h(f.area ? 'textarea' : 'input', Object.assign({ class: f.area ? 'textarea' : 'input', placeholder: f.ph || '',
          oninput: e => { draft[f.key] = e.target.value; } }, f.area ? { rows: 2 } : { type: 'text' }));
        ctl.value = draft[f.key] || '';
      }
      to.appendChild(field(f.label, ctl, f.hint));
    };
    AI_BRIEF_FIELDS.filter(f => !f.more).forEach(f => add(box, f));
    const more = h('details', null, h('summary', null, 'Уточнить ещё: разрезы, период, сравнение'));
    AI_BRIEF_FIELDS.filter(f => f.more).forEach(f => add(more, f));
    box.appendChild(more);

    const keep = async fire => {
      const b = {};
      AI_BRIEF_FIELDS.forEach(f => { const v = String(draft[f.key] || '').trim(); if (v) b[f.key] = v; });
      if (!aiBriefFilled(b)) { toast('Форма пустая: ответьте хотя бы на один вопрос или закройте её', true); return; }
      D.chatBrief = b;
      delete D.chatBriefSkipped;
      if (b.title && b.title !== D.title && api.renameDash) api.renameDash(b.title);
      saveState();
      aiPush(D, 'system', 'Бриф сохранён:\n' + aiBriefLines(b).join('\n'));
      briefOpen = false;
      if (fire) { paint(); await send('Собери дашборд по брифу: уровни детализации по вкладкам и блоки под показатели.'); return; }
      toast('Бриф сохранён — он уходит с каждым запросом');
      paint();
    };
    box.appendChild(h('div', { class: 'ai-row' },
      h('button', { class: 'btn sm primary', onclick: () => keep(true) }, ic('cobra'), 'Собрать по брифу'),
      h('button', { class: 'btn sm', title: 'Запомнить ответы, запрос отправлю сам', onclick: () => keep(false) }, 'Сохранить'),
      h('button', { class: 'btn sm', onclick: () => { briefOpen = false; D.chatBriefSkipped = true; saveSoon(); paint(); } }, 'Пропустить')));
    return box;
  };

  const paint = () => {
    clear(host);
    const mock = isMockupDs(ds());
    host.appendChild(h('div', { class: 'ai-head' }, ic('cobra'), h('b', null, 'Помощник'),
      h('div', { class: 'grow' }),
      iconBtn('settings', 'Доступ к модели', () => openAiSettings(paint), 'sm'),
      iconBtn('x', 'Закрыть помощника', () => { aiSetOpen(D.id, false); api.close(); }, 'sm')));

    const log = h('div', { class: 'ai-log' });
    if (D.chatTrimmed) log.appendChild(h('div', { class: 'ai-note' }, 'Часть старых сообщений отброшена: переписка хранится не целиком.'));
    if (briefOpen) log.appendChild(briefForm());
    else if (!aiLog(D).length) log.appendChild(h('div', { class: 'ai-note' },
      mock ? 'Опишите свой процесс словами — помощник придумает под него данные и предложит блоки. Например: «заявки на кредит: приходят в отделения, проходят скоринг, часть одобряем».'
        : 'Опишите, что хотите увидеть на дашборде. Помощник предложит блоки, а применять их или нет — решаете вы.'));
    aiLog(D).forEach(m => {
      const el = h('div', { class: 'ai-msg ' + m.role });
      el.appendChild(h('div', { class: 'ai-text' }, m.text));
      if (m.blocks && m.blocks.length) el.appendChild(h('ul', { class: 'ai-blocks' },
        m.blocks.map(b => h('li', null, h('b', null, b.name || (VIZ[b.viz] || {}).label || b.viz), b.why ? ' — ' + b.why : ''))));
      if (m.schemaCols) el.appendChild(h('ul', { class: 'ai-blocks' },
        m.schemaCols.map(c => h('li', null, h('b', null, c.label), ' — ' + c.note))));
      log.appendChild(el);
    });
    host.appendChild(log);
    setTimeout(() => { log.scrollTop = log.scrollHeight; }, 0);

    // Предложение: применяем только по подтверждению
    if (pending) {
      const what = [];
      if (pending.blocks.length) what.push(`${pending.blocks.length} ${plural(pending.blocks.length, 'блок', 'блока', 'блоков')}`);
      if (pending.schema) what.push('новые придуманные данные');
      host.appendChild(h('div', { class: 'ai-offer' },
        h('div', null, 'Применить предложенное: ' + what.join(' и ') + '?'),
        h('div', { class: 'ai-row' },
          h('button', { class: 'btn sm primary', onclick: () => {
            if (pending.schema) api.applySchema(pending.schema);
            if (pending.blocks.length) api.applyBlocks(pending.blocks);
            aiPush(D, 'system', 'Применено. Если не то — откатите одним действием.');
            pending = null; paint();
          } }, ic('check'), 'Применить'),
          h('button', { class: 'btn sm', onclick: () => { pending = null; paint(); } }, 'Не надо'))));
    } else if (api.canRollback()) {
      host.appendChild(h('div', { class: 'ai-offer' },
        h('div', null, 'Последнее применение можно отменить.'),
        h('div', { class: 'ai-row' }, h('button', { class: 'btn sm', onclick: () => { api.rollback(); aiPush(D, 'system', 'Откатано.'); paint(); } }, ic('reset'), 'Откатить'))));
    }

    // Ввод
    const ta = h('textarea', { class: 'textarea ai-input', rows: 3, placeholder: 'Что показать на дашборде?', 'aria-label': 'Запрос помощнику' });
    const send = async forced => {
      const q = String(forced || ta.value).trim();
      if (!q || busy) return;
      if (!aiReady()) { toast('Доступ к модели не настроен — воспользуйтесь переносом вручную', true); return; }
      busy = true; paint();
      aiPush(D, 'user', q);
      try {
        const text = await aiAsk([{ role: 'system', content: AI_SYSTEM },
          { role: 'user', content: aiPrompt(q, aiContext(D, ds(), { samples })) }]);
        takeAnswer(text);
      } catch (e) {
        aiPush(D, 'system', 'Не получилось: ' + e.message + (e.kind === 'no_access' ? ' Проверьте настройки доступа.' : e.kind === 'network' ? ' Можно перенести запрос вручную.' : ''));
        if (!forced) ta.value = q;   // введённое не теряем
      }
      samples = false; busy = false; paint();
      if (ta.isConnected) ta.focus();
    };
    const takeAnswer = text => {
      const r = aiParse(text);
      const extra = {};
      if (r.blocks.length) extra.blocks = r.blocks;
      if (r.schema) extra.schemaCols = r.schema.columns.map(c => ({
        label: c.label, note: c.type === 'date' ? 'даты' : c.type === 'number' ? `числа ${c.min ?? '?'}–${c.max ?? '?'}` : (c.values ? c.values.join(', ') : 'категории'),
      }));
      // Подменять настоящие данные придуманными нельзя — предложение режем на входе
      const schema = isMockupDs(ds()) ? r.schema : null;
      if (r.schema && !schema) delete extra.schemaCols;
      aiPush(D, 'assistant', r.ответ || (r.blocks.length || schema ? 'Вот что предлагаю.' : 'Не понял запрос.'), extra);
      if (r.schema && !schema) aiPush(D, 'system', 'Придуманные данные не подставляю: этот дашборд построен на настоящем наборе.');
      pending = (r.blocks.length || schema) ? { blocks: r.blocks, schema } : null;
    };

    host.appendChild(ta);
    const real = ds() && !isMockupDs(ds()) && !isSchemaDs(ds());
    const row = h('div', { class: 'ai-row' },
      h('button', { class: 'btn sm primary', disabled: busy, onclick: send }, busy ? 'Спрашиваю…' : 'Отправить'),
      h('button', { class: 'btn sm', onclick: () => showTextModal('Что уходит наружу', aiPrompt(ta.value, aiContext(D, ds(), { samples }))) }, 'Что уйдёт'),
      h('button', { class: 'btn sm', title: 'Скопировать готовый запрос для внешнего чата', onclick: async () => {
        const txt = AI_SYSTEM + '\n\n' + aiPrompt(ta.value, aiContext(D, ds(), { samples }));
        try { await navigator.clipboard.writeText(txt); toast('Запрос скопирован: вставьте во внешний чат'); }
        catch (e) { showTextModal('Запрос для внешнего чата', txt); }
      } }, 'Скопировать запрос'),
      h('button', { class: 'btn sm', title: 'Вставить ответ, полученный во внешнем чате', onclick: () => {
        const area = h('textarea', { class: 'textarea', rows: 10, placeholder: 'Вставьте сюда ответ внешнего чата' });
        openModal({ title: 'Ответ из внешнего чата', wide: true, body: area,
          foot: close => [h('button', { class: 'btn', onclick: close }, 'Отмена'),
            h('button', { class: 'btn primary', onclick: () => { close(); takeAnswer(area.value); paint(); } }, 'Разобрать')] });
      } }, 'Вставить ответ'));
    if (!briefOpen) row.appendChild(h('button', { class: 'btn sm', title: 'Ответы о дашборде, которые уходят с каждым запросом',
      onclick: () => { briefOpen = true; paint(); } }, ic('edit'), aiBriefFilled(aiBrief(D)) ? 'Бриф' : 'Заполнить бриф'));
    host.appendChild(row);
    if (real) host.appendChild(checkbox('Приложить к запросу ' + AI_SAMPLE_ROWS + ' строк данных (на один раз)', samples, v => { samples = v; }));
    else host.appendChild(h('div', { class: 'ai-note' }, 'Данные придуманы, поэтому наружу уходят только названия полей и состав дашборда.'));
    if (isMockupDs(ds())) host.appendChild(h('button', { class: 'btn sm', style: { marginTop: '8px' }, onclick: () => aiExportCsv(ds()) }, ic('download'), 'Выгрузить данные в CSV'));
    if (!aiReady()) host.appendChild(h('div', { class: 'ai-note' },
      'Доступ к модели не настроен: укажите адрес и модель в шестерёнке — или работайте переносом вручную, он не требует ни ключей, ни сети.'));
  };
  paint();
  return { repaint: paint };
}

/* ============================================================
   Кобра · обмен файлами
   Прототип живёт в одном браузере, поэтому шаблон, дашборд и данные
   передаются файлом .kobra.json: «шаблон» — только структура,
   «проект» — вместе со строками данных.
   ============================================================ */
const KOBRA_FILE_V = 1;
const LS_AUTHOR = 'kobra.author';

/* ---------- Сборка файла ---------- */
function collectRefs(dashIds, includeLoose) {
  const dashboards = {}, charts = {}, dsIds = new Set();
  dashIds.forEach(id => {
    const d = STATE.dashboards[id];
    if (!d) return;
    dashboards[id] = clone(d);
    delete dashboards[id].chat;          // переписка с помощником — личное, в файл не уходит
    delete dashboards[id].chatTrimmed;
    d.tabs.forEach(t => t.items.forEach(i => { if (i.chartId && STATE.charts[i.chartId]) charts[i.chartId] = clone(STATE.charts[i.chartId]); }));
    (d.filters || []).forEach(f => { if (f.datasetId) dsIds.add(f.datasetId); });
  });
  if (includeLoose) {
    const used = new Set();
    Object.values(STATE.dashboards).forEach(d => d.tabs.forEach(t => t.items.forEach(i => i.chartId && used.add(i.chartId))));
    Object.values(STATE.charts).forEach(c => { if (!used.has(c.id)) charts[c.id] = clone(c); });
  }
  Object.values(charts).forEach(c => dsIds.add(c.datasetId));
  return { dashboards, charts, dsIds: [...dsIds] };
}

/* Схема по колонкам готового набора: типы берём настоящие, значения и
   диапазоны придумываем по названиям — из реальных данных не подглядываем. */
function schemaFromColumns(columns, rowCount) {
  return Object.assign({ seed: 7, rowCount: rowCount || SCHEMA_ROWS_DEF, columns: columns.map(c => {
    const g = guessSchemaCol(c.label || c.key);
    const col = { key: c.key, label: c.label || c.key, type: c.type };
    if (c.type === 'number') { col.min = g.min != null ? g.min : 1; col.max = g.max != null ? g.max : 1000; col.decimals = g.decimals || 0; }
    if (c.type === 'string') { col.values = g.values || null; if (g.ids) col.ids = true; }
    return col;
  }) }, defaultSchemaPeriod());
}

function datasetForExport(d, withData, fakeData) {
  if (d.builtin) return { id: d.id, name: d.name, builtin: true };
  if (isSchemaDs(d)) return { id: d.id, name: d.name, kind: 'schema', schema: d.schema, columns: clone(d.columns), metrics: clone(d.metrics), mainDttm: d.mainDttm, description: d.description || '' };
  const base = { id: d.id, name: d.name, kind: 'upload', fileName: d.fileName || '', columns: clone(d.columns), metrics: clone(d.metrics), mainDttm: d.mainDttm, description: d.description || '' };
  if (withData) return Object.assign(base, { rows: d.rows });
  if (fakeData) return Object.assign(base, { kind: 'schema', fromUpload: true, schema: schemaFromColumns(d.columns, Math.min(d.rows.length || SCHEMA_ROWS_DEF, SCHEMA_ROWS_MAX)), description: SCHEMA_NOTE });
  return Object.assign(base, { noRows: true });
}

function buildExport({ dashIds, includeLoose, withData, fakeData, author, note }) {
  const { dashboards, charts, dsIds } = collectRefs(dashIds, includeLoose);
  const datasets = [], dsMetrics = {};
  dsIds.forEach(id => {
    const d = DS[id];
    if (!d) return;
    datasets.push(datasetForExport(d, withData, fakeData));
    if (d.builtin && (STATE.dsMetrics[id] || []).length) dsMetrics[id] = clone(STATE.dsMetrics[id]);
  });
  return {
    kobra: KOBRA_FILE_V, app: 'Кобра', kind: withData ? 'project' : 'template',
    exportedAt: new Date().toISOString(), author: author || '', note: note || '',
    dashboards, charts, datasets, dsMetrics,
  };
}

function exportFileName(dashIds, withData) {
  const first = dashIds.length === 1 ? STATE.dashboards[dashIds[0]] : null;
  const slug = first ? slugKey(first.title, 0, new Set()) : (withData ? 'proekt' : 'shablon');
  return `kobra-${slug}-${isoDate(Date.now())}.kobra.json`;
}

/* ---------- Диалог экспорта ---------- */
function openExportDialog(presetDashId) {
  const all = Object.values(STATE.dashboards).sort((a, b) => (b.updated || 0) - (a.updated || 0));
  const picked = new Set(presetDashId && STATE.dashboards[presetDashId] ? [presetDashId] : all.map(d => d.id));
  let withData = false, fakeData = true, includeLoose = false;
  let author = lsGet(LS_AUTHOR) || '';
  let note = '';
  const body = h('div');
  const size = h('div', { class: 'muted', style: { fontSize: '12.5px' } });

  const recount = () => {
    if (!picked.size && !includeLoose) { size.textContent = 'Не выбрано ни одного дашборда.'; return; }
    try {
      const json = JSON.stringify(buildExport({ dashIds: [...picked], includeLoose, withData, fakeData, author, note }));
      const kb = new Blob([json]).size / 1024;
      const { charts, dsIds } = collectRefs([...picked], includeLoose);
      size.textContent = `В файле: ${picked.size} ${plural(picked.size, 'дашборд', 'дашборда', 'дашбордов')}, `
        + `${Object.keys(charts).length} ${plural(Object.keys(charts).length, 'график', 'графика', 'графиков')}, `
        + `${dsIds.length} ${plural(dsIds.length, 'набор', 'набора', 'наборов')} данных. Размер — `
        + (kb > 1024 ? (kb / 1024).toFixed(1) + ' МБ' : Math.max(1, Math.round(kb)) + ' КБ') + '.';
    } catch (e) { size.textContent = 'Не удалось оценить размер: ' + e.message; }
  };

  const paint = () => {
    clear(body);
    body.appendChild(h('div', { class: 'field' }, h('div', { class: 'lbl' }, 'Что вкладываем'),
      h('div', { class: 'seg' },
        h('button', { class: withData ? '' : 'on', onclick: () => { withData = false; paint(); } }, 'Шаблон для передачи — без данных'),
        h('button', { class: withData ? 'on' : '', onclick: () => { withData = true; paint(); } }, 'Проект — с данными')),
      h('div', { class: 'hint' }, withData
        ? 'Строки загруженных наборов попадут в файл. Не отправляйте его по открытым каналам, если данные чувствительные.'
        : 'Только структура: дашборды, графики, метрики и описания наборов. Строки загруженных файлов не вкладываются.')));
    if (!withData) body.appendChild(checkbox('Подставить вымышленные данные, чтобы графики не были пустыми', fakeData, v => { fakeData = v; recount(); }));

    const list = h('div', { style: { display: 'grid', gap: '4px', marginTop: '4px' } });
    all.forEach(d => list.appendChild(checkbox(d.title, picked.has(d.id), v => { v ? picked.add(d.id) : picked.delete(d.id); recount(); })));
    body.appendChild(h('div', { class: 'field' }, h('div', { class: 'lbl' }, 'Дашборды'),
      all.length ? list : h('p', { class: 'muted', style: { fontSize: '13px', margin: 0 } }, 'Дашбордов пока нет.')));
    body.appendChild(checkbox('Добавить графики, которых нет ни на одном дашборде', includeLoose, v => { includeLoose = v; recount(); }));

    body.appendChild(h('div', { class: 'row2', style: { marginTop: '12px' } },
      field('Автор', h('input', { class: 'input', value: author, placeholder: 'Кто отправляет', oninput: e => { author = e.target.value; } })),
      field('Комментарий', h('input', { class: 'input', value: note, placeholder: 'Например: макет на согласование', oninput: e => { note = e.target.value; } }))));
    body.appendChild(size);
    recount();
  };
  paint();

  openModal({
    title: 'Экспорт в файл', wide: true, body,
    foot: close => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', {
        class: 'btn primary', onclick: () => {
          const dashIds = [...picked];
          if (!dashIds.length && !includeLoose) { toast('Выберите хотя бы один дашборд', true); return; }
          const payload = buildExport({ dashIds, includeLoose, withData, fakeData, author, note });
          if (author.trim()) lsSet(LS_AUTHOR, author.trim());
          if (downloadFile(exportFileName(dashIds, withData), JSON.stringify(payload, null, 1))) {
            close();
            toast(withData ? 'Проект сохранён в файл' : 'Шаблон для передачи сохранён в файл');
          }
        },
      }, ic('download'), 'Скачать файл')],
  });
}

/* ---------- Импорт ---------- */
function validatePayload(p) {
  if (!p || typeof p !== 'object') throw new Error('это не файл Кобры');
  if (p.kobra !== KOBRA_FILE_V) throw new Error(p.kobra ? `версия файла ${p.kobra} не поддерживается` : 'в файле нет пометки Кобры');
  if (!p.dashboards || !p.charts) throw new Error('в файле нет дашбордов и графиков');
  return p;
}

async function importPayload(p, mode) {
  const dsMap = {}, chMap = {};
  // Наборы данных
  for (const d of p.datasets || []) {
    if (d.builtin) {
      dsMap[d.id] = d.id;
      const extra = (p.dsMetrics || {})[d.id] || [];
      if (extra.length && DS[d.id]) {
        const have = new Set((STATE.dsMetrics[d.id] || []).map(m => m.key));
        STATE.dsMetrics[d.id] = [...(STATE.dsMetrics[d.id] || []), ...extra.filter(m => !have.has(m.key))];
      }
      continue;
    }
    const collide = !!STATE.datasets[d.id];
    const id = (mode === 'copy' && collide) ? uid('ds_') : d.id;
    dsMap[d.id] = id;
    const meta = {
      id, name: d.name, kind: d.kind === 'schema' ? 'schema' : 'upload', fileName: d.fileName || '',
      columns: clone(d.columns || []), metrics: clone(d.metrics || []), mainDttm: d.mainDttm || null,
      description: d.description || '', created: Date.now(),
    };
    if (d.kind === 'schema') {
      meta.schema = normalizeSchema(d.schema);
      STATE.datasets[id] = meta;
      DS[id] = Object.assign({}, meta, { rows: generateSchemaRows(meta.schema) });
    } else if (Array.isArray(d.rows)) {
      await idb.set('rows:' + id, d.rows);
      STATE.datasets[id] = meta;
      DS[id] = Object.assign({}, meta, { rows: d.rows });
    } else {
      meta.fromTemplate = true;
      STATE.datasets[id] = meta;
      DS[id] = Object.assign({}, meta, { rows: [], missingRows: true });
    }
  }
  // Графики
  Object.values(p.charts).forEach(c => {
    const collide = !!STATE.charts[c.id];
    const id = (mode === 'copy' && collide) ? uid('c_') : c.id;
    chMap[c.id] = id;
    STATE.charts[id] = Object.assign(clone(c), { id, datasetId: dsMap[c.datasetId] || c.datasetId, updated: Date.now() });
  });
  // Дашборды
  const newDashIds = [];
  Object.values(p.dashboards).forEach(d => {
    const collide = !!STATE.dashboards[d.id];
    const id = (mode === 'copy' && collide) ? uid('d_') : d.id;
    const nd = clone(d);
    nd.id = id;
    nd.updated = Date.now();
    if (mode === 'copy' && collide) nd.title = d.title + ' (импорт)';
    nd.tabs.forEach(t => t.items.forEach(i => { if (i.chartId) i.chartId = chMap[i.chartId] || i.chartId; }));
    nd.filters = (nd.filters || []).map(f => Object.assign({}, f, { datasetId: dsMap[f.datasetId] || f.datasetId }));
    STATE.dashboards[id] = nd;
    newDashIds.push(id);
  });
  saveState();
  return newDashIds;
}

function openImportDialog() {
  const input = h('input', { type: 'file', accept: '.json,.kobra.json,application/json', style: { display: 'none' } });
  const status = h('div', { class: 'muted', style: { marginTop: '12px', fontSize: '13px' } });
  const drop = h('div', {
    class: 'upload-drop', tabindex: 0, role: 'button', onclick: () => input.click(),
    onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') input.click(); },
  }, ic('upload'), h('b', null, 'Перетащите файл .kobra.json или нажмите, чтобы выбрать'),
    h('span', null, 'Файл, который Кобра сохранила через «Экспорт в файл».'));
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]); });
  input.addEventListener('change', () => { if (input.files[0]) handle(input.files[0]); });
  const md = openModal({ title: 'Импорт из файла', body: h('div', null, drop, input, status) });

  async function handle(file) {
    status.textContent = `Читаю «${file.name}»…`;
    try {
      const p = validatePayload(JSON.parse(await readTextFile(file)));
      md.close();
      openImportPreview(file, p);
    } catch (e) {
      status.textContent = '';
      toast('Не удалось прочитать файл: ' + e.message, true);
    }
  }
}

function openImportPreview(file, p) {
  const dashes = Object.values(p.dashboards), charts = Object.values(p.charts), dsList = p.datasets || [];
  const collisions = dashes.filter(d => STATE.dashboards[d.id]).length + charts.filter(c => STATE.charts[c.id]).length;
  let mode = 'copy';
  const withRows = dsList.filter(d => Array.isArray(d.rows)).length;
  const fake = dsList.filter(d => d.kind === 'schema').length;
  const noRows = dsList.filter(d => d.noRows).length;
  const body = h('div');
  const paint = () => {
    clear(body);
    body.appendChild(h('table', { class: 'list' }, h('tbody', null, [
      ['Файл', file.name],
      ['Вид', p.kind === 'project' ? 'Проект со строками данных' : 'Шаблон для передачи, без данных'],
      ['Сохранён', p.exportedAt ? fmtDate(Date.parse(p.exportedAt)) : '—'],
      p.author ? ['Автор', p.author] : null,
      p.note ? ['Комментарий', p.note] : null,
      ['Дашборды', dashes.map(d => d.title).join(', ') || '—'],
      ['Графики', String(charts.length)],
      ['Наборы данных', `${dsList.length}` + (withRows ? `, со строками — ${withRows}` : '') + (fake ? `, по схеме — ${fake}` : '') + (noRows ? `, без строк — ${noRows}` : '')],
    ].filter(Boolean).map(([k, v]) => h('tr', null, h('td', { class: 'muted', style: { width: '150px' } }, k), h('td', null, v))))));
    if (noRows) body.appendChild(h('p', { class: 'muted', style: { fontSize: '13px' } }, 'Для наборов без строк графики будут пустыми, пока вы не загрузите файл с такими же колонками.'));
    if (collisions) {
      body.appendChild(h('div', { class: 'field' }, h('div', { class: 'lbl' }, 'Совпадения с тем, что уже есть'),
        h('div', { class: 'hint', style: { marginBottom: '6px' } }, `Совпали по идентификатору: ${collisions}. Выберите, что делать.`),
        h('div', { class: 'seg' },
          h('button', { class: mode === 'copy' ? 'on' : '', onclick: () => { mode = 'copy'; paint(); } }, 'Добавить копией'),
          h('button', { class: mode === 'replace' ? 'on' : '', onclick: () => { mode = 'replace'; paint(); } }, 'Заменить мои версии')),
        h('div', { class: 'hint' }, mode === 'copy'
          ? 'Ничего не потеряется: совпавшее приедет рядом, с пометкой «импорт».'
          : 'Мои дашборды и графики с теми же идентификаторами будут перезаписаны версией из файла.')));
    }
  };
  paint();

  openModal({
    title: 'Что в файле', wide: true, body,
    foot: close => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', {
        class: 'btn primary', onclick: async e => {
          e.target.disabled = true;
          try {
            const ids = await importPayload(p, mode);
            close();
            toast('Импортировано');
            if (ids.length) go('#/d/' + ids[0]); else go('#/charts');
          } catch (err) {
            console.error(err);
            toast('Не удалось импортировать: ' + err.message, true);
            e.target.disabled = false;
          }
        },
      }, 'Импортировать')],
  });
}

/* ============================================================
   Кобра · ТЗ графика и выгрузка спецификации в Markdown
   Согласованный макет уже содержит все определения структурно:
   формулы метрик, разрезы с гранулярностью, фильтры, лимиты.
   Движок умеет печатать их по-русски (exprText, metricLabel,
   colLabel, describeTimeRange), поэтому спецификация собирается
   из того же, что человек видит в интерфейсе, и расходиться с
   дашбордом ей негде. Руками остаётся дописать только то, чего в
   параметрах нет: зачем график, откуда данные, как часто обновлять.
   ============================================================ */
const SPEC_PRIORITIES = { high: 'Высокий', mid: 'Средний', low: 'Низкий' };
const SPEC_FIELDS = [
  { key: 'question', label: 'Бизнес-вопрос', area: true, placeholder: 'Например: как меняется выручка по месяцам и где просадка',
    hint: 'На какой вопрос отвечает график. Главное поле: по нему аналитик поймёт, что считать.' },
  { key: 'source', label: 'Источник данных', placeholder: 'Например: витрина dm_sales в ClickHouse',
    hint: 'Откуда берутся строки в настоящей системе.' },
  { key: 'refresh', label: 'Периодичность обновления', placeholder: 'Например: раз в сутки к 8:00' },
  { key: 'priority', label: 'Приоритет', select: true },
  { key: 'comment', label: 'Комментарий', area: true, placeholder: 'Оговорки, спорные места, что ещё уточнить' },
];
const LS_SPEC_AUTHOR = 'kobra.author'; // тот же автор, что и в экспорте файлов

function specPriorityLabel(v) { return SPEC_PRIORITIES[v] || v || ''; }
function specValue(chart, key) {
  const v = ((chart || {}).spec || {})[key];
  return v == null ? '' : String(v).trim();
}
function specFilledCount(chart) { return SPEC_FIELDS.filter(f => specValue(chart, f.key)).length; }
/* Пустые поля не храним: иначе у каждого графика появится бесполезный spec */
function normalizeSpec(spec) {
  const out = {};
  SPEC_FIELDS.forEach(f => { const v = spec && spec[f.key] != null ? String(spec[f.key]).trim() : ''; if (v) out[f.key] = v; });
  return Object.keys(out).length ? out : null;
}

/* ---------- Редактор полей ТЗ ---------- */
function openSpecEditor(chart, onSave) {
  const draft = Object.assign({}, chart.spec || {});
  const body = h('div');
  body.appendChild(h('p', { class: 'muted', style: { fontSize: '13px', margin: '0 0 14px' } },
    'Поля ТЗ на расчёты не влияют: они нужны, чтобы согласованный макет стал заданием. Попадают в «Выгрузить ТЗ в Markdown» и в файл .kobra.json.'));
  SPEC_FIELDS.forEach(f => {
    if (f.select) {
      body.appendChild(field(f.label, selectEl([['', '— не задан —'], ...Object.entries(SPEC_PRIORITIES)], draft[f.key] || '', v => { draft[f.key] = v; }), f.hint));
      return;
    }
    const el = f.area
      ? h('textarea', { class: 'textarea', rows: 3, placeholder: f.placeholder || '' })
      : h('input', { class: 'input', placeholder: f.placeholder || '' });
    el.value = draft[f.key] || '';
    const take = () => { draft[f.key] = el.value; };
    el.addEventListener('input', take);
    el.addEventListener('change', take); // вставка и автозаполнение не всегда дают input
    body.appendChild(field(f.label, el, f.hint));
  });
  openModal({
    title: 'ТЗ графика', wide: true, body,
    foot: close => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn primary', onclick: () => { close(); onSave(normalizeSpec(draft)); } }, ic('check'), 'Сохранить'),
    ],
  });
}

/* ---------- Печать значений ---------- */
function mdEsc(s) { return String(s == null ? '' : s).replace(/\r?\n+/g, ' ').replace(/([*_`\[\]|])/g, '\\$1').trim(); }
function mdCell(s) { return mdEsc(s) || '—'; }

function specMetricText(ds, m) {
  if (!m) return '—';
  const label = metricLabel(ds, m);
  let formula;
  if (m.kind === 'saved') {
    const s = ds && ds.metrics.find(x => x.key === m.key);
    formula = s ? exprText(ds, s.expr) : `метрика «${m.key}» в наборе не найдена`;
  } else formula = exprText(ds, { type: 'simple', agg: m.agg, col: m.col });
  const fmt = formatLabel(metricFormat(ds, m));
  return `**${mdEsc(label)}** — \`${formula}\`` + (fmt ? `, формат: ${fmt}` : '');
}
function specFilterText(ds, f) {
  const c = colLabel(ds, f.col);
  switch (f.op) {
    case 'time_range': return `${c}: ${describeTimeRange(f.val, ds, f.col)}`;
    case 'in': case 'not_in': {
      const v = (f.val || []).map(x => String(x));
      return `${c} ${FILTER_OPS[f.op]}: ${v.length ? v.join(', ') : '(значения не выбраны)'}`;
    }
    case 'between': return `${c}: от ${f.val && f.val[0] !== '' && f.val[0] != null ? f.val[0] : '…'} до ${f.val && f.val[1] !== '' && f.val[1] != null ? f.val[1] : '…'}`;
    case 'is_null': case 'not_null': return `${c} — ${FILTER_OPS[f.op]}`;
    default: return `${c} ${FILTER_OPS[f.op]} ${f.val == null ? '' : f.val}`;
  }
}
function specColumnsText(ds, keys) {
  const list = (keys || []).filter(Boolean);
  return list.length ? list.map(k => mdEsc(colLabel(ds, k))).join(', ') : '';
}
function optionLabel(c, v) {
  const hit = (c.options || []).find(o => String(Array.isArray(o) ? o[0] : o.value) === String(v));
  return hit ? (Array.isArray(hit) ? hit[1] : hit.label) : (v == null ? '' : String(v));
}

/* Одна строка спецификации на контрол: берём декларативную схему
   VIZ[type].controls, поэтому новый тип графика печатается сам. */
function specControlLine(c, p, ds, showFalse) {
  const v = p[c.key] !== undefined ? p[c.key] : c.def;
  const L = mdEsc(c.label);
  switch (c.type) {
    case 'metric': return v ? `${L}: ${specMetricText(ds, v)}` : null;
    case 'metrics': {
      const list = (v || []).filter(Boolean);
      return list.length ? `${L}: ${list.map(m => specMetricText(ds, m)).join('; ')}` : null;
    }
    case 'column': return v ? `${L}: ${mdEsc(colLabel(ds, v))}` : null;
    case 'columns': { const t = specColumnsText(ds, v); return t ? `${L}: ${t}` : null; }
    case 'grain': return `${L}: ${TIME_GRAINS[v] || v || '—'}`;
    case 'timerange': {
      if (!ds || !ds.mainDttm) return null;
      return `${L} (${mdEsc(colLabel(ds, ds.mainDttm))}): ${describeTimeRange(v, ds, ds.mainDttm)}`;
    }
    case 'filters': {
      const list = (v || []).filter(f => f && f.col);
      return list.length ? `${L}: ${list.map(f => specFilterText(ds, f)).join('; ')}` : null;
    }
    case 'select': case 'segment': {
      const lbl = optionLabel(c, v != null && v !== '' ? v : (c.options && c.options[0] ? (Array.isArray(c.options[0]) ? c.options[0][0] : c.options[0].value) : ''));
      return lbl ? `${L}: ${mdEsc(lbl)}` : null;
    }
    // «Нет» печатаем только там, где это отличие от обычного поведения графика
    case 'check': return v ? `${L}: да` : (showFalse ? `${L}: нет` : null);
    case 'number': {
      if (v == null || v === '') return null;
      if (+v === 0 && +c.def === 0) return null; // 0 здесь значит «выключено»
      return `${L}: ${fmtNum(+v, 'int')}`;
    }
    case 'text': return v ? `${L}: ${mdEsc(v)}` : null;
    case 'format': return v && v !== 'auto' ? `${L}: ${formatLabel(v)}` : null;
    case 'scheme': return v && COLOR_SCHEMES[v] ? `${L}: ${COLOR_SCHEMES[v].label}` : null;
    case 'seqscheme': return v && SEQ_SCHEMES[v] ? `${L}: ${SEQ_SCHEMES[v].label}` : null;
  }
  return null;
}

/* ---------- Блок одного графика ---------- */
function specChartBlock(chart, num) {
  const out = [];
  const viz = VIZ[chart.viz];
  const ds = DS[chart.datasetId];
  out.push(`### ${num}. ${mdEsc(chart.name)}`, '');
  out.push(`**Тип визуализации:** ${viz ? mdEsc(viz.label) : mdEsc(chart.viz)} · **Набор данных:** `
    + (ds ? mdEsc(ds.name) + (isSchemaDs(ds) ? ' (схема, данные вымышленные)' : '') : `не найден (${mdEsc(chart.datasetId)})`), '');
  if (specFilledCount(chart)) {
    out.push('**ТЗ**', '');
    SPEC_FIELDS.forEach(f => {
      const v = specValue(chart, f.key);
      if (!v) return;
      out.push(`- ${f.label}: ${f.key === 'priority' ? mdEsc(specPriorityLabel(v)) : mdEsc(v)}`);
    });
    out.push('');
  } else out.push('**ТЗ:** _не заполнено_', '');
  if (!viz) { out.push('_Неизвестный тип визуализации, параметры показать не удалось._', ''); return out; }

  const def = ds ? viz.defaults(ds) : {};
  const p = Object.assign({}, def, chart.params);
  const groups = [];
  viz.controls.forEach(sec => {
    if (sec.tab !== 'data') return;
    const items = [];
    sec.controls.forEach(c => {
      if (c.showIf && !c.showIf(p, ds)) return;
      const line = specControlLine(c, p, ds);
      if (line) items.push(line);
    });
    if (items.length) groups.push({ title: sec.title, items });
  });
  out.push('**Запрос**', '');
  if (groups.length === 1) groups[0].items.forEach(i => out.push('- ' + i));
  else groups.forEach(g => { out.push(`- **${mdEsc(g.title)}**`); g.items.forEach(i => out.push('  - ' + i)); });
  out.push('');
  /* Из оформления в ТЗ попадает только то, что человек менял руками:
     перечислять настройки по умолчанию незачем, а формат чисел,
     горизонтальные столбцы или накопление серий — это уже требование. */
  const look = [];
  viz.controls.forEach(sec => {
    if (sec.tab !== 'view') return;
    sec.controls.forEach(c => {
      if (c.showIf && !c.showIf(p, ds)) return;
      const d = def[c.key] !== undefined ? def[c.key] : c.def;
      const v = p[c.key] !== undefined ? p[c.key] : c.def;
      const same = c.type === 'check' ? !!v === !!d : JSON.stringify(v ?? null) === JSON.stringify(d ?? null);
      if (same) return;
      const line = specControlLine(c, p, ds, true);
      if (line) look.push(line);
    });
  });
  if (look.length) { out.push('**Оформление**', ''); look.forEach(i => out.push('- ' + i)); out.push(''); }
  return out;
}

/* ---------- Нативные фильтры дашборда ---------- */
const SPEC_FILTER_TYPES = { time: 'Период', select: 'Выбор значений', range: 'Диапазон чисел' };
function specFilterRow(D, f) {
  const ds = dsGet(f.datasetId);
  const def = f.def !== undefined ? f.def : f.value;
  let defText;
  if (f.type === 'time') defText = describeTimeRange(def, ds, f.col);
  else if (f.type === 'range') defText = Array.isArray(def) && (def[0] !== '' && def[0] != null || def[1] !== '' && def[1] != null) ? `от ${def[0] === '' || def[0] == null ? '…' : def[0]} до ${def[1] === '' || def[1] == null ? '…' : def[1]}` : 'не задано';
  else defText = Array.isArray(def) && def.length ? def.map(String).join(', ') : 'все значения';
  let scope = 'Все графики';
  if (Array.isArray(f.scope)) {
    const names = f.scope.map(cid => (STATE.charts[cid] || {}).name).filter(Boolean);
    scope = names.length ? names.map(mdEsc).join(', ') : 'ни один график';
  }
  const notes = [];
  if (f.type === 'select') notes.push(f.multi === false ? 'одно значение' : 'несколько значений');
  if (f.dependent) notes.push('значения зависят от остальных фильтров');
  return `| ${mdCell(f.name)} | ${SPEC_FILTER_TYPES[f.type] || mdCell(f.type)} | ${ds ? mdCell(ds.name) : 'набор не найден'} | `
    + `${mdCell(ds ? colLabel(ds, f.col) : f.col)} | ${mdCell(defText)} | ${mdCell(scope)} | ${notes.length ? mdEsc(notes.join(', ')) : '—'} |`;
}

/* ---------- Сборка документа ---------- */
function dashSpecDatasets(D) {
  const ids = new Set();
  D.tabs.forEach(t => t.items.forEach(i => { if (i.chartId && STATE.charts[i.chartId]) ids.add(STATE.charts[i.chartId].datasetId); }));
  (D.filters || []).forEach(f => { if (f.datasetId) ids.add(f.datasetId); });
  return [...ids];
}
/* dash — дашборд или его идентификатор: в режиме правки печатаем черновик,
   чтобы ТЗ совпадало с тем, что человек видит на экране. */
function buildSpecMd(dash, opts = {}) {
  const D = typeof dash === 'string' ? STATE.dashboards[dash] : dash;
  if (!D) throw new Error('Дашборд не найден');
  const L = [];
  const dsIds = dashSpecDatasets(D);
  const nCharts = D.tabs.reduce((a, t) => a + t.items.filter(i => i.type === 'chart').length, 0);
  const fake = dsIds.map(x => DS[x]).filter(isSchemaDs);

  L.push(`# ТЗ дашборда «${mdEsc(D.title)}»`, '');
  const head = [`Собрано в Кобре ${fmtDate(Date.now(), 'day')}`];
  if (opts.author) head.push(`автор — ${mdEsc(opts.author)}`);
  L.push(head.join(', ') + '.', '');
  if (opts.note) L.push('> ' + mdEsc(opts.note), '');
  if (fake.length) {
    L.push(`> **Это макет, данные вымышленные.** ${plural(fake.length, 'Набор', 'Наборы', 'Наборы')} `
      + fake.map(d => '«' + mdEsc(d.name) + '»').join(', ')
      + ` ${plural(fake.length, 'создан', 'созданы', 'созданы')} по описанию колонок, цифры на графиках придуманы и для отчётности не годятся.`, '');
  }
  L.push(`- Вкладок: ${D.tabs.length}, графиков: ${nCharts}, фильтров дашборда: ${(D.filters || []).length}`);
  L.push(`- Наборы данных: ${dsIds.map(x => DS[x] ? mdEsc(DS[x].name) : `не найден (${mdEsc(x)})`).join(', ') || '—'}`);
  L.push(`- Кросс-фильтрация (клик по графику фильтрует остальные): ${D.crossFilter ? 'включена' : 'выключена'}`);
  if (D.scheme && COLOR_SCHEMES[D.scheme]) L.push(`- Цветовая схема дашборда: ${COLOR_SCHEMES[D.scheme].label}`);
  L.push('', 'Метрики записаны так, как их считает Кобра: `АГРЕГАЦИЯ(Колонка)`, отношения — `числитель / знаменатель`. '
    + 'Отношения считаются на уровне группировки графика, а не делением готовых итогов. '
    + 'Относительные периоды («последние 12 месяцев») отсчитываются от последней даты в данных.', '');

  // Бриф — это и есть «зачем» дашборда, аналитику он нужнее состава блоков
  const brief = aiBriefLines(aiBrief(D));
  if (brief.length) {
    L.push('## Зачем этот дашборд', '');
    brief.forEach(line => L.push('- ' + mdEsc(line)));
    L.push('');
  }

  if ((D.filters || []).length) {
    L.push('## Фильтры дашборда', '');
    L.push('| Фильтр | Тип | Набор данных | Колонка | Значение по умолчанию | Область действия | Примечание |');
    L.push('|---|---|---|---|---|---|---|');
    D.filters.forEach(f => L.push(specFilterRow(D, f)));
    L.push('');
  }

  const noQuestion = [];
  D.tabs.forEach((t, ti) => {
    L.push(`## Вкладка ${ti + 1}. «${mdEsc(t.title)}»`, '');
    const items = [...t.items].sort((a, b) => a.y - b.y || a.x - b.x);
    if (!items.length) L.push('_Вкладка пустая._', '');
    let n = 0;
    items.forEach(it => {
      if (it.type === 'chart') {
        const chart = STATE.charts[it.chartId];
        n++;
        if (!chart) { L.push(`### ${ti + 1}.${n}. График не найден (${mdEsc(it.chartId)})`, ''); return; }
        if (!specValue(chart, 'question')) noQuestion.push(chart.name);
        specChartBlock(chart, `${ti + 1}.${n}`).forEach(x => L.push(x));
      } else if (it.type === 'header') {
        L.push(`### ${mdEsc(it.text || '')}`, '');
      } else if (it.type === 'markdown') {
        L.push('> ' + String(it.text || '').replace(/\r?\n/g, '\n> '), '');
      }
    });
  });

  if (noQuestion.length) {
    L.push('## Что осталось заполнить', '');
    L.push(`Без бизнес-вопроса ${noQuestion.length} ${plural(noQuestion.length, 'график', 'графика', 'графиков')}:`, '');
    noQuestion.forEach(nm => L.push(`- [ ] ${mdEsc(nm)}`));
    L.push('');
  }
  return L.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
function specFileName(D) {
  return `kobra-tz-${slugKey(D.title, 0, new Set())}-${isoDate(Date.now())}.md`;
}

/* ---------- Диалог выгрузки ---------- */
function openSpecDialog(dash) {
  const D = typeof dash === 'string' ? STATE.dashboards[dash] : dash;
  if (!D) { toast('Дашборд не найден', true); return; }
  let author = lsGet(LS_SPEC_AUTHOR) || '';
  let note = '';
  const nCharts = D.tabs.reduce((a, t) => a + t.items.filter(i => i.type === 'chart').length, 0);
  const charts = D.tabs.flatMap(t => t.items.map(i => STATE.charts[i.chartId]).filter(Boolean));
  const filled = charts.filter(c => specValue(c, 'question')).length;
  const body = h('div');
  body.appendChild(h('p', { class: 'muted', style: { fontSize: '13px', margin: '0 0 14px' } },
    'Кобра соберёт из дашборда готовое задание: по каждому графику — тип, набор данных, метрики с формулами, разрезы, фильтры и лимиты, плюс поля ТЗ. '
    + 'Цифры и подписи в файле те же, что на экране.'));
  body.appendChild(h('div', { class: 'row2' },
    field('Автор', h('input', { class: 'input', value: author, placeholder: 'Кто составил ТЗ', oninput: e => { author = e.target.value; } })),
    field('Комментарий', h('input', { class: 'input', value: note, placeholder: 'Например: на согласование с дирекцией', oninput: e => { note = e.target.value; } }))));
  body.appendChild(h('p', { class: 'muted', style: { fontSize: '12.5px', margin: 0 } },
    `В файле: ${D.tabs.length} ${plural(D.tabs.length, 'вкладка', 'вкладки', 'вкладок')}, ${nCharts} ${plural(nCharts, 'график', 'графика', 'графиков')}, `
    + `${(D.filters || []).length} ${plural((D.filters || []).length, 'фильтр', 'фильтра', 'фильтров')} дашборда. `
    + (nCharts ? `Бизнес-вопрос заполнен у ${filled} из ${nCharts}.` : '')));

  const make = () => buildSpecMd(D, { author: author.trim(), note: note.trim() });
  openModal({
    title: 'Выгрузить ТЗ в Markdown', wide: true, body,
    foot: close => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn', onclick: async () => {
        try {
          await navigator.clipboard.writeText(make());
          toast('ТЗ скопировано в буфер обмена');
        } catch (e) { toast('Браузер не дал доступ к буферу обмена, скачайте файл', true); }
      } }, ic('copy'), 'Скопировать'),
      h('button', { class: 'btn primary', onclick: () => {
        try {
          const md = make();
          if (author.trim()) lsSet(LS_SPEC_AUTHOR, author.trim());
          if (downloadFile(specFileName(D), md, 'text/markdown')) { close(); toast('ТЗ сохранено в файл'); }
        } catch (e) { console.error(e); toast('Не удалось собрать ТЗ: ' + e.message, true); }
      } }, ic('download'), 'Скачать .md'),
    ],
  });
}

boot().catch(e => { console.error(e); const s = document.querySelector('.loading span'); if (s) s.textContent = 'Ошибка запуска: ' + e.message; });
</script>
</body>
</html>
