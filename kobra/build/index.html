<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кобра — прототипы дашбордов</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #EDF0EE; --surface: #FFFFFF; --surface-2: #F5F7F6; --surface-3: #E8ECEA;
  --ink: #16221E; --ink-2: #4A5853; --ink-3: #7B8983; --line: #DAE0DD; --line-2: #C7D0CC;
  --primary: #0E7457; --primary-hover: #0B5F47; --primary-ink: #FFFFFF; --primary-soft: #DEF0E8;
  --accent: #C98A0B; --accent-soft: #FBF0D6;
  --danger: #B63A2B; --danger-soft: #FBE7E3; --up: #1B8456; --down: #C0412F;
  --bar: #0C3A2E; --bar-ink: #E6F2EC; --bar-ink-2: #9CC4B3;
  --shadow: 0 1px 2px rgba(18, 38, 31, .06), 0 8px 24px -12px rgba(18, 38, 31, .18);
  --shadow-pop: 0 12px 40px -8px rgba(12, 40, 30, .28), 0 2px 6px rgba(12, 40, 30, .08);
  --r-s: 4px; --r-m: 7px; --r-l: 12px;
  --font: 'Onest', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-display: 'Unbounded', 'Onest', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #19211E; --surface-2: #1F2926; --surface-3: #27332F;
    --ink: #E6EEEA; --ink-2: #A8B6B0; --ink-3: #7A8983; --line: #2B3833; --line-2: #3A4943;
    --primary: #3DBB8C; --primary-hover: #5CCDA2; --primary-ink: #07261B; --primary-soft: #1B3A2F;
    --accent: #E3AA3C; --accent-soft: #3A2F18; --danger: #E26A58; --danger-soft: #3B1F1B; --up: #4CC98F; --down: #EE7A66;
    --bar: #0A2A21; --bar-ink: #DDEEE6; --bar-ink-2: #86B3A1;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .5);
    --shadow-pop: 0 12px 40px -8px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #19211E; --surface-2: #1F2926; --surface-3: #27332F;
  --ink: #E6EEEA; --ink-2: #A8B6B0; --ink-3: #7A8983; --line: #2B3833; --line-2: #3A4943;
  --primary: #3DBB8C; --primary-hover: #5CCDA2; --primary-ink: #07261B; --primary-soft: #1B3A2F;
  --accent: #E3AA3C; --accent-soft: #3A2F18; --danger: #E26A58; --danger-soft: #3B1F1B; --up: #4CC98F; --down: #EE7A66;
  --bar: #0A2A21; --bar-ink: #DDEEE6; --bar-ink-2: #86B3A1;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .5);
  --shadow-pop: 0 12px 40px -8px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 14px/1.45 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; accent-color: var(--primary); }
a { color: var(--primary); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Каркас ---------- */
#app { height: 100%; display: flex; flex-direction: column; }
.topbar {
  flex: none; display: flex; align-items: center; gap: 28px; height: 52px; padding: 0 18px;
  background: var(--bar); color: var(--bar-ink); position: relative; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.brand svg { width: 26px; height: 26px; }
.brand b { font: 700 17px/1 var(--font-display); letter-spacing: .01em; }
.nav { display: flex; gap: 4px; height: 100%; }
.nav a {
  display: flex; align-items: center; padding: 0 12px; color: var(--bar-ink-2); text-decoration: none;
  font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -0px;
}
.nav a:hover { color: var(--bar-ink); }
.nav a.on { color: var(--bar-ink); border-bottom-color: var(--accent); }
.topbar .spacer { flex: 1; }
.iconbtn-bar { background: none; border: 0; color: var(--bar-ink-2); width: 34px; height: 34px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
.iconbtn-bar svg { width: 19px; height: 19px; }
.iconbtn-bar:hover { background: rgba(255,255,255,.08); color: var(--bar-ink); }
.main { flex: 1; min-height: 0; overflow: auto; }
.page { max-width: 1320px; margin: 0 auto; padding: 28px 24px 60px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { font: 600 24px/1.2 var(--font-display); margin: 0; letter-spacing: -.01em; }
.page-head p { margin: 6px 0 0; color: var(--ink-2); max-width: 64ch; }
.page-head .grow { flex: 1; }

/* ---------- Кнопки и поля ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px;
  border-radius: var(--r-m); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }
.iconbtn { width: 30px; height: 30px; border-radius: 6px; border: 0; background: transparent; color: var(--ink-2); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn:hover { background: var(--surface-3); color: var(--ink); }
.iconbtn svg { width: 16px; height: 16px; }
.iconbtn.sm { width: 24px; height: 24px; }
.iconbtn.sm svg { width: 14px; height: 14px; }
.input, .select, .textarea {
  width: 100%; height: 34px; padding: 0 10px; border-radius: var(--r-m); border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink); min-width: 0;
}
.select { padding-right: 28px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px; background-repeat: no-repeat; }
.textarea { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field > label, .field > .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.field .hint { font-size: 12px; color: var(--ink-3); }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 12px; font-size: 13.5px; }
.check input { width: 16px; height: 16px; accent-color: var(--primary); margin: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.muted { color: var(--ink-3); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-m); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 12px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button.on { background: var(--primary-soft); color: var(--primary); }

/* ---------- Списки (дашборды, графики, данные) ---------- */
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar .input { max-width: 320px; }
.dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.dash-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden;
  display: flex; flex-direction: column; cursor: pointer; transition: border-color .15s;
}
.dash-card:hover { border-color: var(--primary); }
.dash-thumb { height: 128px; background: var(--surface-2); border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
.dash-thumb i { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; }
.dash-thumb i.k { background: var(--primary-soft); border-color: transparent; }
.dash-card .meta { padding: 12px 14px; display: flex; align-items: flex-start; gap: 8px; }
.dash-card .meta b { display: block; font-weight: 600; font-size: 15px; }
.dash-card .meta span { font-size: 12.5px; color: var(--ink-3); }
.dash-card .meta .grow { flex: 1; min-width: 0; }
.new-card { border-style: dashed; align-items: center; justify-content: center; min-height: 190px; color: var(--ink-2); gap: 8px; font-weight: 500; }
.new-card svg { width: 22px; height: 22px; }
.tbl-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); overflow: auto; }
table.list { width: 100%; border-collapse: collapse; }
table.list th { text-align: left; font-size: 12.5px; color: var(--ink-3); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.list tr:last-child td { border-bottom: 0; }
table.list tr.click { cursor: pointer; }
table.list tr.click:hover td { background: var(--surface-2); }
table.list td.act { text-align: right; white-space: nowrap; width: 1%; }
.vt { display: inline-flex; align-items: center; gap: 8px; }
.vt svg { width: 18px; height: 18px; color: var(--primary); flex: none; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--surface-3); color: var(--ink-2); font-size: 12px; font-weight: 500; }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.pri { background: var(--primary-soft); color: var(--primary); }
.empty { padding: 48px 24px; text-align: center; color: var(--ink-2); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
.empty .btn { margin-top: 14px; }

/* ---------- Дашборд ---------- */
.dash { display: flex; height: 100%; min-height: 0; }
.fbar { flex: none; width: 272px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; transition: width .18s; }
.fbar.closed { width: 44px; }
.fbar-head { display: flex; align-items: center; gap: 6px; padding: 12px 10px 12px 16px; border-bottom: 1px solid var(--line); }
.fbar-head b { flex: 1; font-weight: 600; }
.fbar.closed .fbar-head { padding: 12px 7px; }
.fbar.closed .fbar-head b, .fbar.closed .fbar-body, .fbar.closed .fbar-foot { display: none; }
.fbar-body { flex: 1; overflow: auto; padding: 14px 16px; }
.fbar-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
.fbar-foot .btn { flex: 1; }
.fbar .fitem { margin-bottom: 16px; }
.fbar .fitem > .lbl { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.fbar .fitem > .lbl .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.fbar .sec { font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 18px 0 8px; }
.xf-chip { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; border-radius: var(--r-m); background: var(--accent-soft); margin-bottom: 6px; font-size: 13px; }
.xf-chip span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.xf-chip small { display: block; color: var(--ink-3); font-size: 11.5px; }
.dash-main { flex: 1; min-width: 0; overflow: auto; display: flex; flex-direction: column; }
.dash-head { display: flex; align-items: center; gap: 10px; padding: 16px 24px 8px; flex-wrap: wrap; }
.dash-head h1 { font: 600 21px/1.25 var(--font-display); margin: 0; letter-spacing: -.01em; }
.dash-head .grow { flex: 1; }
.dash-head .title-input { font: 600 20px/1.25 var(--font-display); border: 1px dashed var(--line-2); background: var(--surface); border-radius: var(--r-m); padding: 4px 8px; min-width: 280px; }
.dash-sub { padding: 0 24px 8px; color: var(--ink-3); font-size: 12.5px; }
.tabs { display: flex; gap: 2px; padding: 0 24px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.tab { display: flex; align-items: center; gap: 4px; padding: 10px 14px; border: 0; background: none; cursor: pointer; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--primary); border-bottom-color: var(--primary); }
.tab input { border: 1px dashed var(--line-2); background: var(--surface); border-radius: 4px; padding: 2px 6px; width: 140px; }
.tab .iconbtn { width: 20px; height: 20px; }
.tab .iconbtn svg { width: 12px; height: 12px; }
.grid-wrap { padding: 16px 24px 48px; flex: 1; }
.dgrid { position: relative; }
.dgrid.editing { background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: calc((100% + 12px) / 12) 100%; background-position: -1px 0; border-radius: 4px; }
.gitem { position: absolute; transition: left .16s, top .16s, width .16s, height .16s; }
.gitem.dragging { transition: none; z-index: 30; opacity: .92; }
.gitem.dragging .card { box-shadow: var(--shadow-pop); }
.gph { position: absolute; background: var(--primary-soft); border: 2px dashed var(--primary); border-radius: var(--r-l); transition: left .1s, top .1s, width .1s, height .1s; }
.card { width: 100%; height: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); display: flex; flex-direction: column; overflow: hidden; }
.card-head { display: flex; align-items: center; gap: 4px; padding: 10px 8px 2px 14px; min-height: 38px; }
.card-head .t { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-head .fcount { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--accent); font-weight: 600; padding: 2px 6px; border-radius: 99px; background: var(--accent-soft); }
.card-head .fcount svg { width: 11px; height: 11px; }
.card-body { flex: 1; min-height: 0; position: relative; padding: 4px 10px 10px; }
.card-body.nopad { padding: 0; }
.editing .card { border-style: dashed; border-color: var(--line-2); }
.editing .gitem:hover .card { border-color: var(--primary); }
.drag-h { cursor: grab; touch-action: none; }
.drag-h:active { cursor: grabbing; }
.rs-h { position: absolute; right: 2px; bottom: 2px; width: 16px; height: 16px; cursor: nwse-resize; touch-action: none; z-index: 3; }
.rs-h::after { content: ''; position: absolute; right: 3px; bottom: 3px; width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); border-radius: 0 0 2px 0; }
.item-tools { position: absolute; top: 6px; right: 6px; display: none; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 2px; z-index: 4; box-shadow: var(--shadow); }
.editing .gitem:hover .item-tools, .editing .gitem.sel .item-tools { display: flex; }
.hdr-block { width: 100%; height: 100%; display: flex; align-items: center; padding: 0 6px; }
.hdr-block h2 { margin: 0; font: 600 20px/1.25 var(--font-display); letter-spacing: -.01em; }
.hdr-block.h-m h2 { font: 600 16px/1.3 var(--font); }
.hdr-block.h-s h2 { font: 600 14px/1.3 var(--font); color: var(--ink-2); }
.hdr-block.bg { background: var(--primary-soft); border-radius: var(--r-l); padding: 0 16px; }
.divider-block { width: 100%; height: 100%; display: flex; align-items: center; }
.divider-block hr { width: 100%; border: 0; border-top: 1px solid var(--line-2); margin: 0; }
.md { padding: 12px 16px; overflow: auto; height: 100%; line-height: 1.55; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3 { line-height: 1.25; margin: .6em 0 .35em; }
.md h1 { font: 600 20px/1.25 var(--font-display); }
.md h2 { font-size: 17px; }
.md h3 { font-size: 15px; }
.md p { margin: .4em 0; max-width: 78ch; }
.md ul, .md ol { padding-left: 1.3em; margin: .4em 0; }
.md code { background: var(--surface-3); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
.md blockquote { margin: .5em 0; padding: 4px 12px; border-left: 3px solid var(--accent); color: var(--ink-2); }
.md table { border-collapse: collapse; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; }
.md-edit { width: 100%; height: 100%; border: 0; resize: none; padding: 12px 16px; background: var(--surface-2); font: 13px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; color: var(--ink); }
.md-edit:focus { outline: none; }
.edit-panel { flex: none; width: 300px; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.edit-panel .seg { margin: 12px 14px 0; display: flex; }
.edit-panel .seg button { flex: 1; }
.edit-panel-body { flex: 1; overflow: auto; padding: 12px 14px; }
.comp { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--r-m); margin-bottom: 8px; cursor: pointer; background: var(--surface); width: 100%; text-align: left; }
.comp:hover { border-color: var(--primary); background: var(--primary-soft); }
.comp svg { width: 18px; height: 18px; color: var(--primary); flex: none; }
.comp .grow { flex: 1; min-width: 0; }
.comp .grow b { display: block; font-weight: 500; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comp .grow span { font-size: 12px; color: var(--ink-3); }
.comp.used { opacity: .6; }
.edit-banner { background: var(--accent-soft); color: var(--ink); padding: 8px 24px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.edit-banner.fake-banner { background: var(--primary-soft); color: var(--ink); }
/* Каталог готовых шаблонов */
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 18px; }
.tpl-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.tpl-card.off { opacity: .72; }
.tpl-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.tpl-head b { font: 600 16px/1.3 var(--font-display); }
.tpl-card p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.tpl-card p.muted { color: var(--ink-3); font-size: 12.5px; }
.tpl-levels { margin: 2px 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
.tpl-levels li { margin: 2px 0; }
.tpl-miss { background: var(--accent-soft); border-radius: var(--r-m); padding: 7px 10px; font-size: 12.5px; }
.tpl-act { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; }
.tpl-plan { background: var(--surface-2); border-radius: var(--r-m); padding: 10px 12px; margin-top: 10px; }
.tpl-plan p { margin: 0 0 6px; font-size: 13px; }
.tpl-plan b { font-weight: 600; }
/* Стартовый выбор пути */
.start-choice { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin-top: 8px; }
.start-choice.tight { gap: 14px; margin-top: 0; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.start-choice.tight .start-card { padding: 16px 18px; box-shadow: none; }
.start-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 22px 24px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.start-card.rec { border-color: var(--primary); }
.start-ic { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-3); color: var(--ink-2); display: grid; place-items: center; }
.start-card.rec .start-ic { background: var(--primary-soft); color: var(--primary); }
.start-ic svg { width: 22px; height: 22px; }
.start-card b { font: 600 18px/1.3 var(--font-display); }
.start-card p { margin: 0; font-size: 13.5px; color: var(--ink-2); }

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;

/* Мелочь к основной покупке: в заказе часто идёт второй строкой */
const ADDON_GROUPS = ['Аудио', 'Освещение', 'Текстиль', 'Посуда'];

const DATA_START = Date.UTC(2024, 0, 1);
const DATA_END = Date.UTC(2026, 7, 31);     // включительно, 31 августа 2026
const MONTH_SEASON = [.86, .82, .92, .86, .86, .9, .9, 1.02, 1.0, 1.0, 1.25, 1.55];

/* Главная распродажа года — последняя пятница ноября */
function autumnSale(year) {
  const d = new Date(Date.UTC(year, 10, 30));
  while (d.getUTCDay() !== 5) d.setUTCDate(d.getUTCDate() - 1);
  return d.getTime();
}

function generateSales() {
  const rnd = mulberry32(20240101);
  const cities = REGIONS.map(([region, city, w, n]) => {
    const stores = [];
    for (let i = 0; i < n; i++) stores.push({
      name: `${city}, точка №${i + 1}`,
      format: i === 0 && n >= 3 ? STORE_FORMATS[0] : (i % 2 ? STORE_FORMATS[2] : STORE_FORMATS[1]),
      w: i === 0 ? 1.6 : 1,
    });
    return { region, city, w, stores };
  });
  const groups = CATALOG.map(([direction, group, marginRate, w, season, products]) => ({
    direction, group, marginRate, w, season,
    products: products.map(([line, name, price], i) => ({ line, name, price, w: 1 / (1 + i * 0.25) })),
  }));
  const addons = groups.filter(g => ADDON_GROUPS.includes(g.group));
  const payments = [{ v: 'Банковская карта', w: 52 }, { v: 'Быстрые платежи', w: 18 }, { v: 'Наличные', w: 12 }, { v: 'Рассрочка', w: 18 }];
  const segments = [{ v: 'Физлицо', w: 72 }, { v: 'Малый бизнес', w: 20 }, { v: 'Корпоративный клиент', w: 8 }];

  const monthPools = [], addonPools = [];
  for (let mm = 0; mm < 12; mm++) {
    monthPools.push(groups.map(g => ({ g, w: g.w * g.season[mm] })));
    addonPools.push(addons.map(g => ({ g, w: g.w * g.season[mm] })));
  }
  const rows = [];
  let orderSeq = 100000;
  const sales = {};
  for (let t = DATA_START; t <= DATA_END; t += DAY) {
    const d = new Date(t);
    const y = d.getUTCFullYear(), m = d.getUTCMonth(), dd = d.getUTCDate(), wd = d.getUTCDay();
    if (!sales[y]) sales[y] = autumnSale(y);
    const yearsFromStart = (t - DATA_START) / (365 * DAY);
    let mult = MONTH_SEASON[m] * (wd === 0 || wd === 6 ? 1.28 : 1) * (1 + 0.11 * yearsFromStart);
    const saleDelta = Math.round((t - sales[y]) / DAY);
    const isSale = saleDelta >= -2 && saleDelta <= 3;
    if (isSale) mult *= 2.3;
    if (m === 11 && dd >= 18) mult *= 1.6;      // предновогодний спрос
    if (m === 0 && dd <= 7) mult *= 0.62;       // новогодние каникулы
    if (m === 1 && dd >= 18 && dd <= 23) mult *= 1.3;
    if (m === 2 && dd >= 4 && dd <= 7) mult *= 1.3;
    if (m === 7 && dd >= 20) mult *= 1.18;      // подготовка к учебному году
    const nOrders = Math.round(32 * mult * (0.82 + rnd() * 0.36));
    const onlineShare = 0.43 + 0.1 * Math.min(1, yearsFromStart / 2.6);
    const priceIdx = 1 + 0.065 * yearsFromStart;

    for (let o = 0; o < nOrders; o++) {
      const orderId = 'З-' + (orderSeq++);
      const city = pickWeighted(rnd, cities);
      const store = pickWeighted(rnd, city.stores);
      const online = rnd() < onlineShare;
      const channel = online ? (rnd() < 0.38 + 0.12 * Math.min(1, yearsFromStart / 2.6) ? 'Мобильное приложение' : 'Сайт') : 'Розница';
      const delivery = online ? (rnd() < 0.36 ? 'Доставка' : 'Самовывоз') : 'Покупка на точке';
      const segment = pickWeighted(rnd, segments).v;
      const loyalty = rnd() < 0.48 ? 'Да' : 'Нет';
      let payment = pickWeighted(rnd, payments).v;
      if (online && payment === 'Наличные' && rnd() < 0.7) payment = 'Банковская карта';
      if (segment === 'Корпоративный клиент' && rnd() < 0.6) payment = 'Безналичный расчёт';

      const nLines = rnd() < 0.62 ? 1 : rnd() < 0.72 ? 2 : 3;
      for (let li = 0; li < nLines; li++) {
        const pool = li === 0 ? monthPools[m] : (rnd() < 0.75 ? addonPools[m] : monthPools[m]);
        const g = pickWeighted(rnd, pool).g;
        const pr = pickWeighted(rnd, g.products);
        const small = ADDON_GROUPS.includes(g.group);
        const qty = small ? (rnd() < 0.7 ? 1 : rnd() < 0.7 ? 2 : 3) : (rnd() < 0.96 ? 1 : 2);
        const price = Math.round(pr.price * priceIdx * (0.94 + rnd() * 0.12) / 10) * 10;
        let discRate = rnd() < 0.3 ? rnd() * 0.06 : 0;
        if (isSale) discRate = 0.08 + rnd() * 0.17;
        else if (m === 11 && dd >= 15) discRate = Math.max(discRate, 0.04 + rnd() * 0.06);
        if (loyalty === 'Да') discRate += 0.01;
        const gross = price * qty;
        const discount = Math.round(gross * discRate);
        const revenue = gross - discount;
        const mRate = g.marginRate + (pr.line === 'Премиум' ? 0.04 : 0) + (rnd() - 0.5) * 0.03;
        const cost = Math.round(gross * (1 - mRate));
        rows.push({
          date: t, order_id: orderId, region: city.region, city: city.city, store: store.name,
          store_format: online && delivery === 'Доставка' ? 'Склад доставки' : store.format,
          channel, delivery, payment, segment, loyalty,
          direction: g.direction, group: g.group, line: pr.line, product: pr.name,
          qty, price, gross, discount, revenue, cost, margin: revenue - cost,
        });
      }
    }
  }
  return rows;
}

function generateFunnel() {
  const rnd = mulberry32(777);
  const platforms = [{ v: 'Сайт', w: 52, conv: 1 }, { v: 'Приложение iOS', w: 26, conv: 1.18 }, { v: 'Приложение Android', w: 22, conv: 1.1 }];
  const sources = [{ v: 'Поиск', w: 34, conv: 1.05 }, { v: 'Прямые заходы', w: 23, conv: 1.25 },
    { v: 'Реклама', w: 21, conv: .82 }, { v: 'Рассылки', w: 12, conv: 1.3 }, { v: 'Соцсети', w: 10, conv: .78 }];
  const stages = [
    { name: 'Посещение', order: 1, rate: 1 },
    { name: 'Карточка товара', order: 2, rate: 0.58 },
    { name: 'Корзина', order: 3, rate: 0.27 },
    { name: 'Оформление', order: 4, rate: 0.16 },
    { name: 'Оплата', order: 5, rate: 0.115 },
  ];
  const rows = [];
  for (let t = DATA_START; t <= DATA_END; t += DAY) {
    const d = new Date(t);
    const m = d.getUTCMonth(), wd = d.getUTCDay();
    const yearsFromStart = (t - DATA_START) / (365 * DAY);
    const base = 5200 * MONTH_SEASON[m] * (wd === 0 || wd === 6 ? 1.2 : 1) * (1 + 0.14 * yearsFromStart) * (0.88 + rnd() * 0.24);
    platforms.forEach(p => {
      sources.forEach(s => {
        const visits = base * (p.w / 100) * (s.w / 100);
        if (visits < 1) return;
        stages.forEach(st => {
          const k = st.order === 1 ? 1 : Math.pow(p.conv * s.conv, 0.6);
          const users = Math.round(visits * st.rate * k * (0.94 + rnd() * 0.12));
          if (users > 0) rows.push({ date: t, platform: p.v, source: s.v, stage: st.name, stage_order: st.order, users });
        });
      });
    });
  }
  return rows;
}

const AGGS = {
  SUM: 'Сумма', AVG: 'Среднее', COUNT: 'Количество', COUNT_DISTINCT: 'Уникальных',
  MIN: 'Минимум', MAX: 'Максимум', MEDIAN: 'Медиана',
};
const TIME_GRAINS = { day: 'День', week: 'Неделя', month: 'Месяц', quarter: 'Квартал', year: 'Год' };
const MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const MONTHS_FULL = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];

function truncTime(ms, grain) {
  if (ms == null || isNaN(ms)) return null;
  const d = new Date(ms);
  const y = d.getUTCFullYear(), m = d.getUTCMonth();
  switch (grain) {
    case 'year': return Date.UTC(y, 0, 1);
    case 'quarter': return Date.UTC(y, m - (m % 3), 1);
    case 'month': return Date.UTC(y, m, 1);
    case 'week': {
      const day = Date.UTC(y, m, d.getUTCDate());
      const wd = (d.getUTCDay() + 6) % 7;
      return day - wd * DAY;
    }
    case 'day': return Date.UTC(y, m, d.getUTCDate());
    default: return ms;
  }
}
function shiftTime(ms, grain, n) {
  const d = new Date(ms);
  switch (grain) {
    case 'year': return Date.UTC(d.getUTCFullYear() + n, d.getUTCMonth(), d.getUTCDate());
    case 'quarter': return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 3 * n, d.getUTCDate());
    case 'month': return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, d.getUTCDate());
    case 'week': return ms + 7 * n * DAY;
    default: return ms + n * DAY;
  }
}
const pad2 = n => String(n).padStart(2, '0');
function fmtDate(ms, grain) {
  if (ms == null || ms === '') return '—';
  const d = new Date(ms);
  const y = d.getUTCFullYear(), m = d.getUTCMonth(), dd = d.getUTCDate();
  switch (grain) {
    case 'year': return String(y);
    case 'quarter': return `${Math.floor(m / 3) + 1} кв. ${y}`;
    case 'month': return `${MONTHS_SHORT[m]} ${y}`;
    case 'week': return `нед. с ${pad2(dd)}.${pad2(m + 1)}.${String(y).slice(2)}`;
    default: {
      const hh = d.getUTCHours(), mi = d.getUTCMinutes();
      const base = `${pad2(dd)}.${pad2(m + 1)}.${y}`;
      return (hh || mi) && !grain ? `${base} ${pad2(hh)}:${pad2(mi)}` : base;
    }
  }
}
function isoDate(ms) {
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
}
function parseIsoDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null;
}

const NUMBER_FORMATS = {
  auto: 'Как у метрики', smart: 'Сокращённо (1,2 млн)', int: 'Целое (1 234 567)', dec1: 'Один знак (1 234,5)',
  dec2: 'Два знака (1 234,56)', pct: 'Проценты (12,3 %)', rub: 'Рубли (1 234 ₽)', rub_smart: 'Рубли сокращённо (1,2 млн ₽)',
};
/* Единица измерения прячется в самом формате: 'suffix:шт.' — чтобы она доехала
   до осей, легенд, подсказок и ячеек, не меняя подпись fmtNum по всему движку */
const SUFFIX_RE = /^suffix:(.*)$/;
const fmtSuffix = f => { const m = SUFFIX_RE.exec(f || ''); return m ? m[1] : null; };
const withSuffix = s => 'suffix:' + String(s || '').trim();
function formatLabel(f) {
  const s = fmtSuffix(f);
  if (s !== null) return s ? `Единица «${s}»` : 'Без единиц';
  return NUMBER_FORMATS[f] || f;
}
const nfCache = {};
function nf(min, max) {
  const k = min + ':' + max;
  return nfCache[k] || (nfCache[k] = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: min, maximumFractionDigits: max }));
}
function smartNum(v) {

let activePop = null;

function openPop(anchor, content, opts = {}) {
  closePop();
  const p = h('div', { class: 'pop ' + (opts.cls || '') }, content);
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect();
  const pw = p.offsetWidth, ph = p.offsetHeight;
  let left = opts.alignRight ? r.right - pw : r.left;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  let top = r.bottom + 4;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 4);
  p.style.left = left + 'px'; p.style.top = top + 'px';
  const onDown = e => { if (!p.contains(e.target) && !anchor.contains(e.target)) closePop(); };
  const onKey = e => { if (e.key === 'Escape') closePop(); };
  setTimeout(() => { document.addEventListener('mousedown', onDown); document.addEventListener('keydown', onKey); }, 0);
  p.cleanup = () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); opts.onClose && opts.onClose(); };
  activePop = p;
  return p;
}

  const btn = h('button', { class: 'ms-btn', type: 'button' });

    const o = list && list.find(x => String(x.value) === String(v));

  };
  const paint = () => {
    clear(btn);

    else { value.slice(0, 2).forEach(v => btn.appendChild(h('span', { class: 'tag' }, labelOf(v)))); btn.appendChild(h('span', { class: 'tag' }, '+' + (value.length - 2))); }
  };

      if (!shown.length) list.appendChild(h('div', { class: 'muted', style: { padding: '8px' } }, 'Ничего не найдено'));

          h('input', { type: opts.multi === false ? 'radio' : 'checkbox', name: 'ms', checked: on, onchange: () => {
            if (opts.multi === false) { value = on ? [] : [o.value]; commit(); closePop(); return; }
            value = on ? value.filter(v => String(v) !== String(o.value)) : [...value, o.value];
            commit(); renderList();
          } }),
          h('span', { title: o.label }, o.label), o.count != null ? h('small', null, fmtNum(o.count, 'smart')) : null));
      });
    };

    search.addEventListener('input', renderList);
    renderList();
    const pop = h('div', { class: 'ms-pop' }, search, list,
      h('div', { class: 'ms-actions' },
        opts.multi !== false ? h('button', { class: 'btn sm', type: 'button', onclick: () => { const q = search.value.trim().toLowerCase(); value = [...new Set([...value, ...all.filter(o => !q || String(o.label).toLowerCase().includes(q)).map(o => o.value)])]; commit(); renderList(); } }, 'Выбрать все') : null,
        h('button', { class: 'btn sm', type: 'button', onclick: () => { value = []; commit(); renderList(); } }, 'Очистить')));

  try {
    const url = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
    const a = h('a', { href: url, download: name });
    document.body.appendChild(a);

    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return true;
  } catch (e) {

    return false;
  }

// IndexedDB для загруженных наборов данных (они могут быть большими)
const idb = (() => {
  let dbp = null;
  const mem = new Map();
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(res => {
      try {
        const rq = indexedDB.open('kobra', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('datasets');
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const db = await open();
    if (!db) return null;
    return new Promise(res => {
      try {
        const t = db.transaction('datasets', mode);
        const st = t.objectStore('datasets');
        const rq = fn(st);
        t.oncomplete = () => res(rq ? rq.result : true);
        t.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  return {
    async set(k, v) { mem.set(k, v); const r = await tx('readwrite', st => st.put(v, k)); return r != null; },
    async get(k) { const r = await tx('readonly', st => st.get(k)); return r != null ? r : mem.get(k); },
    async del(k) { mem.delete(k); await tx('readwrite', st => st.delete(k)); },
    async keys() { const r = await tx('readonly', st => st.getAllKeys()); return r || [...mem.keys()]; },
  };
})();

/* XY-запрос: категории по оси X, серии по метрикам и/или измерению */

    let svals = [...sTot.keys()].sort((a, b) => sd.type === 'date' ? a - b : sTot.get(b) - sTot.get(a));
    if (seriesLimit && svals.length > seriesLimit) svals = svals.slice(0, seriesLimit);
    const sIdx = new Map(svals.map((v, i) => [v, i]));

      res.mets.forEach((m, mi) => { series[mi * svals.length + si].data[ci] = r[m.key]; });
    });
  } else {
    res.mets.forEach((m, mi) => series.push({ name: m.label, metric: m, mi, data: new Array(cats.length).fill(null) }));
    res.rows.forEach(r => { const ci = catIdx.get(r[xd.key]); if (ci == null) return; res.mets.forEach((m, mi) => { series[mi].data[ci] = r[m.key]; }); });

}

  } else out.push({ col: q.xd.col, op: 'in', val: [v], label: `${q.xd.label}: ${fmtDimValue(v, q.xd)}` });

      const sorted = ps.length > 6 ? [...ps].sort((a, b) => (b.value || 0) - (a.value || 0)) : ps;

      { key: 'skip_partial', type: 'check', label: 'Не учитывать неполный последний период', def: true },
    ] },
  ],
  // skip_partial по умолчанию включён: данные почти всегда обрываются на середине
  // текущего месяца, и тогда KPI сравнивает незакрытый месяц с полным предыдущим и
  // показывает ложный обвал («−49,5 % к сен»). Отброшенный период не прячется —
  // подпись под числом всегда называет месяц, за который взято число. Демо-дашборд
  // это не меняет: демо-наборы заканчиваются 31.08.2026, последний месяц у них полный,
  // а единственный недельный KPI («Оплаченные заказы онлайн») и так ставил галочку сам.
  defaults: ds => ({ metric: firstMetric(ds), time_col: ds.mainDttm, x_grain: 'month', value_mode: 'last', compare_lag: 1, show_trend: true, skip_partial: true, y_format: 'auto', time_range: { preset: 'all' }, adhoc_filters: [], subheader: '' }),
  render(root, ctx) {
    const { ds, params: p } = ctx;
    if (!p.metric) return vizMsg(root, 'Выберите метрику');
    const tc = p.time_col || ds.mainDttm;
    if (!isDateCol(ds, tc)) return vizMsg(root, 'Выберите колонку времени');
    const res = runQuery(ds, { filters: ctx.filters, groupby: [{ col: tc, grain: p.x_grain || 'month' }], metrics: [p.metric], orderby: [{ key: tc + '__' + (p.x_grain || 'month'), desc: false }] });
    ctx.setData(res);
    let pts = res.rows.map(r => [r[res.dims[0].key], r[res.mets[0].key]]);
    if (p.skip_partial && pts.length > 1) {
      const last = pts[pts.length - 1][0], end = shiftTime(last, p.x_grain || 'month', 1);
      if (dsMaxDate(ds, tc) < end - DAY) pts = pts.slice(0, -1);
    }
    if (!pts.length) return vizMsg(root, 'Нет данных для выбранных фильтров');
    const m = res.mets[0];
    const f = p.y_format && p.y_format !== 'auto' ? p.y_format : m.format;
    let v, dl = null;
    if (p.value_mode === 'total') v = runQuery(ds, { filters: ctx.filters, metrics: [p.metric] }).rows[0][m.key];
    else v = pts[pts.length - 1][1];
    const lag = +(p.compare_lag ?? 1);
    if (p.value_mode !== 'total' && lag > 0 && pts.length > lag) dl = bigNumDelta(v, pts[pts.length - 1 - lag][1], p.invert, ` к ${fmtDate(pts[pts.length - 1 - lag][0], p.x_grain)}`, f);
    disposeViz(root); clear(root);
    const box = h('div', { class: 'bn' },
      h('div', { class: 'num', title: fmtNum(v, 'dec2') }, fmtNum(v, f)),
      dl, h('div', { class: 'sub' }, (p.subheader || m.label) + (p.value_mode === 'total' ? '' : ` · ${fmtDate(pts[pts.length - 1][0], p.x_grain)}`)));
    root.appendChild(box);
    if (p.show_trend !== false && pts.length > 1) {
      const tr = h('div', { class: 'trend' });
      box.appendChild(tr);
      const t = themeColors();
      const c = ctx.colors[0];
      const inst = echarts.init(tr);
      root._ec = inst;
      inst.setOption({
        grid: { left: 0, right: 0, top: 6, bottom: 0 }, animationDuration: 350,
        xAxis: { type: 'category', show: false, data: pts.map(x => fmtDate(x[0], p.x_grain)), boundaryGap: false },
        yAxis: { type: 'value', show: false, scale: !p.trend_zero },
        tooltip: ecTooltip(t, { trigger: 'axis', formatter: ps => `${esc(ps[0].axisValueLabel)}<br><b>${fmtNum(ps[0].value, f)}</b>` }),
        series: [{ type: 'line', data: pts.map(x => x[1]), smooth: true, showSymbol: false, lineStyle: { color: c, width: 2 },
          areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: c + '55' }, { offset: 1, color: c + '00' }]) } }],
      });
    }
  },
};

function parseNums(s) {
  s = String(s || '').trim();
  if (!s) return [];
  const parts = s.includes(';') ? s.split(';') : s.split(/[,\s]+/);
  return parts.map(x => x.trim().replace(/\s/g, '').replace(',', '.')).filter(x => x !== '' && !isNaN(+x)).map(Number);
}

        target != null ? { name: 'Цель', type: 'scatter', data: rows.map((_, i) => [target, i]), symbol: 'rect', symbolSize: [3, rows.length > 6 ? 20 : 28], itemStyle: { color: t.ink }, z: 4 } : null,

      ].filter(Boolean),
    });
    inst.on('click', e => { if (ctx.cross && d && d.type !== 'date' && e.dataIndex != null && rows[e.dataIndex]) ctx.cross([{ col: d.col, op: 'in', val: [rows[e.dataIndex][d.key]], label: `${d.label}: ${cats[e.dataIndex]}` }]); });

/* Отрисовка графика с перехватом ошибок */
function renderChart(root, chart, opts = {}) {
  const ds = dsGet(chart.datasetId);
  const viz = VIZ[chart.viz];
  root._lastData = null;
  if (!ds) return vizMsg(root, 'Набор данных не найден. Возможно, его удалили.', true);
  if (!viz) return vizMsg(root, 'Неизвестный тип графика', true);
  const scheme = COLOR_SCHEMES[opts.scheme || chart.params.color_scheme] || COLOR_SCHEMES.kobra;
  const params = Object.assign({}, viz.defaults(ds), chart.params);
  const ctx = {
    ds, params, colors: scheme.colors,
    filters: buildChartFilters(ds, params, opts.extraFilters || []),
    setData: r => { root._lastData = r; },
    cross: opts.onCross || null, crossActive: opts.crossActive || null,
  };
  try { viz.render(root, ctx); }
  catch (e) { console.error(e); vizMsg(root, 'Ошибка построения: ' + e.message, true); }
}
function buildChartFilters(ds, params, extra) {
  const out = [];
  (params.adhoc_filters || []).forEach(f => { if (f && f.col) out.push(f); });
  if (params.time_range && params.time_range.preset && params.time_range.preset !== 'all' && ds.mainDttm) out.push({ col: ds.mainDttm, op: 'time_range', val: params.time_range });
  extra.forEach(f => { if (f && dsCol(ds, f.col)) out.push(f); });
  return out;
}

function registerBuiltins() {
  BUILTIN_DATASETS.forEach(b => {
    DS[b.id] = { id: b.id, name: b.name, builtin: true, description: b.description, mainDttm: b.mainDttm, columns: clone(b.columns), metrics: clone(b.metrics), rows: b.generate() };
  });
}
function applyDsOverrides() {
  // Пользовательские метрики для встроенных наборов
  Object.entries(STATE.dsMetrics || {}).forEach(([id, list]) => {
    const ds = DS[id]; if (!ds || !ds.builtin) return;
    const base = BUILTIN_DATASETS.find(b => b.id === id);
    ds.metrics = [...clone(base.metrics), ...list];
  });
}
/* Скрытый набор принадлежит дашборду: без дашборда он мусор в хранилище */
function dropOwnedDatasets() {
  let n = 0;
  Object.values(STATE.datasets || {}).forEach(meta => {
    if (!meta.owner || STATE.dashboards[meta.owner]) return;
    delete STATE.datasets[meta.id];
    delete DS[meta.id];
    n++;
  });
  return n;
}
/* Наборы, видимые человеку: скрытые макетные и временные примеры не в счёт */
const visibleDatasets = () => Object.values(DS).filter(d => !d.owner && !d.preview);

async function loadUploaded() {
  const ids = Object.keys(STATE.datasets || {});
  for (const id of ids) {
    const meta = STATE.datasets[id];
    if (meta.kind === 'schema') { DS[id] = Object.assign({}, meta, { rows: generateSchemaRows(meta.schema) }); continue; }
    const rows = await idb.get('rows:' + id);
    DS[id] = Object.assign({}, meta, { rows: rows || [], missingRows: !rows });
  }
}

let pageCleanup = null;
function go(hash) {
  if (location.hash === hash) { route(); return; }
  try { history.pushState(null, '', hash); route(); }
  catch (e) { location.hash = hash; }
}
function parseRoute() {
  const raw = (location.hash || '#/dashboards').slice(1);
  const [path, qs] = raw.split('?');
  const parts = path.split('/').filter(Boolean).map(decodeURIComponent);
  const q = {};
  (qs || '').split('&').filter(Boolean).forEach(kv => { const [k, v] = kv.split('='); q[k] = decodeURIComponent(v || ''); });
  return { parts, q };
}
function route() {
  closePop();
  if (pageCleanup) { try { pageCleanup(); } catch (e) { console.error(e); } pageCleanup = null; }
  const { parts, q } = parseRoute();
  const main = document.querySelector('.main');
  clear(main);
  main.scrollTop = 0;
  const sec = parts[0] || 'dashboards';
  // Примеры шаблонов живут только пока на них смотрят
  if (typeof purgePreviews === 'function') purgePreviews(sec === 'd' ? parts[1] : null);
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.sec === (sec === 'd' ? 'dashboards' : sec === 'explore' ? 'charts' : sec)));
  try {
    if (sec === 'd' && parts[1]) pageCleanup = renderDashboard(main, parts[1], q);
    else if (sec === 'templates') pageCleanup = renderTemplateList(main, q);
    else if (sec === 'charts') pageCleanup = renderChartList(main);
    else if (sec === 'explore') pageCleanup = renderExplore(main, parts, q);
    else if (sec === 'data' && parts[1]) pageCleanup = renderDatasetPage(main, parts[1]);
    else if (sec === 'data') pageCleanup = renderDatasetList(main);
    else pageCleanup = renderDashboardList(main);
  } catch (e) {
    console.error(e);
    main.appendChild(h('div', { class: 'page' }, h('div', { class: 'empty' }, h('b', null, 'Не удалось открыть страницу'), e.message, h('br'), h('a', { class: 'btn', href: '#/dashboards' }, 'К дашбордам'))));
  }
  document.title = 'Кобра — ' + ({ d: (STATE.dashboards[parts[1]] || {}).title || 'Дашборд', charts: 'Графики', explore: 'Конструктор графика', data: 'Данные', templates: 'Готовые шаблоны' }[sec] || 'Дашборды');
}

/* ---------- Каркас ---------- */

  clear(app);

  const paintTheme = () => { clear(themeBtn).appendChild(ic(isDark() ? 'sun' : 'moon')); };
  paintTheme();
  themeBtn._paint = paintTheme;
  const settingsBtn = h('button', { class: 'iconbtn-bar', title: 'Настройки', 'aria-label': 'Настройки' }, ic('settings'));
  settingsBtn.addEventListener('click', () => openMenu(settingsBtn, [
    { label: 'Экспорт в файл…', icon: 'download', onClick: () => openExportDialog() },
    { label: 'Импорт из файла…', icon: 'upload', onClick: openImportDialog },
    '-',
    { label: 'Вернуть демо-дашборд', icon: 'reset', onClick: restoreDemo },
    { label: 'Сбросить всё к начальному состоянию', icon: 'trash', danger: true, onClick: resetAll },
  ]));

    h('a', { class: 'brand', href: '#/dashboards', 'aria-label': 'Кобра — на главную' }, ic('cobra'), h('b', null, 'Кобра')),
    h('nav', { class: 'nav' },
      h('a', { href: '#/dashboards', 'data-sec': 'dashboards' }, 'Дашборды'),
      h('a', { href: '#/charts', 'data-sec': 'charts' }, 'Графики'),
      h('a', { href: '#/data', 'data-sec': 'data' }, 'Данные')),
    h('div', { class: 'spacer' }), themeBtn, settingsBtn));
  app.appendChild(h('main', { class: 'main' }));

}
function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function toggleTheme() {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('kobra.theme', next); } catch (e) { }
  window._themeBtn && window._themeBtn._paint();
  route();
}
async function restoreDemo() {
  const seed = seedState();
  let n = 0;
  Object.values(seed.charts).forEach(c => { if (!STATE.charts[c.id]) { STATE.charts[c.id] = c; n++; } });
  if (STATE.dashboards.d_demo && !(await confirmDialog('Вернуть демо-дашборд', 'Демо-дашборд «Продажи розничной сети» уже есть. Заменить его исходной версией? Ваши изменения в нём пропадут.', 'Заменить', false))) return;
  STATE.dashboards.d_demo = seed.dashboards.d_demo;
  Object.values(seed.charts).forEach(c => { STATE.charts[c.id] = c; });
  saveState();
  toast('Демо-дашборд восстановлен');
  go('#/d/d_demo');
}
async function resetAll() {
  if (!(await confirmDialog('Сбросить всё', 'Удалятся все ваши дашборды, графики и загруженные наборы данных. Останется только демо. Действие нельзя отменить.', 'Сбросить всё'))) return;
  for (const id of Object.keys(STATE.datasets || {})) { await idb.del('rows:' + id); delete DS[id]; }
  STATE = seedState();
  applyDsOverrides();
  saveState();
  toast('Кобра сброшена к начальному состоянию');
  go('#/dashboards');
}

/* ---------- Список дашбордов ---------- */
function dashThumb(d) {
  const th = h('div', { class: 'dash-thumb', 'aria-hidden': 'true' });
  const tab = d.tabs[0];
  if (!tab) return th;
  const maxY = Math.max(12, ...tab.items.map(i => i.y + i.h));
  tab.items.slice(0, 14).forEach(it => {
    const chart = it.type === 'chart' ? STATE.charts[it.chartId] : null;
    th.appendChild(h('i', { class: chart && chart.viz.startsWith('big_number') ? 'k' : '', style: {
      left: `calc(${(it.x / 12 * 100).toFixed(2)}% + 6px)`, width: `calc(${(it.w / 12 * 100).toFixed(2)}% - 8px)`,
      top: `calc(${(it.y / maxY * 100).toFixed(2)}% + 6px)`, height: `calc(${(it.h / maxY * 100).toFixed(2)}% - 6px)`,
      opacity: it.type === 'divider' ? .3 : 1,
    } }));
  });
  return th;
}
function fmtWhen(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const same = d.toDateString() === now.toDateString();
  return same ? `сегодня в ${pad2(d.getHours())}:${pad2(d.getMinutes())}` : `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`;
}
/* Три пути: взять готовое, строить самому, принести свои данные. Описаны
   одним списком, потому что показываются в двух местах — на стартовом экране
   и в диалоге «Новый дашборд», и расходиться им нельзя. В диалоге путей два:
   «мои данные» — это не создание дашборда, а загрузка файла. */
const START_WAYS = [
  { id: 'tpl', icon: 'schema', rec: true, title: 'Готовый шаблон',
    desc: 'Заготовленные отчёты: выбираете подходящий, а дальше при необходимости дорабатываете. Кобра соберёт его на придуманных данных и разложит по уровням — общая картина, разбор, исходные строки.',
    note: 'Зачастую подходит именно это: состав и оформление сделаны по стандартам визуализации, а названия блоков, показателей и категорий правятся прямо на дашборде.',
    act: () => go('#/templates') },
  { id: 'blank', icon: 'plus', title: 'Начать с нуля',
    desc: 'Пустой дашборд, в котором вы сами накидаете блоки, графики и вкладки. Данные под них Кобра придумает — выбирать набор не нужно.',
    act: () => createBlankDashboard() },
  { id: 'own', icon: 'upload', title: 'Мои данные', btn: 'Загрузить файл',
    desc: 'Загружаете CSV или Excel и строите по своим цифрам: то же самое, но на настоящих данных вашей выгрузки.',
    act: () => go('#/data') },

function startCard(w, onPick) {

function startChoice(ids) {

function renderDashboardList(main) {

function dashGrid(list) {
  const grid = h('div', { class: 'dash-grid' });
  list.forEach(d => {
    const nCharts = d.tabs.reduce((a, t) => a + t.items.filter(i => i.type === 'chart').length, 0);
    const more = h('button', { class: 'iconbtn', title: 'Действия', 'aria-label': 'Действия с дашбордом' }, ic('dots'));
    more.addEventListener('click', e => {
      e.stopPropagation();
      openMenu(more, [
        { label: 'Открыть', icon: 'eye', onClick: () => go('#/d/' + d.id) },
        { label: 'Дублировать', icon: 'copy', onClick: () => duplicateDashboard(d.id) },
        { label: 'Экспортировать в файл…', icon: 'download', onClick: () => openExportDialog(d.id) },

        { label: 'Удалить', icon: 'trash', danger: true, onClick: () => deleteDashboard(d.id) },
      ]);
    });
    grid.appendChild(h('div', { class: 'dash-card', tabindex: 0, role: 'link', onclick: () => go('#/d/' + d.id), onkeydown: e => { if (e.key === 'Enter') go('#/d/' + d.id); } },

      h('div', { class: 'meta' }, h('div', { class: 'grow' }, h('b', null, d.title),

  });
  grid.appendChild(h('button', { class: 'dash-card new-card', onclick: createDashboard }, ic('plus'), 'Новый дашборд'));

// Пустые дашборды, созданные кнопкой «Новый дашборд»: если с такого ушли,
// ничего не добавив, запись убирается, чтобы в списке не оставался мусор.
// Набор не сохраняется — после перезагрузки дашборд просто остаётся как раньше.
const freshDashboards = new Set();
/* Кнопка «Новый дашборд» сначала спрашивает, с чего начать: готовых шаблонов
   у человека может не быть в голове, а начинать с пустого экрана тяжелее. */
function createDashboard() {
  const host = h('div', { class: 'start-choice tight' });
  const m = openModal({
    title: 'Новый дашборд', wide: true,
    body: h('div', null,
      h('p', { class: 'muted', style: { margin: '0 0 14px', fontSize: '13.5px' } },
        'Оба пути ведут к одному: дашборд потом правится как угодно.'), host),
    foot: close => [h('button', { class: 'btn', onclick: close }, 'Отмена')],
  });
  START_WAYS.filter(w => w.id !== 'own').forEach(w => host.appendChild(startCard(w, m.close)));
}
function createBlankDashboard() {
  // Пустой дашборд — тоже макет: под блоки нужны данные, и Кобра их придумает
  const mid = createMockup(null, { title: 'Новый макет' });
  if (mid) { freshDashboards.add(mid); go('#/d/' + mid + '?edit=1'); return; }
  const id = uid('d_');
  freshDashboards.add(id);
  STATE.dashboards[id] = { id, title: 'Новый дашборд', updated: Date.now(), crossFilter: true, scheme: null, tabs: [{ id: uid('t'), title: 'Вкладка 1', items: [] }], filters: [] };
  saveState();
  go('#/d/' + id + '?edit=1');
}
function duplicateDashboard(id) {
  const src = STATE.dashboards[id];
  const nid = uid('d_');
  const copy = clone(src);
  copy.id = nid; copy.title = src.title + ' (копия)'; copy.updated = Date.now();
  STATE.dashboards[nid] = copy;
  saveState();
  toast('Дашборд скопирован');
  route();
}
async function deleteDashboard(id) {
  const d = STATE.dashboards[id];
  if (!(await confirmDialog('Удалить дашборд', `Дашборд «${d.title}» будет удалён. Графики останутся в разделе «Графики».`))) return;
  delete STATE.dashboards[id];
  dropOwnedDatasets();
  saveState();
  toast('Дашборд удалён');
  go('#/dashboards');
}

/* ---------- Список графиков ---------- */

async function deleteChart(id) {

  const txt = used.length ? `График «${c.name}» будет удалён и исчезнет с ${used.length} ${plural(used.length, 'дашборда', 'дашбордов', 'дашбордов')}: ${used.map(d => d.title).join(', ')}.` : `График «${c.name}» будет удалён.`;
  if (!(await confirmDialog('Удалить график', txt))) return false;
  delete STATE.charts[id];
  used.forEach(d => d.tabs.forEach(t => { t.items = t.items.filter(i => i.chartId !== id); }));
  saveState();
  toast('График удалён');
  return true;
}

/* ---------- Запуск ---------- */
async function boot() {
  const theme = (() => { try { return localStorage.getItem('kobra.theme'); } catch (e) { return null; } })();
  if (theme) document.documentElement.setAttribute('data-theme', theme);
  await new Promise(r => setTimeout(r, 30));
  if (typeof echarts === 'undefined') {
    document.querySelector('.loading div span').textContent = 'Не загрузилась библиотека графиков. Проверьте подключение к интернету и обновите страницу.';
    return;
  }
  registerBuiltins();
  STATE = lsGet(LS_KEY);
  if (!STATE || STATE.v !== 2 || !STATE.charts) { STATE = seedState(); saveState(); }
  STATE.datasets = STATE.datasets || {}; STATE.dsMetrics = STATE.dsMetrics || {};
  applyDsOverrides();
  await loadUploaded();
  if (dropOwnedDatasets()) saveState();
  renderShell();
  let lastNav = { h: null, t: 0 };
  const onNav = () => { if (lastNav.h === location.hash && Date.now() - lastNav.t < 150) return; lastNav = { h: location.hash, t: Date.now() }; route(); };
  window.addEventListener('hashchange', onNav);
  window.addEventListener('popstate', onNav);
  // Внутренние ссылки обрабатываем сами: во встроенном окне просмотра переход по href может увести фрейм на чужой адрес
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (href.startsWith('#')) { e.preventDefault(); go(href); return; }
    if (/^https?:/i.test(href)) { e.preventDefault(); window.open(href, '_blank', 'noopener'); }
  }, true);
  let lastW = window.innerWidth;
  window.addEventListener('resize', debounce(() => { if (Math.abs(window.innerWidth - lastW) > 40 && (lastW < 760) !== (window.innerWidth < 760)) route(); lastW = window.innerWidth; }, 200));

  function addItem(item) {

    const move = ev => {
      const left = start.left + ev.clientX - sx, top = start.top + ev.clientY - sy;
      c.el.style.left = left + 'px'; c.el.style.top = top + 'px';
      const nx = Math.max(0, Math.min(G_COLS - it.w, Math.round(left / (g.colW + G_GAP))));
      const ny = Math.max(0, Math.round(top / (G_ROWH + G_GAP)));

      if (preview) preview.forEach(p => { const o = items.find(x => x.i === p.i); o.x = p.x; o.y = p.y; });

  function startResize(e, it) {

    const c = cells.get(it.i), g = geom();
    const start = px(it, g), sx = e.clientX, sy = e.clientY;
    const items = curTab().items;
    let preview = null;
    c.el.classList.add('dragging');
    phEl = h('div', { class: 'gph' }); gridEl.appendChild(phEl); place(phEl, start);
    const minH = it.type === 'divider' ? 1 : it.type === 'header' ? 1 : 3;
    const move = ev => {
      const wpx = Math.max(40, start.width + ev.clientX - sx), hpx = Math.max(20, start.height + ev.clientY - sy);
      c.el.style.width = wpx + 'px'; c.el.style.height = hpx + 'px';

      const nh = Math.max(minH, Math.round((hpx + G_GAP) / (G_ROWH + G_GAP)));

      const me = copy.find(x => x.i === it.i); me.w = nw; me.h = nh;

      place(phEl, px(me, g));

    const up = () => {

      c.el.classList.remove('dragging'); phEl && phEl.remove(); phEl = null;

  function autoScroll(ev) {

  /* ---------- Панель добавления ---------- */
  function paintPanel() {
    if (!panel) return;
    clear(panel);
    const seg = h('div', { class: 'seg', role: 'tablist' },
      h('button', { class: panelTab === 'charts' ? 'on' : '', onclick: () => { panelTab = 'charts'; paintPanel(); } }, 'Графики'),
      h('button', { class: panelTab === 'els' ? 'on' : '', onclick: () => { panelTab = 'els'; paintPanel(); } }, 'Элементы'));
    panel.appendChild(seg);
    const body = h('div', { class: 'edit-panel-body' });
    panel.appendChild(body);
    const mockupDs = D.fromTemplate ? dsGet(D.fromTemplate.datasetId) : null;
    if (panelTab === 'charts' && isMockupDs(mockupDs)) {
      // В макете блок выбирается видом: данные под него уже есть
      body.appendChild(h('p', { class: 'muted', style: { fontSize: '12.5px', margin: '0 0 10px' } },
        'Выберите вид блока. Название, показатель и категории поменяете на самом блоке.'));
      mockupBlockOptions(mockupDs).forEach(b => body.appendChild(h('button', { class: 'comp', onclick: () => {
        const cid = createMockupChart(mockupDs, b.viz);
        if (!cid) { toast('Такой блок на этих данных не построить', true); return; }
        addItem({ type: 'chart', chartId: cid });
      } }, ic(VIZ[b.viz].icon), h('div', { class: 'grow' }, h('b', null, b.name), h('span', null, VIZ[b.viz].desc)), ic('plus'))));
    } else if (panelTab === 'charts') {
      const onDash = new Set(D.tabs.flatMap(t => t.items.filter(i => i.type === 'chart').map(i => i.chartId)));
      const search = h('input', { class: 'input', type: 'search', placeholder: 'Найти график', style: { marginBottom: '10px' }, 'aria-label': 'Поиск графиков' });
      const list = h('div');
      const paintList = () => {
        clear(list);
        const qq = search.value.trim().toLowerCase();
        const charts = Object.values(STATE.charts).filter(c => !qq || c.name.toLowerCase().includes(qq)).sort((a, b) => (onDash.has(a.id) - onDash.has(b.id)) || (b.updated || 0) - (a.updated || 0));
        if (!charts.length) list.appendChild(h('div', { class: 'muted', style: { fontSize: '13px' } }, 'Графиков не найдено'));
        charts.forEach(c => list.appendChild(h('button', { class: 'comp' + (onDash.has(c.id) ? ' used' : ''), title: 'Добавить на текущую вкладку', onclick: () => addItem({ type: 'chart', chartId: c.id }) },
          ic(VIZ[c.viz].icon), h('div', { class: 'grow' }, h('b', null, c.name), h('span', null, VIZ[c.viz].label + (onDash.has(c.id) ? ' · уже на дашборде' : ''))), ic('plus'))));
      };
      search.addEventListener('input', paintList);
      body.append(
        h('button', { class: 'btn primary', style: { width: '100%', marginBottom: '12px' }, onclick: () => newChartDialog({ back: id }) }, ic('plus'), 'Новый график'),
        search, list);
      paintList();
    } else {
      const comp = (icon, title, sub, fn) => h('button', { class: 'comp', onclick: fn }, ic(icon), h('div', { class: 'grow' }, h('b', null, title), h('span', null, sub)), ic('plus'));
      body.append(
        comp('heading', 'Заголовок', 'Подпись раздела', () => addItem({ type: 'header', text: 'Новый раздел', size: 'l' })),
        comp('text', 'Текст', 'Markdown: пояснения, списки, ссылки', () => addItem({ type: 'markdown', text: '### Заголовок\nТекст с **выделением** и списком:\n- первый пункт\n- второй пункт' })),
        comp('divider', 'Разделитель', 'Горизонтальная линия', () => addItem({ type: 'divider' })),
        comp('dash', 'Вкладка', 'Новая вкладка дашборда', addTab),
        h('p', { class: 'muted', style: { fontSize: '12.5px', marginTop: '14px' } }, 'Перетаскивайте элементы за заголовок или значок ', h('span', { class: 'kbd' }, '⋮⋮'), ', размер меняйте за правый нижний угол. Текст редактируется двойным щелчком.'));
    }
  }
  // Черновик в STATE: зовётся из функции очистки, когда со страницы уходят
  function stash() {
    if (!editing) return;
    STATE.dashboards[id] = D; D.updated = Date.now(); saveState();
  }
  // Переходы внутрь приложения ничем не отличаются от ссылок в шапке:
  // черновик сохранит функция очистки, её зовёт route() при любом переходе.
  function leaveTo(hash) { go(hash); }

  /* ---------- Модалки ---------- */
  function fullscreenChart(chart) {
    const root = h('div', { class: 'viz-root' });
    const md = openModal({ title: chart.name, wide: 'x', body: h('div', { class: 'card', style: { height: '68vh', border: 0 } }, h('div', { class: 'card-body' }, root)), onClose: () => disposeViz(root) });
    requestAnimationFrame(() => renderChart(root, chart, { scheme: D.scheme, extraFilters: extraFiltersFor(chart.id) }));
  }
  function openFilterEditor() {
    openFilterEditorModal(D, list => {
      const oldById = Object.fromEntries(D.filters.map(f => [f.id, f]));
      list.forEach(f => {
        const o = oldById[f.id];
        if (!o || o.col !== f.col || o.type !== f.type || o.datasetId !== f.datasetId || JSON.stringify(o.def) !== JSON.stringify(f.def)) f.value = clone(f.def);
        else f.value = o.value;
      });
      D.filters = list;
      if (editing) STATE.dashboards[id].filters = clone(list);
      else { D.updated = Date.now(); }
      saveState();
      pending = {}; D.filters.forEach(f => { pending[f.id] = clone(f.value); });
      paintFilterBar(); refreshCharts();
      toast('Фильтры сохранены');
    });
  }

  /* ---------- Помощник ---------- */
  const aiDs = () => dsGet((D.fromTemplate || {}).datasetId) || dsGet(((STATE.charts[(D.tabs.flatMap(t => t.items).find(i => i.chartId) || {}).chartId] || {}).datasetId));
  function paintAi() {
    aiHost.className = 'ai-panel' + (aiOpen ? '' : ' closed');
    clear(aiHost);
    if (!aiOpen) { aiUi = null; setTimeout(layoutGrid, 220); return; }
    aiUi = renderAssistant(D, aiHost, {
      ds: aiDs,
      close: () => { aiOpen = false; paintAi(); paintHeadOnly(); },
      // Название из брифа — это название дашборда: два разных человек не ведёт
      renameDash: title => { D.title = title; D.updated = Date.now(); saveState(); paintHeadOnly(); },
      canRollback: () => !!aiSnap,
      rollback: () => {
        if (!aiSnap) return;
        (aiSnap.newCharts || []).forEach(cid => { delete STATE.charts[cid]; });
        Object.entries(aiSnap.charts || {}).forEach(([cid, c]) => { STATE.charts[cid] = c; });
        STATE.dashboards[id] = aiSnap.dash;
        if (aiSnap.ds) { STATE.datasets[aiSnap.ds.id] = aiSnap.ds.meta; DS[aiSnap.ds.id] = Object.assign({}, aiSnap.ds.meta, { rows: generateSchemaRows(aiSnap.ds.meta.schema) }); }
        aiSnap = null;
        saveState();
        go('#/d/' + id);
      },
      applyBlocks: blocks => {
        const ds = aiDs();
        if (!ds) { toast('Нет данных, на которых строить блоки', true); return; }
        snapshotForAi();
        const t = curTab();
        let y = Math.max(0, ...t.items.map(i => i.y + i.h), 0), x = 0, rowH = 0;
        blocks.forEach(b => {
          const cid = createMockupChart(ds, b.viz);
          if (!cid) return;
          if (b.name) { STATE.charts[cid].name = b.name; STATE.charts[cid].autoName = false; }
          aiSnap.newCharts.push(cid);
          const sz = itemDefaultSize('chart', STATE.charts[cid]);
          if (x + sz.w > G_COLS) { y += rowH; x = 0; rowH = 0; }
          t.items.push({ i: uid('i'), type: 'chart', chartId: cid, x, y, w: sz.w, h: sz.h });
          x += sz.w; rowH = Math.max(rowH, sz.h);
        });
        compactLayout(t.items);
        D.updated = Date.now();
        saveState();
        paintBody();
      },
      applySchema: schema => {
        const ds = aiDs();
        if (!isMockupDs(ds)) { toast('Подставить придуманные данные можно только в макет', true); return; }
        snapshotForAi();
        aiSnap.ds = { id: ds.id, meta: clone(STATE.datasets[ds.id]) };
        ds.schema = normalizeSchema(schema);
        ds.columns = ds.schema.columns.map(c => ({ key: c.key, label: c.label, type: c.type }));
        ds.metrics = schemaMetrics(ds.columns, null);
        ds.mainDttm = (ds.columns.find(c => c.type === 'date') || {}).key || null;
        ds.rows = generateSchemaRows(ds.schema);
        delete ds._maxCache;
        persistDs(ds);
        rebuildMockupBlocks(ds);
        paintAll();
      },
    });
    setTimeout(layoutGrid, 220);
  }
  /* Снимок перед применением: дашборд, его графики и набор. Графики живут
     отдельно от дашборда и правятся на месте — без их копии откат неполный. */
  function snapshotForAi() {
    if (aiSnap) return;
    const charts = {};
    D.tabs.forEach(t => t.items.forEach(i => { if (i.chartId && STATE.charts[i.chartId]) charts[i.chartId] = clone(STATE.charts[i.chartId]); }));
    aiSnap = { dash: clone(STATE.dashboards[id]), charts, newCharts: [], ds: null };
  }
  /* Данные сменились целиком — блоки пересобираем под новые поля */
  function rebuildMockupBlocks(ds) {
    D.tabs.forEach(t => {
      t.items = t.items.filter(i => {
        if (!i.chartId) return true;
        const c = STATE.charts[i.chartId];
        if (!c) return false;
        const fresh = createMockupChart(ds, c.viz);
        if (!fresh) { delete STATE.charts[i.chartId]; return false; }
        const keepName = c.autoName === false ? c.name : null;
        STATE.charts[i.chartId] = Object.assign(STATE.charts[fresh], { id: i.chartId });
        delete STATE.charts[fresh];
        if (keepName) { STATE.charts[i.chartId].name = keepName; STATE.charts[i.chartId].autoName = false; }
        // Заданное человеком имя бережём, остальным даём подпись из новых полей,
        // иначе после подмены данных дашборд превращается в «Столбцы, Столбцы»
        else guidedRetitle(ds, STATE.charts[i.chartId]);
        return true;
      });
    });
    D.filters = (D.filters || []).filter(f => dsCol(ds, f.col));
    D.updated = Date.now();
    saveState();
  }
  function paintHeadOnly() { paintBody(); }

  /* ---------- Сборка ---------- */
  function paintBody() {
    disposeCells();
    clear(dmain);
    if (editing) dmain.appendChild(h('div', { class: 'edit-banner' }, ic('edit'), 'Режим редактирования. Изменения появятся у всех после нажатия «Сохранить».'));
    if (tuning) dmain.appendChild(h('div', { class: 'edit-banner' }, ic('edit'),
      isMockupDs(dsGet((D.fromTemplate || {}).datasetId))
        ? 'Меняйте названия, показатели, единицы и категории прямо на блоках. Категории и подписи живут в данных, поэтому поменяются сразу во всех блоках.'
        : 'Меняйте названия блоков и разрезы прямо здесь. Данные набора при этом не трогаются — правятся только подписи.'));
    const fakeNames = [...new Set(D.tabs.flatMap(t => t.items.map(i => i.chartId && (STATE.charts[i.chartId] || {}).datasetId))
      .filter(x => isSchemaDs(DS[x])).map(x => DS[x].name))];
    // У макета пометка маленькая, рядом с названием: большая полоса занимает
    // пол-экрана и мозолит глаза, а сказать нужно всего одно слово
    const ownDs = D.fromTemplate ? dsGet(D.fromTemplate.datasetId) : null;
    if (!isMockupDs(ownDs) && fakeNames.length) dmain.appendChild(h('div', { class: 'edit-banner fake-banner' }, ic('schema'),
      `Это макет: ${fakeNames.length > 1 ? 'наборы' : 'набор'} ${fakeNames.map(n => '«' + n + '»').join(', ')} ${plural(fakeNames.length, 'содержит', 'содержат', 'содержат')} вымышленные данные.`));
    dmain.appendChild(paintHead());
    const tabs = paintTabs();
    if (tabs) dmain.appendChild(tabs);
    dmain.appendChild(paintGrid());
    paintPanel();
  }
  function paintAll() { paintFilterBar(); paintBody(); if (!editing) paintAi(); }
  paintAll();

  return () => {
    disposeCells();
    if (!editing) return;
    // Единственное место, где черновик успевает уцелеть: ссылки в шапке, логотип
    // и кнопка «назад» идут прямо в route(), а та зовёт только эту функцию.
    // Спрашивать здесь уже поздно — переход состоялся, — поэтому сохраняем молча
    // и говорим тостом, как это делал уход в конструктор графика.
    // «Отменить» и «Сохранить» ставят draftHandled сами, так что откат работает.
    if (!draftHandled && JSON.stringify(D) !== original) { stash(); toast('Изменения дашборда сохранены'); }
    // Пустой «Новый дашборд», с которого ушли, не оставляем в списке. Проверяем
    // именно запись в STATE: если человек успел дать название или завести фильтр,
    // работа уже есть — такой дашборд остаётся.
    const cur = STATE.dashboards[id];
    if (freshDashboards.has(id) && cur && /^Новый (дашборд|макет)$/.test(cur.title) && !cur.filters.length && !cur.tabs.some(t => t.items.length)) {
      freshDashboards.delete(id); delete STATE.dashboards[id];
      dropOwnedDatasets();   // придуманные данные брошенного макета тоже не нужны
      saveState();
    }
  };
}

/* ---------- Markdown ---------- */
function renderMarkdown(src) {
  try {
    const html = window.marked ? marked.parse(src, { breaks: true, gfm: true }) : esc(src).replace(/\n/g, '<br>');
    return window.DOMPurify ? DOMPurify.sanitize(html) : html;
  } catch (e) { return esc(src); }
}

/* ---------- Просмотр данных ---------- */
function showDataModal(title, data) {
  if (!data || !data.rows) { toast('Данных пока нет — дождитесь построения графика'); return; }
  const cols = [...(data.dims || []).map(d => ({ key: d.key, label: d.label, dim: d })), ...(data.mets || []).map(m => ({ key: m.key, label: m.label, fmt: m.format }))];
  const rows = data.rows.slice(0, 2000);
  const tbl = h('table', null,
    h('thead', null, h('tr', null, cols.map(c => h('th', null, c.label)))),
    h('tbody', null, rows.map(r => h('tr', null, cols.map(c => h('td', { style: c.dim ? null : { textAlign: 'right' } }, c.dim ? fmtDimValue(r[c.key], c.dim) : fmtNum(r[c.key], c.fmt === 'pct' ? 'pct' : 'dec2')))))));
  openModal({
    title: 'Данные: ' + title, wide: true,
    body: h('div', null, h('p', { class: 'muted', style: { marginTop: 0 } }, `${fmtNum(data.rows.length, 'int')} ${plural(data.rows.length, 'строка', 'строки', 'строк')} результата запроса` + (data.rows.length > 2000 ? ', показаны первые 2000' : '')),
      h('div', { class: 'prev-tbl', style: { maxHeight: '60vh' } }, tbl)),
  });
}

/* ---------- Редактор нативных фильтров ---------- */
function openFilterEditorModal(D, onSave) {
  const list = clone(D.filters);
  let sel = list[0] ? list[0].id : null;
  const listEl = h('div', { class: 'fedit-list' });
  const form = h('div', { class: 'fedit-form' });
  const chartsOnDash = D.tabs.map(t => ({ tab: t, charts: t.items.filter(i => i.type === 'chart' && STATE.charts[i.chartId]).map(i => STATE.charts[i.chartId]) }));
  const dsIds = Object.keys(DS);
  function paintList() {
    clear(listEl);

        field('Тип фильтра', selectEl([['select', 'Значение'], ['time', 'Период'], ['range', 'Числовой диапазон']], f.type, v => { f.type = v; resetCol(); paintForm(); })),

      field('Колонка', selectEl(colsFor().map(c => [c.key, c.label || c.key]), f.col, v => { f.col = v; f.def = f.type === 'time' ? { preset: 'all' } : f.type === 'range' ? ['', ''] : []; paintForm(); }),
        'Фильтр применяется ко всем графикам в области действия, в наборах которых есть колонка с таким же ключом.'));

        field('Значение по умолчанию', ds ? multiSelect({ multi: true, value: f.def || [], placeholder: 'Все значения', options: () => distinctValues(ds, f.col, []).map(x => ({ value: x.value, label: String(x.value), count: x.count })), onChange: v => { f.def = v; } }) : h('span')));

async function deleteDataset(d) {

  if (!(await confirmDialog('Удалить набор данных', txt))) return;
  charts.forEach(c => {

    Object.values(STATE.dashboards).forEach(db => db.tabs.forEach(t => { t.items = t.items.filter(i => i.chartId !== c.id); }));
  });

/* ---------- Загрузка файла ---------- */
function openUpload() {
  const input = h('input', { type: 'file', accept: '.csv,.tsv,.txt,.xlsx,.xls,.xlsm,.ods', style: { display: 'none' } });
  const status = h('div', { class: 'muted', style: { marginTop: '12px', fontSize: '13px' } });
  const drop = h('div', { class: 'upload-drop', tabindex: 0, role: 'button', onclick: () => input.click(), onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') input.click(); } },
    ic('upload'), h('b', null, 'Перетащите файл сюда или нажмите, чтобы выбрать'),
    h('span', null, 'CSV (разделители запятая, точка с запятой, табуляция) или Excel: .xlsx, .xls. Первая строка — заголовки.'));
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]); });
  input.addEventListener('change', () => { if (input.files[0]) handle(input.files[0]); });
  const md = openModal({ title: 'Загрузка данных', body: h('div', null, drop, input, status) });
  async function handle(file) {
    status.textContent = `Читаю «${file.name}»…`;
    try {
      const parsed = await parseFile(file, status);
      md.close();
      openUploadPreview(file, parsed);
    } catch (e) {
      console.error(e);
      status.textContent = '';
      toast('Не удалось прочитать файл: ' + e.message, true);
    }
  }
}
async function parseFile(file, status) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (['xlsx', 'xls', 'xlsm', 'ods'].includes(ext)) {
    status.textContent = 'Загружаю модуль чтения Excel…';
    await loadScript(CDN_XLSX);
    const buf = await file.arrayBuffer();
    status.textContent = 'Разбираю книгу…';
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const sheets = {};
    wb.SheetNames.forEach(n => { sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: false }); });
    return { kind: 'excel', sheets, sheetNames: wb.SheetNames };
  }
  status.textContent = 'Загружаю модуль чтения CSV…';
  await loadScript(CDN_PAPA);
  let text = await file.text();
  if (/\uFFFD/.test(text.slice(0, 5000))) {
    // Похоже на Windows-1251
    try { text = new TextDecoder('windows-1251').decode(await file.arrayBuffer()); } catch (e) { }
  }
  const res = Papa.parse(text.replace(/^\uFEFF/, ''), { skipEmptyLines: 'greedy', delimitersToGuess: [',', ';', '\t', '|'] });
  if (!res.data.length) throw new Error('файл пуст');
  return { kind: 'csv', sheets: { CSV: res.data }, sheetNames: ['CSV'], delimiter: res.meta.delimiter };
}

/* Типизация */
function parseNumberLoose(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (v == null) return null;
  let s = String(v).trim().replace(/[\u00A0\u202F\s]/g, '').replace(/[₽$€%]|руб\.?/gi, '');
  if (s === '') return null;
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d+(,\d+)?$/.test(s)) s = s.replace(',', '.');
  else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
  if (!/^-?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s)) return null;
  return +s;
}
function parseDateLoose(v) {
  if (v instanceof Date) return isNaN(v) ? null : Date.UTC(v.getFullYear(), v.getMonth(), v.getDate(), v.getHours(), v.getMinutes(), v.getSeconds());
  if (v == null) return null;
  const s = String(v).trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2}))?)?/.exec(s);
  if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
  m = /^(\d{1,2})[./](\d{1,2})[./](\d{4})(?:[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/.exec(s);
  if (m) return Date.UTC(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
  m = /^(\d{4})[./](\d{1,2})$/.exec(s); // 2024.03
  if (m) return Date.UTC(+m[1], +m[2] - 1, 1);
  return null;
}
function guessType(values) {
  const sample = values.filter(v => v != null && String(v).trim() !== '').slice(0, 300);
  if (!sample.length) return 'string';
  if (sample.every(v => v instanceof Date || (typeof v === 'string' && parseDateLoose(v) != null && /[-./]/.test(v)))) return 'date';
  if (sample.every(v => parseNumberLoose(v) != null)) {
    // Номера с ведущими нулями — это текст (коды, артикулы)
    if (sample.some(v => typeof v === 'string' && /^0\d+/.test(v.trim()))) return 'string';
    return 'number';
  }
  return 'string';
}
function slugKey(s, i, used) {
  const tr = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'c', ч: 'ch', ш: 'sh', щ: 'sch', ъ: '', ы: 'y', ь: '', э: 'e', ю: 'yu', я: 'ya' };
  let k = String(s || '').toLowerCase().split('').map(ch => tr[ch] ?? ch).join('').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 40) || 'col_' + (i + 1);
  if (/^\d/.test(k)) k = 'c_' + k;
  let base = k, n = 2;
  while (used.has(k)) k = base + '_' + (n++);
  used.add(k);
  return k;
}
