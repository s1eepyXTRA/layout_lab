async function saveUploaded(name, fileName, cols, data) {
  if (!cols.length) throw new Error('не выбрано ни одной колонки');
  const rows = data.map(r => {
    const o = {};
    cols.forEach(c => {
      const raw = r[c.idx];
      if (raw == null || String(raw).trim() === '') { o[c.key] = null; return; }
      o[c.key] = c.type === 'number' ? parseNumberLoose(raw) : c.type === 'date' ? parseDateLoose(raw) : (raw instanceof Date ? fmtDate(parseDateLoose(raw)) : String(raw).trim());
    });
    return o;
  });
  const id = uid('ds_');
  const columns = cols.map(c => ({ key: c.key, label: c.label || c.key, type: c.type }));
  const metrics = [{ key: 'count', label: 'Количество строк', expr: { type: 'simple', agg: 'COUNT', col: '*' }, format: 'int' }];
  columns.filter(c => c.type === 'number').forEach(c => metrics.push({ key: 'sum_' + c.key, label: 'Сумма: ' + c.label, expr: { type: 'simple', agg: 'SUM', col: c.key }, format: 'smart' }));
  const mainDttm = (columns.find(c => c.type === 'date') || {}).key || null;
  const meta = { id, name, fileName, columns, metrics, mainDttm, created: Date.now(), description: '' };
  const ok = await idb.set('rows:' + id, rows);
  if (!ok) toast('Хранилище браузера недоступно: набор будет работать до перезагрузки страницы', true);
  STATE.datasets[id] = meta;
  DS[id] = Object.assign({}, meta, { rows });
  saveState();
  return id;
}

/* ============================================================
   Кобра · наборы-схемы
   Набор, у которого есть только описание колонок: строки Кобра
   придумывает сама и каждый раз одни и те же (детерминированный seed).
   Нужны для шаблонов и ТЗ, когда данных ещё нет на руках.
   ============================================================ */
const SCHEMA_ROWS_DEF = 3000;
const SCHEMA_ROWS_MAX = 50000;
const SCHEMA_SEASON = [.86, .82, .92, .88, .9, .92, .9, 1, 1.02, 1.05, 1.2, 1.5];
const SCHEMA_NOTE = 'Вымышленные данные: набор создан по описанию колонок, чтобы показать макет. Для отчётности не годится.';

/* Подсказки по названию колонки: тип и правдоподобные значения.
   Порядок важен: внутри одного прохода побеждает первая совпавшая подсказка
   (см. guessSchemaCol — сначала по первому слову названия, потом по названию целиком). */
const SCHEMA_HINTS = [
  { re: /(^|[^а-я])дата|дате|день|сутки|месяц|период|^date|_date|time/i, type: 'date' },
  { re: /процент|доля|конверсия|маржинальность|%/i, type: 'number', min: 0, max: 100, decimals: 1 },
  { re: /выручка|сумма|оборот|продаж|revenue|amount|стоимость|бюджет|расход|затрат|маржа|прибыль|cost|price|цена|чек|руб|₽|\$|€/i, type: 'number', min: 500, max: 250000 },
  { re: /количество|кол-во|qty|штук|^шт|заказ|сдел|звонк|заявк|визит|клик|показ|пользовател|посещен|срок|count|число/i, type: 'number', min: 1, max: 60 },
  { re: /город|city/i, type: 'string', values: ['Москва', 'Санкт-Петербург', 'Новосибирск', 'Екатеринбург', 'Казань', 'Краснодар', 'Воронеж'] },
  { re: /регион|округ|област|край|филиал|подразделен|region|территор/i, type: 'string', values: ['Центральный', 'Северо-Западный', 'Приволжский', 'Сибирский', 'Уральский', 'Южный'] },
  { re: /категор|группа товар|направлен|продукт|товар|услуг|category|product/i, type: 'string', values: ['Категория А', 'Категория Б', 'Категория В', 'Категория Г', 'Категория Д'] },
  { re: /канал|источник|трафик|channel|source|utm/i, type: 'string', values: ['Онлайн', 'Розница', 'Партнёры', 'Телефон', 'Рассылка'] },
  { re: /статус|этап|стади|состояни|status|stage/i, type: 'string', values: ['Новый', 'В работе', 'Согласован', 'Завершён', 'Отменён'] },
  { re: /менеджер|сотрудник|ответственн|продавец|оператор|manager|owner/i, type: 'string', values: ['Иванов И.', 'Петрова А.', 'Сидоров П.', 'Кузнецова М.', 'Новиков Д.', 'Морозова Е.'] },
  { re: /клиент|контрагент|заказчик|компани|customer|client|account/i, type: 'string', values: ['ООО «Вектор»', 'ООО «Аметист»', 'АО «Прогресс»', 'ИП Семёнов', 'ООО «Горизонт»', 'АО «Квант»'] },
  { re: /сегмент|тип|вид|формат|segment|kind/i, type: 'string', values: ['Крупный', 'Средний', 'Малый'] },
  { re: /платформ|устройств|platform|device|os/i, type: 'string', values: ['Сайт', 'Приложение iOS', 'Приложение Android'] },
  { re: /магазин|точк|склад|офис|store|shop/i, type: 'string', values: ['Точка №1', 'Точка №2', 'Точка №3', 'Точка №4', 'Точка №5'] },
  { re: /id$|номер|код|артикул|guid|uuid/i, type: 'string', ids: true },
];

/* Первое слово названия: «Статус сделки» → «статус», «Выручка, ₽» → «выручка».
   Хвост после запятой — единицы и уточнения, смысл колонки задаёт первое слово. */
function schemaHeadWord(label) {
  const head = String(label || '').split(',')[0].trim().split(/\s+/)[0] || '';
  return head.replace(/^[^\p{L}\p{N}_]+|[^\p{L}\p{N}_]+$/gu, '');
}

/* Подсказку ищем сначала по первому слову названия и только потом по названию
   целиком: иначе широкое правило обгоняет точное — «Статус сделки» попадал бы
   в количества по «сделк», а «Номер заказа» — по «заказ», и у набора появлялась
   бессмысленная метрика «Сумма: Статус сделки». */
function guessSchemaCol(label) {
  const full = String(label || '');
  const head = schemaHeadWord(full);
  const hit = (head && SCHEMA_HINTS.find(hr => hr.re.test(head))) || SCHEMA_HINTS.find(hr => hr.re.test(full));
  if (!hit) return { type: 'string', values: null };
  const out = { type: hit.type };
  if (hit.min != null) { out.min = hit.min; out.max = hit.max; out.decimals = hit.decimals || 0; }
  if (hit.values) out.values = hit.values.slice();
  if (hit.ids) out.ids = true;
  return out;
}

/* Значения по умолчанию для строковой колонки без подсказки: «Подпись 1…5» */
function schemaFallbackValues(label) {
  const base = String(label || 'Значение').trim().replace(/\s+/g, ' ').slice(0, 24) || 'Значение';
  return [1, 2, 3, 4, 5].map(i => `${base} ${i}`);
}

function hashUnit(s) {
  let hv = 2166136261;
  for (let i = 0; i < s.length; i++) { hv ^= s.charCodeAt(i); hv = Math.imul(hv, 16777619); }
  return ((hv >>> 0) % 10000) / 10000;
}

function normalizeSchema(sc) {
  const s = clone(sc || {});
  s.seed = s.seed || 1;
  s.rowCount = Math.max(1, Math.min(+s.rowCount || SCHEMA_ROWS_DEF, SCHEMA_ROWS_MAX));
  s.columns = (s.columns || []).filter(c => c && c.key);
  if (!parseIsoDate(s.dateFrom) || !parseIsoDate(s.dateTo) || parseIsoDate(s.dateFrom) >= parseIsoDate(s.dateTo)) {
    Object.assign(s, defaultSchemaPeriod());
  }
  return s;
}

/* Период по умолчанию для нового набора: 24 полных месяца, последний из них —
   прошлый, а не текущий. Если данные обрываются на середине месяца, последняя
   точка на любом графике по месяцам выглядит обвалом, а KPI с трендом честно
   пишет «−49 % к прошлому месяцу» — макет читается как отчёт о катастрофе.
   Даты фиксируются в схеме при создании — иначе строки менялись бы каждый день. */
function defaultSchemaPeriod() {
  const to = truncTime(Date.now(), 'month') - DAY; // последний день прошлого месяца
  return { dateFrom: isoDate(truncTime(shiftTime(to, 'month', -23), 'month')), dateTo: isoDate(to) };
}

/* Четыре формы распределения по кругу: длинный хвост, ровное, обратное и
   «один лидер». Больше вариантов человеку не нужно — он просто жмёт кнопку. */
const SCHEMA_SPREADS = 4;
function schemaWeight(i, n, spread) {
  switch (((spread % SCHEMA_SPREADS) + SCHEMA_SPREADS) % SCHEMA_SPREADS) {
    case 1: return 1 / Math.pow(i + 1, 0.25);              // почти поровну
    case 2: return 1 / Math.pow(n - i, 0.75);              // растёт к концу списка
    case 3: return i === 0 ? n * 1.4 : 1 / (i + 1);        // один явный лидер
    default: return 1 / Math.pow(i + 1, 0.75);             // длинный хвост
  }
}
function generateSchemaRows(schema) {
  const s = normalizeSchema(schema);
  const rnd = mulberry32(s.seed);
  const from = parseIsoDate(s.dateFrom), to = parseIsoDate(s.dateTo);
  const span = Math.max(to - from, DAY);
  const dateCols = s.columns.filter(c => c.type === 'date');
  const strCols = s.columns.filter(c => c.type === 'string');
  const numCols = s.columns.filter(c => c.type === 'number');
  // Первые значения в списке популярнее остальных — так столбики и секторы выглядят живее.
  // Форма распределения переключается (spread): иногда заказчику нужно, чтобы
  // картинка была похожа на его реальную, а данные всё равно придуманные.
  const pools = {};
  strCols.forEach(c => {
    const vals = (c.values && c.values.length ? c.values : schemaFallbackValues(c.label));
    pools[c.key] = vals.map((v, i) => ({ v, w: schemaWeight(i, vals.length, c.spread || 0) }));
  });
  const rows = new Array(s.rowCount);
  for (let i = 0; i < s.rowCount; i++) {
    const r = {};
    // Сдвигаем даты к концу периода: свежих записей чуть больше
    let ms = truncTime(from + Math.pow(rnd(), 0.85) * span, 'day');
    // Первые две строки ставим ровно на границы периода: набор должен покрывать
    // тот период, который написан на его странице. Иначе данные обрываются за день-два
    // до конца последнего месяца, и графики считают этот месяц незакрытым.
    if (i === 0) ms = from;
    else if (i === 1) ms = truncTime(to, 'day');
    dateCols.forEach(c => { r[c.key] = ms; });
    let catMul = 1;
    strCols.forEach((c, ci) => {
      if (c.ids) { r[c.key] = String(100000 + Math.floor(rnd() * 899999)); return; }
      const v = pickWeighted(rnd, pools[c.key]).v;
      r[c.key] = v;
      if (ci === 0) catMul = 0.55 + 1.5 * hashUnit(String(v)); // у каждой категории свой масштаб
    });
    const growth = 1 + 0.35 * ((ms - from) / span);
    const season = SCHEMA_SEASON[new Date(ms).getUTCMonth()];
    numCols.forEach(c => {
      const lo = c.min != null ? +c.min : 1, hi = c.max != null ? +c.max : 1000;
      const pct = lo >= 0 && hi <= 100 && (c.decimals || 0) > 0; // проценты не растим и не сезоним
      // Длинный хвост: большинство значений у нижней границы, в максимум упирается около 1 % строк
      const mul = pct ? 1 : (catMul * growth * season) / 2.2;
      const u = Math.min(1, Math.pow(rnd(), 1.8) * mul);
      const v = lo + (hi - lo) * u;
      r[c.key] = c.decimals ? +v.toFixed(c.decimals) : Math.round(v);
    });
    rows[i] = r;
  }
  return rows;
}

/* Метрики: количество строк плюс сумма по каждому числу. Свои метрики сохраняем. */
function schemaMetrics(columns, prev) {
  const keep = (prev || []).filter(m => {
    if (m.key === 'count' || m.key.startsWith('sum_') || m.key.startsWith('avg_')) return false;
    const used = JSON.stringify(m.expr).match(/"col":"([^"]+)"/g) || [];
    return used.every(u => u.slice(7, -1) === '*' || columns.some(c => c.key === u.slice(7, -1)));
  });
  const out = [{ key: 'count', label: 'Количество строк', expr: { type: 'simple', agg: 'COUNT', col: '*' }, format: 'int' }];
  columns.filter(c => c.type === 'number').forEach(c => {
    // Проценты складывать бессмысленно — для них среднее; деньги показываем рублями
    const isPct = /процент|доля|конверсия|%/i.test(c.label);
    const agg = isPct ? 'AVG' : 'SUM';
    const format = isPct ? 'dec1' : /₽|руб/i.test(c.label) ? 'rub_smart' : 'smart';
    out.push({
      key: (isPct ? 'avg_' : 'sum_') + c.key, label: (isPct ? 'Среднее: ' : 'Сумма: ') + c.label,
      expr: { type: 'simple', agg, col: c.key }, format,
    });
  });
  return out.concat(keep);
}

function saveSchemaDataset({ id, name, schema, owner }) {
  const sc = normalizeSchema(schema);
  const columns = sc.columns.map(c => ({ key: c.key, label: c.label || c.key, type: c.type }));
  const prev = id && DS[id] ? DS[id].metrics : null;
  const mainDttm = (columns.find(c => c.type === 'date') || {}).key || null;
  const dsId = id || uid('ds_');
  const meta = {
    id: dsId, name: name || 'Набор по схеме', kind: 'schema', schema: sc, columns,
    metrics: schemaMetrics(columns, prev), mainDttm, description: SCHEMA_NOTE,
    created: (STATE.datasets[dsId] || {}).created || Date.now(),
  };
  // Владелец — дашборд-макет: такой набор человеку не показывается и живёт вместе с ним
  const own = owner !== undefined ? owner : (STATE.datasets[dsId] || {}).owner;
  if (own) meta.owner = own;
  STATE.datasets[dsId] = meta;
  DS[dsId] = Object.assign({}, meta, { rows: generateSchemaRows(sc) });
  saveState();
  return dsId;
}

const isSchemaDs = d => !!(d && d.kind === 'schema');

const SCHEMA_COL_TYPES = [['string', 'Текст'], ['number', 'Число'], ['date', 'Дата']];

/* Смена типа колонки прямо на странице набора. Тип угадан по названию и иногда
   угадан неверно («Статус сделки» легко принять за количество), а чинить это
   через «Изменить схему» догадается не каждый. Для набора-схемы это недорого:
   строки и метрики всё равно пересчитываются генератором при каждом сохранении. */
function changeSchemaColType(dsId, key, type) {
  const d = DS[dsId];
  if (!d || !isSchemaDs(d)) return;
  const sc = normalizeSchema(d.schema);
  const col = sc.columns.find(c => c.key === key);
  if (!col || col.type === type) return;
  const g = guessSchemaCol(col.label || col.key);
  const same = g.type === type; // подсказка по названию подходит только для того же типа
  col.type = type;
  delete col.values; delete col.ids; delete col.min; delete col.max; delete col.decimals;
  if (type === 'number') {
    col.min = same && g.min != null ? g.min : 1;
    col.max = same && g.max != null ? g.max : 1000;
    col.decimals = same ? (g.decimals || 0) : 0;
  }
  if (type === 'string' && same) { if (g.values) col.values = g.values; if (g.ids) col.ids = true; }
  saveSchemaDataset({ id: d.id, name: d.name, schema: sc });
  toast(`Колонка «${col.label || col.key}» теперь «${TYPE_GROUP[type]}», строки и метрики пересчитаны`);
  go('#/data/' + d.id);
}

/* ---------- Диалог описания набора ---------- */
// Хвост вроде «, ₽» или «, шт.» — это часть названия колонки, а не отдельная колонка
const UNIT_TAIL = /^(₽|руб\.?|р\.|%|шт\.?|ед\.?|чел\.?|кг|т|л|м2|м²|мин|сек|дн\.?|тыс\.?|млн|млрд|\$|€|usd|eur)$/i;
function parseColumnNames(text, mergeUnits) {
  const raw = String(text || '').trim();
  if (!raw) return [];
  const lines = raw.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  let parts;
  if (lines.length > 1) parts = lines;                  // по одной колонке в строке
  else if (/\t/.test(raw)) parts = raw.split('\t');     // шапка, вставленная из Excel
  else if (/;/.test(raw)) parts = raw.split(';');
  else parts = raw.split(/[,|]/);
  parts = parts.map(x => x.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
  if (mergeUnits) {
    const merged = [];
    parts.forEach(p => {
      if (merged.length && UNIT_TAIL.test(p)) merged[merged.length - 1] += ', ' + p;
      else merged.push(p);
    });
    parts = merged;
  }
  return parts.slice(0, 40);
}

/* ============================================================
   Кобра · черновик дашборда по набору данных
   Одна кнопка на странице набора: Кобра сама подбирает метрики
   и разрезы, собирает графики и дашборд и открывает его в правке.
   Дальше человек только правит готовое, а не строит с нуля.
   Параметры графиков всегда кладутся поверх VIZ[type].defaults(ds),
   поэтому новый тип графика и изменившиеся дефолты не разъезжаются
   с генератором.
   ============================================================ */
const AUTO_DIMS_MAX = 3;        // сколько текстовых разрезов берём в работу
const AUTO_DIM_CARD_MAX = 60;   // колонка с большим числом значений — не разрез, а идентификатор
const AUTO_KPI_MAX = 3;
const AUTO_MONEY_RE = /₽|руб/i;
const AUTO_PCT_RE = /процент|доля|конверси|маржинальност|%/i;
const AUTO_ID_RE = /id$|номер|код|артикул|guid|uuid/i;
// Хвост-единица в подписи метрики: в названии графика он лишний
const AUTO_UNIT_TAIL = /,\s*(₽|руб\.?|р\.|%|шт\.?|ед\.?|чел\.?|кг|т|л|м2|м²|мин|сек|дн\.?|тыс\.?|млн|млрд|\$|€)\s*$/i;
const AUTO_AGG_PREFIX = /^(сумма|среднее|количество|уникальных|минимум|максимум|медиана)\s*:\s*/i;

/* ---------- Падежи для человеческих названий ---------- */
/* Названия графиков читает человек: «Выручка по филиалам» понятнее,
   чем «Выручка — Филиал». На расчёты падежи не влияют, поэтому хватает
   простых правил; чего не узнали — показываем через двоеточие. */
function autoNounDative(word) {
  const s = String(word || '').toLowerCase();
  if (!/^[а-яё][а-яё-]{2,}$/.test(s)) return null;
  // Слово уже во множественном: «филиалы» → «филиалам», «статьи» → «статьям»
  if (/ы$/.test(s)) return s.slice(0, -1) + 'ам';
  if (/и$/.test(s)) return s.slice(0, -1) + (/[кгхжшчщ]и$/.test(s) ? 'ам' : 'ям');
  if (/[иы]я$/.test(s)) return s.slice(0, -1) + 'ям';   // категория → категориям
  if (/[иы]е$/.test(s)) return s.slice(0, -1) + 'ям';   // направление → направлениям
  if (/я$/.test(s)) return s.slice(0, -1) + 'ям';       // статья → статьям
  if (/[ьй]$/.test(s)) return s.slice(0, -1) + 'ям';    // область → областям
  if (/[аоеу]$/.test(s)) return s.slice(0, -1) + 'ам';  // платформа → платформам
  return s + 'ам';                                      // филиал → филиалам
}
function autoAdjDative(word) {
  const s = String(word || '').toLowerCase();
  if (!/(ый|ой|ая|яя|ое|ее|ний|кий|ший|щий|жий|чий)$/.test(s) || s.length < 6) return null;
  const soft = /(яя|ее|ний|ший|щий|жий|чий)$/.test(s);
  return s.slice(0, -2) + (soft ? 'им' : 'ым');
}
// Слова-прилагательные в роли существительного: «Ответственный» → «ответственным»,
// а не «ответственныям». Берём только бесспорные окончания: «‑ий» бывает и у
// существительных («критерий»), там правило существительного верное.
const AUTO_ADJ_NOUN_RE = /(ый|ой|ая|ое|яя|ее)$/;
function autoDative(label) {
  const words = String(label || '').trim().split(/\s+/).filter(Boolean);
  if (!words.length || words.length > 2) return null;
  if (words.length === 1 && AUTO_ADJ_NOUN_RE.test(words[0].toLowerCase())) {
    const adj = autoAdjDative(words[0]);
    if (adj) return adj;
  }
  const noun = autoNounDative(words[words.length - 1]);
  if (!noun) return null;
  if (words.length === 1) return noun;
  const adj = autoAdjDative(words[0]);
  if (adj) return adj + ' ' + noun;                     // федеральный округ → федеральным округам
  const first = autoNounDative(words[0]);               // канал продаж → каналам продаж
  return first ? first + ' ' + words[1].toLowerCase() : null;
}
/* «Выручка» + «Филиал» → «Выручка по филиалам», иначе «Выручка: Филиал» */
function autoTitleBy(metricTitle, dimLabel) {
  const d = autoDative(dimLabel);
  return d ? `${metricTitle} по ${d}` : `${metricTitle}: ${dimLabel}`;
}

/* ---------- Подбор метрик ---------- */
function autoIsRowCount(ds, m) {
  if (m.kind !== 'saved') return m.agg === 'COUNT' && (!m.col || m.col === '*');
  const s = (ds.metrics || []).find(x => x.key === m.key);
  return !!(s && s.expr && s.expr.type === 'simple' && s.expr.agg === 'COUNT' && (!s.expr.col || s.expr.col === '*'));
}
/* Чем меньше, тем охотнее метрика становится главной:
   деньги → прочие числа → проценты → количество строк. */
function autoMetricRank(ds, m) {
  if (autoIsRowCount(ds, m)) return 4;
  const fmt = metricFormat(ds, m), label = metricLabel(ds, m);
  if (/^rub/.test(fmt) || AUTO_MONEY_RE.test(label)) return 0;
  if (fmt === 'pct' || AUTO_PCT_RE.test(label)) return 3;
  return 1;
}
/* Метрики набора в порядке осмысленности. Нет сохранённых — считаем суммы сами. */
function autoMetrics(ds) {
  let list = (ds.metrics || []).map(m => ({ kind: 'saved', key: m.key }));
  if (!list.length) {
    list = ds.columns.filter(c => c.type === 'number').slice(0, 4).map(c => ({ kind: 'simple', agg: 'SUM', col: c.key }));
    list.push({ kind: 'simple', agg: 'COUNT', col: '*' });
  }
  return list
    .map((m, i) => ({ m, i, rank: autoMetricRank(ds, m) }))
    .sort((a, b) => a.rank - b.rank || a.i - b.i)
    .map(x => x.m);
}
/* «Сумма: Выручка, ₽» → «Выручка»: в заголовке графика агрегат и единица лишние */
function autoMetricTitle(ds, m) {
  const full = metricLabel(ds, m);
  const short = full.replace(AUTO_AGG_PREFIX, '').replace(AUTO_UNIT_TAIL, '').trim();
  return short || full;
}

/* ---------- Подбор разрезов ---------- */
function autoDims(ds, max = AUTO_DIMS_MAX) {
  const out = [];
  for (const c of ds.columns) {
    if (c.type !== 'string') continue;
    if (AUTO_ID_RE.test(c.key + ' ' + (c.label || ''))) continue;
    const card = distinctValues(ds, c.key, [], AUTO_DIM_CARD_MAX + 1).length;
    if (card < 2 || card > AUTO_DIM_CARD_MAX) continue;
    out.push({ key: c.key, label: colLabel(ds, c.key), card });
    if (out.length >= max) break;
  }
  return out;
}
function autoDateCol(ds) {
  const key = ds.mainDttm || (ds.columns.find(c => c.type === 'date') || {}).key;
  const c = key && dsCol(ds, key);
  return c && c.type === 'date' ? key : null;
}
/* Номер документа — то, что autoDims отбрасывает как идентификатор.
   Нужен, чтобы отличить средний чек от средней строки заказа. */
function autoDocIdCol(ds) {
  for (const c of ds.columns) {
    if (c.type !== 'string' && c.type !== 'number') continue;
    if (!AUTO_ID_RE.test(c.key + ' ' + (c.label || ''))) continue;
    return c.key;
  }
  return null;
}

/* Этап воронки и план — роли, которые нужны не всем шаблонам, но угадываются так же */
const AUTO_STAGE_RE = /этап|стади|шаг|воронк|stage|статус|состояни/i;
const AUTO_STAGE_ORDER_RE = /порядок|очерёдн|очередн|номер этапа|order|seq/i;
const AUTO_PLAN_RE = /план|цель|норма|целев|target|plan|quota/i;
function autoStageCol(ds, dims) {
  const hit = (dims || autoDims(ds, 20)).find(d => AUTO_STAGE_RE.test(d.label + ' ' + d.key));
  return hit ? hit.key : null;
}
function autoStageOrderCol(ds) {
  const c = ds.columns.find(x => x.type === 'number' && AUTO_STAGE_ORDER_RE.test(x.key + ' ' + (x.label || '')));
  return c ? c.key : null;
}
/* План — числовая колонка, названная планом; метрикой делаем сумму по ней */
function autoPlanMetric(ds) {
  const saved = (ds.metrics || []).find(m => AUTO_PLAN_RE.test(m.label));
  if (saved) return { kind: 'saved', key: saved.key };
  const c = ds.columns.find(x => x.type === 'number' && AUTO_PLAN_RE.test(x.key + ' ' + (x.label || '')));
  return c ? { kind: 'simple', agg: 'SUM', col: c.key } : null;
}

/* ---------- Роли полей ----------
   Единственная точка подбора: ею пользуются и черновик по набору, и шаблоны.
   Не хватает правила — дописывать сюда, тогда оба пути поумнеют разом. */
function pickRoles(ds) {
  const metrics = autoMetrics(ds);
  const rank = m => autoMetricRank(ds, m);
  const money = metrics.find(m => rank(m) === 0) || null;
  const count = metrics.find(m => rank(m) === 1) || null;
  const rows = metrics.find(m => autoIsRowCount(ds, m)) || { kind: 'simple', agg: 'COUNT', col: '*' };
  // Смотрим шире трёх разрезов: среди дальних колонок может прятаться этап воронки.
  // Каждый разрез — проход по строкам, поэтому предел держим скромным.
  const dims = autoDims(ds, 12);
  const stage = autoStageCol(ds, dims);
  // Этап — не обычный разрез: в разрезы он попадать не должен, иначе задвоится
  const plain = dims.filter(d => d.key !== stage).slice(0, AUTO_DIMS_MAX);
  const plan = autoPlanMetric(ds);
  return {
    date: autoDateCol(ds),
    docId: autoDocIdCol(ds),
    money: money && plan && sameMetric(money, plan) ? null : money,  // план фактом не считаем
    count, rows, plan,
    stage, stageOrder: stage ? autoStageOrderCol(ds) : null,
    main: money || count || rows,   // главный показатель дашборда
    dim1: plain[0] || null,
    dim2: plain[1] || null,
    dim3: plain[2] || null,
    dims: plain, metrics,
  };
}
const sameMetric = (a, b) => !!a && !!b && JSON.stringify(a) === JSON.stringify(b);

/* ---------- Сборка ---------- */
/* Что получится: {charts:[{name,viz,params,size}], filters:[...]} — сначала план,
   потом раскладка, чтобы пустые блоки не оставляли дырок в сетке. */
function buildAutoDash(ds, opts = {}) {
  const roles = opts.roles || pickRoles(ds);
  const dt = roles.date;
  const mets = roles.metrics;
  const dims = roles.dims;
  const main = mets[0];
  const mainTitle = autoMetricTitle(ds, main);
  const kpi = (mets.filter(m => !autoIsRowCount(ds, m)).length ? mets.filter(m => !autoIsRowCount(ds, m)) : mets).slice(0, AUTO_KPI_MAX);
  const dBar = dims[0] || null;
  const dTable = dims[1] || dims[0] || null;
  const dPie = dims[2] || null;
  const charts = [];
  const add = (name, viz, params, size) => charts.push({ name, viz, params, size });

  if (opts.kpi !== false) kpi.forEach(m => {
    const title = autoMetricTitle(ds, m);
    if (dt) add(`${title} за месяц`, 'big_number_trend', { metric: m, time_col: dt, x_grain: 'month', value_mode: 'last', compare_lag: 1, skip_partial: true, subheader: title }, { w: kpi.length === 2 ? 6 : 4, h: 7 });
    else add(title, 'big_number', { metric: m, compare: 'none', subheader: `${title} за период` }, { w: kpi.length === 2 ? 6 : 4, h: 7 });
  });

  if (opts.trend !== false && dt) add(`${mainTitle} по месяцам`, 'line',
    { x_col: dt, x_grain: 'month', metrics: [main], smooth: true, markers: true, y_min_zero: true, show_legend: false },
    { w: 12, h: 12 });

  const hasBreak = opts.breakdown !== false && dBar;
  if (hasBreak) {
    add(autoTitleBy(mainTitle, dBar.label), 'bar',
      { x_col: dBar.key, metrics: [main], horizontal: dBar.card > 6, row_limit: 15, sort: 'value_desc', show_labels: !dPie && dBar.card <= 10, show_legend: false },
      { w: dPie ? 6 : 12, h: 12 });
    if (dPie) add(autoTitleBy(mainTitle, dPie.label), 'pie',
      { dim: dPie.key, metric: main, row_limit: 8, donut: true, label_type: 'pct', show_legend: true, legend_pos: 'right' },
      { w: 6, h: 12 });
  }

  if (opts.table !== false && dTable) {
    const tm = mets.slice(0, 3);
    const d = autoDative(dTable.label);
    add(d ? `Показатели по ${d}` : `Показатели: ${dTable.label}`, 'table',
      { mode: 'agg', groupby: [dTable.key], metrics: tm, row_limit: 100, page_size: '10', cell_bars: true, totals: true },
      { w: 12, h: 14 });
  }

  const filters = [];
  if (dt) filters.push({ id: uid('f_'), name: 'Период', type: 'time', datasetId: ds.id, col: dt, value: { preset: 'last_12m' }, def: { preset: 'last_12m' }, scope: 'all' });
  dims.slice(0, 2).forEach(d => filters.push({ id: uid('f_'), name: d.label, type: 'select', datasetId: ds.id, col: d.key, multi: true, value: [], def: [], scope: 'all', dependent: true }));

  return { charts, filters, hasBreak, dt, dims, mainTitle };
}

/* Собирает графики и дашборд, пишет их в STATE и открывает в режиме правки */
function createAutoDash(ds, title, opts = {}) {
  const plan = buildAutoDash(ds, opts);
  if (!plan.charts.length) { toast('По этому набору нечего собрать: нужна хотя бы одна числовая или текстовая колонка', true); return null; }
  const items = [];
  let y = 0;
  const note = `**Черновик**, собранный Коброй по набору «${ds.name}». `
    + (isSchemaDs(ds) ? SCHEMA_NOTE : 'Правьте графики, фильтры и раскладку: это отправная точка, а не готовый отчёт.');
  items.push({ i: uid('i'), type: 'markdown', x: 0, y, w: 12, h: 3, text: note });
  y += 3;
  // Раскладка по той же сетке 12 колонок: кладём слева направо, не влезло — новый ряд
  let x = 0, rowH = 0;
  const place = (w, hh) => {
    if (x + w > G_COLS) { y += rowH; x = 0; rowH = 0; }
    const pos = { x, y, w, h: hh };
    x += w; rowH = Math.max(rowH, hh);
    return pos;
  };
  const newRow = () => { if (x) { y += rowH; x = 0; rowH = 0; } };
  plan.charts.forEach(c => {
    const id = uid('c_');
    STATE.charts[id] = { id, name: c.name, viz: c.viz, datasetId: ds.id, autoName: true, params: Object.assign(VIZ[c.viz].defaults(ds), c.params), updated: Date.now() };
    const sz = c.size || itemDefaultSize('chart', STATE.charts[id]);
    // Заголовок-раздел перед разрезами: отделяет «что происходит» от «за счёт чего»
    if (c.viz === 'bar' && plan.hasBreak) { newRow(); items.push(Object.assign({ i: uid('i'), type: 'header', text: 'Разрезы', size: 'm', bg: false }, place(12, 2))); newRow(); }
    items.push(Object.assign({ i: uid('i'), type: 'chart', chartId: id }, place(sz.w, sz.h)));
  });
  compactLayout(items);

  const id = uid('d_');
  STATE.dashboards[id] = {
    id, title, updated: Date.now(), crossFilter: true, scheme: null,
    tabs: [{ id: uid('t'), title: 'Обзор', items }],
    filters: plan.filters,
  };
  saveState();
  return id;
}

/* ---------- Диалог ---------- */
function openAutoDashDialog(dsId) {
  const ds = DS[dsId];
  if (!ds) return;
  if (!ds.rows.length) { toast('В наборе нет строк: собирать дашборд не из чего', true); return; }
  let title = ds.name;
  const opts = { kpi: true, trend: true, breakdown: true, table: true };
  const plan = buildAutoDash(ds, opts);
  const dt = plan.dt;
  const dimsTxt = plan.dims.length ? plan.dims.map(d => d.label).join(', ') : 'не нашлись';
  const body = h('div', null,
    field('Название дашборда', h('input', { class: 'input', value: title, oninput: e => { title = e.target.value; } })),
    h('div', { class: 'field' }, h('div', { class: 'lbl' }, 'Что собрать'),

      checkbox('Динамику по месяцам', opts.trend, v => { opts.trend = v; }),
      checkbox('Разрезы: столбцы и круговую', opts.breakdown, v => { opts.breakdown = v; }),

      + (dt ? `Ось времени — «${colLabel(ds, dt)}», фильтр периода встанет на последние 12 месяцев.` : 'Колонки с датой нет: динамику построить не из чего.')),
    h('p', { class: 'muted', style: { fontSize: '12.5px', margin: '6px 0 0' } },
      'Это черновик: графики, фильтры и раскладку можно править как обычно, а лишнее — удалить.'));
  openModal({
    title: 'Собрать черновик дашборда', body,
    foot: close => [h('button', { class: 'btn', onclick: close }, 'Отмена'),

        if (!opts.kpi && !opts.trend && !opts.breakdown && !opts.table) { toast('Отметьте хотя бы один блок', true); return; }
        const id = createAutoDash(ds, title.trim() || ds.name, opts);
        if (!id) return;
        close();
        toast('Черновик собран: правьте и сохраняйте');
        go('#/d/' + id + '?edit=1');
      } }, ic('wand'), 'Собрать')],
  });
}

/* ============================================================
   Кобра · готовые шаблоны
   Шаблон — это скелет из уровней детализации: сводка (что происходит),
   разбор (за счёт чего), документы (исходные строки). Блоки ссылаются
   на роли полей, а не на колонки, поэтому один шаблон ложится на любой
   набор, где роли удаётся заполнить. Вид процесса меняет наполнение
   уровней, но не сам скелет.
   Подбор колонок под роли живёт в autodash.js (pickRoles) — здесь своих
   эвристик нет намеренно, иначе они разъедутся.
   ============================================================ */

/* ---------- Роли: как они называются для человека ---------- */
const TPL_ROLES = {
  date: { label: 'Дата', hint: 'по какой колонке считать время', type: 'date' },
  money: { label: 'Деньги', hint: 'что считаем деньгами', type: 'metric' },
  count: { label: 'Количество', hint: 'что считаем штуками', type: 'metric' },
  plan: { label: 'План', hint: 'с чем сравниваем факт', type: 'metric' },
  docId: { label: 'Номер документа', hint: 'что отличает один документ от другого', type: 'string' },
  stage: { label: 'Этап', hint: 'какой шаг процесса прошёл клиент', type: 'string' },
  dim1: { label: 'Главный разрез', hint: 'в разрезе чего смотрим в первую очередь', type: 'string' },
  dim2: { label: 'Второй разрез', hint: 'чем дополняем картину', type: 'string' },
  dim3: { label: 'Третий разрез', hint: 'что ещё полезно увидеть', type: 'string' },
};
const TPL_LEVELS = {
  sum: { title: 'Сводка', q: 'что происходит' },
  detail: { title: 'Разбор', q: 'за счёт чего' },
  docs: { title: 'Документы', q: 'какие именно строки' },
};

/* ---------- Производные показатели ----------
   Шаблон просит «деньги на документ», а не готовую метрику: если такой
   в наборе нет, Кобра её туда допишет (движок умеет отношения). */
const TPL_DERIVED = {
  avg_check: {
    label: 'Средний чек', format: 'rub', need: ['money', 'docId'],
    expr: r => ratioExpr(metricAggOf(r.ds, r.roles.money), { agg: 'COUNT_DISTINCT', col: r.roles.docId }),
  },
  plan_done: {
    label: 'Выполнение плана', format: 'pct', need: ['plan'],
    expr: r => ratioExpr(metricAggOf(r.ds, r.roles.money || r.roles.count || r.roles.rows), metricAggOf(r.ds, r.roles.plan)),
  },
};
/* Части отношения — это пары {agg, col} без поля type: именно так их хранит движок */
function metricAggOf(ds, m) {
  const e = metricExprOf(ds, m);
  if (!e || e.type === 'ratio') return null;   // отношение в отношение не вкладывается
  return { agg: e.agg, col: e.col };
}
const ratioExpr = (num, den) => (num && den ? { type: 'ratio', num, den } : null);
/* Метрика графика → выражение, пригодное для сохранённой метрики набора */
function metricExprOf(ds, m) {
  if (!m) return null;
  if (m.kind === 'saved') {
    const s = (ds.metrics || []).find(x => x.key === m.key);
    return s ? clone(s.expr) : null;
  }
  return { type: 'simple', agg: m.agg, col: m.col };
}
/* Ключ формулы: порядок полей не должен влиять на сравнение, иначе
   «такой показатель уже есть» не срабатывает и метрики задваиваются */
function exprKey(e) {
  if (e == null || typeof e !== 'object') return JSON.stringify(e);
  if (Array.isArray(e)) return '[' + e.map(exprKey).join(',') + ']';
  return '{' + Object.keys(e).sort().map(k => JSON.stringify(k) + ':' + exprKey(e[k])).join(',') + '}';
}

/* Ищем показатель в наборе по формуле, а не по названию: названия у всех разные */
function findMetricByExpr(ds, expr) {
  if (!expr) return null;
  const k = exprKey(expr);
  const hit = (ds.metrics || []).find(m => exprKey(m.expr) === k);
  return hit ? { kind: 'saved', key: hit.key } : null;
}
/* Что шаблон допишет в набор: считаем заранее, чтобы показать человеку до создания */
function plannedDerived(tpl, ds, roles) {
  const out = [];
  (tpl.derived || []).forEach(id => {
    const d = TPL_DERIVED[id];
    if (!d || d.need.some(r => !roles[r])) return;
    const expr = d.expr({ ds, roles });
    if (!expr || !expr.num || !expr.den) return;
    out.push({ id, label: d.label, format: d.format, expr, existing: findMetricByExpr(ds, expr) });
  });
  return out;
}
/* Создаёт недостающие показатели в наборе и отдаёт карту id → метрика графика */
function ensureDerived(tpl, ds, roles) {
  const map = {};
  plannedDerived(tpl, ds, roles).forEach(d => {
    if (d.existing) { map[d.id] = d.existing; return; }
    const key = uid('m_');
    ds.metrics = [...(ds.metrics || []), { key, label: d.label, expr: d.expr, format: d.format }];
    persistDs(ds);
    map[d.id] = { kind: 'saved', key };
  });
  return map;
}

/* Для примера на вымышленных данных набор в состояние не пишем */
function ensureDerivedInMemory(tpl, ds, roles) {
  const map = {};
  plannedDerived(tpl, ds, roles).forEach(d => {
    if (d.existing) { map[d.id] = d.existing; return; }
    const key = uid('m_');
    ds.metrics = [...(ds.metrics || []), { key, label: d.label, expr: d.expr, format: d.format }];
    map[d.id] = { kind: 'saved', key };
  });
  return map;
}

/* ---------- Пригодность шаблона ---------- */
function templateFits(tpl, ds, roles) {
  roles = roles || pickRoles(ds);
  const missing = (tpl.need || []).filter(r => !roles[r]);
  return { ok: !missing.length, missing, missingLabels: missing.map(r => (TPL_ROLES[r] || {}).label || r) };
}
/* Уровень документов бессмысленен там, где строка — уже агрегат */
const TPL_PREAGG_RE = /количество|кол-во|число|счётчик|счетчик|сумма строк|итого|qty|count|total/i;
function docsLevelFits(ds, roles) {
  if (!ds.columns.length) return { ok: false, why: 'в наборе нет колонок' };
  if (roles.docId) return { ok: true };
  const agg = ds.columns.find(c => c.type === 'number' && TPL_PREAGG_RE.test(c.label || c.key));
  if (agg) return { ok: false, why: `строка набора похожа на агрегат: в нём есть «${colLabel(ds, agg.key)}»` };
  return { ok: true };
}

        { kind: 'kpi', metric: 'plan', need: ['date', 'plan'] },
        { kind: 'kpi', metric: 'plan_done', derived: true, need: ['plan_done'] },
        { viz: 'mixed', metric: 'main', metricB: 'plan', by: 'date', need: ['date', 'plan'], size: { w: 12, h: 13 } },
        { viz: 'bar', metric: 'main', extra: ['plan'], by: 'dim1', need: ['dim1', 'plan'], size: { w: 12, h: 12 } },
      ] },
      { id: 'detail', blocks: [
        { viz: 'bar', metric: 'plan_done', by: 'dim1', derivedMetric: true, need: ['dim1', 'plan_done'], size: { w: 6, h: 12 }, params: { sort: 'value_asc' } },
        { viz: 'heatmap', metric: 'plan_done', by: 'date', y: 'dim1', derivedMetric: true, need: ['date', 'dim1', 'plan_done'], size: { w: 6, h: 12 }, params: { seq_scheme: 'rdylgn', normalize: 'none' } },
        { viz: 'table', metric: 'main', extra: ['plan', 'plan_done'], by: 'dim1', need: ['dim1', 'plan'], size: { w: 12, h: 14 } },
      ] },
      { id: 'docs', blocks: [{ kind: 'docs' }] },
    ],
  },
];
const tplById = id => TEMPLATES.find(t => t.id === id) || null;

/* ---------- Сборка дашборда из шаблона ---------- */
/* Роль показателя → метрика графика. Производные уже созданы в наборе. */
function tplMetric(name, roles, derived) {
  if (!name) return null;
  if (derived && derived[name]) return derived[name];
  if (name === 'main') return roles.main;
  if (name === 'rows') return roles.rows;
  return roles[name] || null;
}
/* Роль разреза → ключ колонки */
function tplDimKey(name, roles) {
  if (!name) return null;
  if (name === 'date') return roles.date;
  if (name === 'stage') return roles.stage;
  if (name === 'docId') return roles.docId;
  const d = roles[name];
  return d && d.key ? d.key : null;
}
function tplHas(name, roles, derived) {
  if (!name) return false;
  if (derived && derived[name]) return true;
  const r = TPL_ROLES[name];
  if (r && (r.type === 'string' || r.type === 'date')) return !!tplDimKey(name, roles);
  return !!tplMetric(name, roles, derived);
}
/* Колонка, по которой считается метрика: нужна таблице исходных строк */
function metricCol(ds, m) {
  const e = metricExprOf(ds, m);
  if (!e) return null;
  if (e.type === 'ratio') return (e.num || {}).col || null;
  return e.col === '*' ? null : e.col;
}
function tplTitle(ds, metric, dimLabel, dateBy) {
  const t = autoMetricTitle(ds, metric);
  if (dateBy) return `${t} по месяцам`;
  return dimLabel ? autoTitleBy(t, dimLabel) : t;
}
const tplDimLabel = (ds, key) => key ? colLabel(ds, key) : '';

/* Блок шаблона → график {name, viz, params, size} либо null, если нечем строить */
function tplBlockChart(b, ds, roles, derived) {
  const met = tplMetric(b.metric, roles, derived);
  const dim = tplDimKey(b.by, roles);
  const dimL = tplDimLabel(ds, dim);
  const extra = (b.extra || []).map(n => tplMetric(n, roles, derived)).filter(Boolean);
  const size = b.size || null;
  const p = o => Object.assign(o, b.params || {});

  if (b.kind === 'kpi') {
    if (!met) return null;
    const title = autoMetricTitle(ds, met);
    if (roles.date) return { name: `${title} за месяц`, viz: 'big_number_trend', size: size || { w: 4, h: 7 },
      params: p({ metric: met, time_col: roles.date, x_grain: 'month', value_mode: 'last', compare_lag: 1, skip_partial: true, subheader: title }) };
    return { name: title, viz: 'big_number', size: size || { w: 4, h: 7 }, params: p({ metric: met, compare: 'none', subheader: `${title} за период` }) };
  }
  if (b.kind === 'docs') {
    const cols = [];
    const push = k => { if (k && !cols.includes(k) && dsCol(ds, k)) cols.push(k); };
    push(roles.date); push(roles.docId); push(roles.stage);
    roles.dims.forEach(d => push(d.key));
    push(metricCol(ds, roles.money)); push(metricCol(ds, roles.count)); push(metricCol(ds, roles.plan));
    ds.columns.forEach(c => { if (cols.length < 8) push(c.key); });
    return { name: 'Исходные строки', viz: 'table', size: size || { w: 12, h: 18 },
      params: p({ mode: 'raw', columns: cols.slice(0, 8), order_col: roles.date || null, order_desc: true, search: true, page_size: '25', row_limit: 500 }) };
  }
  if (!met) return null;

  switch (b.viz) {
    case 'line': {
      const series = tplDimKey(b.series, roles);
      if (!roles.date) return null;
      return { name: tplTitle(ds, met, null, true), viz: 'line', size,
        params: p({ x_col: roles.date, x_grain: 'month', metrics: [met], series_col: series || null, smooth: true, markers: !series, y_min_zero: true, show_legend: !!series }) };
    }
    case 'area': {
      const series = tplDimKey(b.series, roles);
      if (!roles.date) return null;
      return { name: series ? `${autoMetricTitle(ds, met)} по месяцам: ${tplDimLabel(ds, series)}` : tplTitle(ds, met, null, true), viz: 'area', size,
        params: p({ x_col: roles.date, x_grain: 'month', metrics: [met], series_col: series || null, stacked: true, smooth: true, show_legend: !!series }) };
    }
    case 'bar': {
      if (!dim) return null;
      const series = tplDimKey(b.series, roles);
      return { name: tplTitle(ds, met, dimL), viz: 'bar', size,
        params: p({ x_col: dim, metrics: [met, ...extra], series_col: series || null, sort: 'value_desc', row_limit: 15, show_legend: !!(series || extra.length) }) };
    }
    case 'pie':
      if (!dim) return null;
      return { name: tplTitle(ds, met, dimL), viz: 'pie', size,
        params: p({ dim, metric: met, row_limit: 8, donut: true, label_type: 'pct', show_legend: true, legend_pos: 'right' }) };
    case 'funnel':
      if (!dim) return null;
      return { name: 'Воронка по этапам', viz: 'funnel', size,
        params: p({ dim, metric: met, order_by: roles.stageOrder || null, row_limit: 12, label_type: 'pct_first' }) };
    case 'treemap': {
      const d2 = tplDimKey(b.by2, roles);
      const gb = [dim, d2].filter(Boolean);
      if (!gb.length) return null;
      // Заголовок отличаем от столбчатой по тому же разрезу: иначе на дашборде два одинаковых
      const nm = d2 ? `${autoMetricTitle(ds, met)}: ${dimL} и ${tplDimLabel(ds, d2)}` : `Структура: ${tplTitle(ds, met, dimL)}`;
      return { name: nm, viz: 'treemap', size, params: p({ groupby: gb, metric: met, show_pct: true }) };
    }
    case 'heatmap': {
      const y = tplDimKey(b.y, roles);
      if (!roles.date || !y) return null;
      return { name: `${autoMetricTitle(ds, met)}: ${tplDimLabel(ds, y)} по месяцам`, viz: 'heatmap', size,
        params: p({ x_col: roles.date, y_col: y, x_grain: 'month', metric: met, seq_scheme: 'jade', normalize: 'all', y_limit: 20 }) };
    }
    case 'pivot': {
      const cols = tplDimKey(b.cols, roles);
      if (!dim || !cols) return null;
      return { name: `${autoMetricTitle(ds, met)}: ${dimL} × ${tplDimLabel(ds, cols)}`, viz: 'pivot', size,
        params: p({ rows: [dim], cols: [cols], metrics: [met], heat: true }) };
    }
    case 'mixed': {
      const mb = tplMetric(b.metricB, roles, derived);
      if (!roles.date || !mb) return null;
      return { name: `${autoMetricTitle(ds, met)} и ${autoMetricTitle(ds, mb)} по месяцам`, viz: 'mixed', size,
        params: p({ x_col: roles.date, x_grain: 'month', metrics: [met], metrics_b: [mb], type_a: 'bar', type_b: 'line', axis_b: 'left', smooth: true }) };
    }
    case 'table': {
      if (!dim) return null;
      const d = autoDative(dimL);
      return { name: d ? `Показатели по ${d}` : `Показатели: ${dimL}`, viz: 'table', size,
        params: p({ mode: 'agg', groupby: [dim], metrics: [met, ...extra], row_limit: 100, page_size: '10', cell_bars: true, totals: true }) };
    }
  }
  return null;
}

/* План дашборда: {levels:[{id,title,charts[]}], filters[], skipped[]} — сначала план,
   потом раскладка, чтобы пропущенные блоки не оставляли дырок в сетке. */
function buildFromTemplate(tpl, ds, roles, levelIds, derived) {
  const want = levelIds && levelIds.length ? levelIds : tpl.levels.map(l => l.id);
  const skipped = [];
  const levels = [];
  tpl.levels.forEach(lv => {
    if (!want.includes(lv.id)) return;
    const charts = [];
    lv.blocks.forEach(b => {
      const miss = (b.need || []).filter(n => !tplHas(n, roles, derived));
      if (miss.length) { skipped.push({ level: lv.id, need: miss }); return; }
      const c = tplBlockChart(b, ds, roles, derived);
      if (c) charts.push(c); else skipped.push({ level: lv.id, need: [b.metric || b.by || b.viz] });
    });
    if (charts.length) levels.push({ id: lv.id, title: TPL_LEVELS[lv.id].title, charts });
  });
  const filters = [];
  if (roles.date) filters.push({ id: uid('f_'), name: 'Период', type: 'time', datasetId: ds.id, col: roles.date, value: { preset: 'last_12m' }, def: { preset: 'last_12m' }, scope: 'all' });
  roles.dims.slice(0, 2).forEach(d => filters.push({ id: uid('f_'), name: d.label, type: 'select', datasetId: ds.id, col: d.key, multi: true, value: [], def: [], scope: 'all', dependent: true }));
  if (roles.stage) filters.push({ id: uid('f_'), name: colLabel(ds, roles.stage), type: 'select', datasetId: ds.id, col: roles.stage, multi: true, value: [], def: [], scope: 'all', dependent: false });
  return { levels, filters, skipped };
}

/* Раскладка блоков уровня по сетке 12 колонок, слева направо */
function tplLayout(charts, ds, intro, preview) {
  const items = [];
  let x = 0, y = 0, rowH = 0;
  if (intro) { items.push({ i: uid('i'), type: 'markdown', x: 0, y: 0, w: 12, h: 3, text: intro }); y = 3; }
  const place = (w, hh) => {
    if (x + w > G_COLS) { y += rowH; x = 0; rowH = 0; }
    const pos = { x, y, w, h: hh };
    x += w; rowH = Math.max(rowH, hh);
    return pos;
  };
  charts.forEach(c => {
    const id = uid('c_');
    STATE.charts[id] = { id, name: c.name, viz: c.viz, datasetId: ds.id, autoName: true, preview: preview || undefined, params: Object.assign(VIZ[c.viz].defaults(ds), c.params), updated: Date.now() };
    const sz = c.size || itemDefaultSize('chart', STATE.charts[id]);
    items.push(Object.assign({ i: uid('i'), type: 'chart', chartId: id }, place(sz.w, sz.h)));
  });
  compactLayout(items);
  return items;
}

/* Макет: данных нет, набор порождается под дашборд и прячется за ним */
function createMockup(tpl, { title, levels } = {}) {
  const name = (title || (tpl ? tpl.name : 'Макет')).trim() || 'Макет';
  const dashId = uid('d_');
  const dsId = saveSchemaDataset({ name: `Данные макета «${name}»`, schema: mockupSchema(tpl), owner: dashId });
  if (!tpl) { emptyMockup(dashId, dsId, name); return dashId; }
  const id = createFromTemplate(tpl, DS[dsId], { title: name, levels, dashId });
  if (!id) { delete STATE.datasets[dsId]; delete DS[dsId]; saveState(); return null; }
  return id;
}
/* Пустой макет: блоков нет, но данные под них уже готовы */
function emptyMockup(dashId, dsId, name) {
  STATE.dashboards[dashId] = {
    id: dashId, title: name, updated: Date.now(), crossFilter: true, scheme: null,
    tabs: [{ id: uid('t'), title: TPL_LEVELS.sum.title, level: 'sum', items: [] }],
    filters: [],
    fromTemplate: { tplId: null, datasetId: dsId, levels: ['sum'], roles: tplRoleMap(pickRoles(DS[dsId])) },
  };
  saveState();
}

/* Создаёт дашборд из шаблона, пишет его в STATE и возвращает id */
function createFromTemplate(tpl, ds, { title, roles, levels, preview, dashId }) {
  roles = roles || pickRoles(ds);
  const derived = preview ? ensureDerivedInMemory(tpl, ds, roles) : ensureDerived(tpl, ds, roles);
  const plan = buildFromTemplate(tpl, ds, roles, levels, derived);
  if (!plan.levels.length) { toast('По этому набору шаблон собрать нечем', true); return null; }
  // Подсказка словами, а не кнопкой: переход между уровнями делается теми же
  // средствами, что есть в обычной BI — кликом по графику и переключением вкладки
  const deeper = plan.levels[1]
    ? ` Чтобы углубиться, кликните по столбцу или сектору — остальные блоки отфильтруются — и перейдите на вкладку «${plan.levels[1].title}».`
    : '';
  const intro = `**${tpl.name}.** ${TPL_LEVELS[plan.levels[0].id].q[0].toUpperCase() + TPL_LEVELS[plan.levels[0].id].q.slice(1)}.`
    + deeper + ' '
    + (isSchemaDs(ds) ? SCHEMA_NOTE : 'Дашборд собран по готовому шаблону: правьте названия, разрезы и состав как обычно.');
  const tabs = plan.levels.map((lv, i) => ({
    id: uid('t'), title: lv.title, level: lv.id,
    items: tplLayout(lv.charts, ds, i === 0 ? intro : null, preview),
  }));
  const id = dashId || uid('d_');
  STATE.dashboards[id] = {
    id, title: title || tpl.name, updated: Date.now(), crossFilter: true, scheme: null, tabs, filters: plan.filters,
    preview: preview || undefined,
    fromTemplate: { tplId: tpl.id, datasetId: ds.id, levels: plan.levels.map(l => l.id), roles: tplRoleMap(roles) },
  };
  if (!preview) saveState();
  return id;
}
/* Карта ролей для хранения: только то, что нужно простой правке и провалу */
function tplRoleMap(roles) {
  return {
    date: roles.date || null, docId: roles.docId || null, stage: roles.stage || null,
    dim1: roles.dim1 ? roles.dim1.key : null, dim2: roles.dim2 ? roles.dim2.key : null, dim3: roles.dim3 ? roles.dim3.key : null,
  };
}

/* ---------- Выбор колонок под роли ---------- */
/* Варианты для роли: колонки подходящего типа либо показатели набора */
function roleOptions(ds, name) {
  const r = TPL_ROLES[name] || {};
  if (r.type === 'metric') {
    const out = (ds.metrics || []).map(m => ({ metric: { kind: 'saved', key: m.key }, label: m.label }));
    ds.columns.filter(c => c.type === 'number').forEach(c =>
      out.push({ metric: { kind: 'simple', agg: 'SUM', col: c.key }, label: 'Сумма: ' + colLabel(ds, c.key) }));
    return out;
  }
  const type = r.type === 'date' ? 'date' : 'string';
  const cols = ds.columns.filter(c => c.type === type || (name === 'docId' && c.type === 'number'));
  return cols.map(c => ({ key: c.key, label: colLabel(ds, c.key) }));
}
/* Текущее значение роли как подпись */
function roleValueLabel(ds, roles, name) {
  const r = TPL_ROLES[name] || {};
  if (r.type === 'metric') { const m = tplMetric(name, roles, null); return m ? metricLabel(ds, m) : null; }
  const k = tplDimKey(name, roles);
  return k ? colLabel(ds, k) : null;
}
function setRole(ds, roles, name, opt) {
  const r = TPL_ROLES[name] || {};
  if (r.type === 'metric') { roles[name] = opt ? opt.metric : null; roles.main = roles.money || roles.count || roles.rows; return; }
  if (name === 'dim1' || name === 'dim2' || name === 'dim3') {
    roles[name] = opt ? { key: opt.key, label: opt.label, card: 0 } : null;
    roles.dims = ['dim1', 'dim2', 'dim3'].map(k => roles[k]).filter(Boolean);
    return;
  }
  roles[name] = opt ? opt.key : null;
}
/* Роли, которые шаблон вообще использует: спрашивать про лишние незачем */
function tplUsedRoles(tpl) {
  const used = new Set(tpl.need || []);
  // Роли, от которых зависят производные показатели: без них человек не сможет
  // поправить подбор, а средний чек молча посчитается не по тому полю
  (tpl.derived || []).forEach(id => ((TPL_DERIVED[id] || {}).need || []).forEach(n => { if (TPL_ROLES[n]) used.add(n); }));
  tpl.levels.forEach(l => l.blocks.forEach(b => {
    (b.need || []).forEach(n => { if (TPL_ROLES[n]) used.add(n); });
    [b.metric, b.metricB, b.by, b.by2, b.y, b.series, b.cols, ...(b.extra || [])].forEach(n => { if (n && TPL_ROLES[n]) used.add(n); });
  }));
  return [...used];
}

/* ---------- Окно создания из шаблона ---------- */
function openTemplateDialog(tpl, dsId, opts = {}) {
  // Без набора — путь макета: данные Кобра придумает сама, роли спрашивать не о чем
  const mockup = !dsId;
  let title = tpl.name;
  const ds = mockup ? mockupDatasetDraft(tpl, title) : DS[dsId];
  if (!ds) { toast('Набор данных не найден', true); return; }
  const roles = pickRoles(ds);
  const docsFit = docsLevelFits(ds, roles);
  const levels = { sum: true, detail: true, docs: docsFit.ok };
  const body = h('div');
  const used = mockup ? [] : tplUsedRoles(tpl).filter(n => TPL_ROLES[n]);

  const paint = () => {
    clear(body);
    body.appendChild(field('Название дашборда', h('input', { class: 'input', value: title, oninput: e => { title = e.target.value; } })));

    if (mockup) body.appendChild(h('p', { class: 'muted', style: { fontSize: '13px', margin: '0 0 12px' } },
      'Данные Кобра придумает сама. Названия блоков, показателей и категорий поменяете прямо на дашборде.'));
    // Роли
    const rolesBox = h('div', { class: 'field' }, h('div', { class: 'lbl' }, 'Какие поля во что идут'),
      h('div', { class: 'hint', style: { marginBottom: '6px' } }, 'Кобра подобрала их сама — поменяйте, если взяла не то.'));
    used.forEach(name => {
      const r = TPL_ROLES[name];
      const options = roleOptions(ds, name);
      const cur = roleValueLabel(ds, roles, name);
      const required = (tpl.need || []).includes(name);
      const sel = selectEl(
        [['', required ? '— не выбрано —' : '— не нужно —'], ...options.map((o, i) => [String(i), o.label])],
        String(options.findIndex(o => o.label === cur)),
        v => { setRole(ds, roles, name, v === '' || +v < 0 ? null : options[+v]); paint(); },
        { 'aria-label': r.label });
      rolesBox.appendChild(h('div', { class: 'row2', style: { marginBottom: '6px', alignItems: 'center' } },
        h('div', null, h('b', { style: { fontSize: '13px' } }, r.label + (required ? '' : ' (если есть)')),
          h('div', { class: 'hint' }, r.hint)), sel));
    });
    if (!mockup) body.appendChild(rolesBox);

    // Уровни
    const lvBox = h('div', { class: 'field' }, h('div', { class: 'lbl' }, 'Уровни детализации'));
    tpl.levels.forEach(l => {
      const meta = TPL_LEVELS[l.id];
      const off = l.id === 'docs' && !docsFit.ok;
      lvBox.appendChild(h('div', null,
        checkbox(`${meta.title} — ${meta.q}`, levels[l.id] && !off, v => { levels[l.id] = v; paint(); }),
        off ? h('div', { class: 'hint', style: { marginLeft: '24px' } }, `Недоступен: ${docsFit.why}`) : null));
    });
    body.appendChild(lvBox);

    // Что получится
    const derivedPlan = plannedDerived(tpl, ds, roles);
    const willAdd = derivedPlan.filter(d => !d.existing);
    const plan = buildFromTemplate(tpl, ds, roles, Object.keys(levels).filter(k => levels[k]), Object.fromEntries(derivedPlan.map(d => [d.id, d.existing || { kind: 'saved', key: '~' }])));
    const nCharts = plan.levels.reduce((a, l) => a + l.charts.length, 0);
    const info = h('div', { class: 'tpl-plan' });
    info.appendChild(h('p', null, h('b', null, `Получится ${nCharts} ${plural(nCharts, 'блок', 'блока', 'блоков')} на ${plan.levels.length} ${plural(plan.levels.length, 'вкладке', 'вкладках', 'вкладках')}`)));
    plan.levels.forEach(l => info.appendChild(h('div', { class: 'muted', style: { fontSize: '12.5px' } },
      `${l.title}: ${l.charts.map(c => c.name).join('; ')}`)));
    if (willAdd.length && !mockup) info.appendChild(h('p', { style: { marginBottom: 0 } },
      'В набор «' + ds.name + '» будет добавлен показатель: ',
      willAdd.map(d => h('b', null, `${d.label} = ${exprText(ds, d.expr)}`))));
    const miss = [...new Set(plan.skipped.flatMap(s => s.need))].map(n => (TPL_ROLES[n] || {}).label || n);
    if (miss.length) info.appendChild(h('p', { class: 'muted', style: { fontSize: '12.5px', marginBottom: 0 } },
      `Часть блоков пропущена — не хватает: ${miss.join(', ')}.`));
    body.appendChild(info);
  };
  paint();

  openModal({
    title: `Готовый шаблон: ${tpl.name}`, wide: true, body,
    foot: close => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn primary', onclick: () => {
        const lv = Object.keys(levels).filter(k => levels[k]);
        if (!lv.length) { toast('Отметьте хотя бы один уровень', true); return; }
        let id;
        if (mockup) {
          id = createMockup(tpl, { title, levels: lv });
        } else {
          const fit = templateFits(tpl, ds, roles);
          if (!fit.ok) { toast('Не заполнено: ' + fit.missingLabels.join(', '), true); return; }
          id = createFromTemplate(tpl, ds, { title: title.trim() || tpl.name, roles, levels: lv });
        }
        if (!id) return;
        close();
        toast(mockup ? 'Макет собран: правьте названия прямо на блоках' : 'Дашборд собран');
        go('#/d/' + id);
      } }, ic('check'), 'Создать дашборд')],
  });
}

/* ---------- Скрытый набор макета ----------
   У макета нет и не должно быть настоящих данных: колонки берутся из описания
   шаблона, а если шаблона нет — нейтральные, чтобы блоки не называли чужих
   сущностей. Набор принадлежит дашборду и человеку не показывается. */
const MOCKUP_NEUTRAL_COLS = ['Период', 'Категория', 'Группа', 'Показатель', 'Количество, шт.'];

function mockupSchema(tpl) {
  const used = new Set();
  const src = (tpl && tpl.demo && tpl.demo.length) ? tpl.demo : MOCKUP_NEUTRAL_COLS;
  const columns = src.map((d, i) => {
    const label = typeof d === 'string' ? d : d.label;
    const col = Object.assign({ key: slugKey(label, i, used), label }, guessSchemaCol(label));
    if (typeof d === 'object') Object.assign(col, d, { label, key: col.key });
    return col;
  });
  return Object.assign({ seed: (Date.now() % 100000) + 1, rowCount: 2000, columns }, defaultSchemaPeriod());
}
/* Набор-объект без записи в состояние: нужен, чтобы показать состав будущего дашборда */
function mockupDatasetDraft(tpl, title) {
  const schema = normalizeSchema(mockupSchema(tpl));
  const columns = schema.columns.map(c => ({ key: c.key, label: c.label, type: c.type }));
  return {
    id: 'mockup_draft', name: `Данные макета «${title}»`, kind: 'schema', schema, columns,
    metrics: schemaMetrics(columns, null), mainDttm: (columns.find(c => c.type === 'date') || {}).key || null,
    description: SCHEMA_NOTE, rows: generateSchemaRows(schema),
  };
}

/* Блок в макете добавляется видом визуализации, а не метрикой и разрезом:
   показатель и разрез Кобра берёт из скрытого набора молча. */
const MOCKUP_BLOCKS = [
  { viz: 'line', name: 'Линейный график', by: 'date' },
  { viz: 'bar', name: 'Столбцы', by: 'dim1' },
  { viz: 'pie', name: 'Круговая', by: 'dim1' },
  { viz: 'area', name: 'Области', by: 'date', series: 'dim1' },
  { viz: 'big_number_trend', name: 'Большое число', kind: 'kpi' },
  { viz: 'table', name: 'Таблица', by: 'dim1' },
  { viz: 'treemap', name: 'Дерево', by: 'dim1', by2: 'dim2' },
  { viz: 'heatmap', name: 'Тепловая карта', by: 'date', y: 'dim1' },
  { viz: 'funnel', name: 'Воронка', by: 'stage' },
  { viz: 'pivot', name: 'Сводная таблица', by: 'dim1', cols: 'dim2' },
];
/* Какие виды блоков вообще построятся на этом наборе: воронке нужен этап,
   тепловой карте — дата. Предлагать то, что не соберётся, нельзя. */
function mockupBlockOptions(ds) {
  const roles = pickRoles(ds);
  return MOCKUP_BLOCKS.filter(b => !!tplBlockChart(Object.assign({ metric: 'main' }, b), ds, roles, null));
}
/* Создаёт блок выбранного вида на наборе дашборда и возвращает id графика */
function createMockupChart(ds, vizId) {
  const b = MOCKUP_BLOCKS.find(x => x.viz === vizId);
  if (!b) return null;
  const roles = pickRoles(ds);
  const plan = tplBlockChart(Object.assign({ metric: 'main' }, b), ds, roles, null);
  if (!plan) return null;
  const id = uid('c_');
  STATE.charts[id] = {
    id, name: b.name, viz: plan.viz, datasetId: ds.id, autoName: true,
    params: Object.assign(VIZ[plan.viz].defaults(ds), plan.params), updated: Date.now(),
  };
  return id;
}

/* ---------- Предпросмотр на вымышленных данных ---------- */
/* Временный набор и дашборд живут только в памяти: в localStorage не пишем */
function templatePreview(tpl) {
  const used = new Set();
  const cols = (tpl.demo || []).map((d, i) => {
    const label = typeof d === 'string' ? d : d.label;
    const col = Object.assign({ key: slugKey(label, i, used), label }, guessSchemaCol(label));
    if (typeof d === 'object') Object.assign(col, d, { label, key: col.key });
    return col;
  });
  const schema = Object.assign({ seed: 11, rowCount: 1200, columns: cols }, defaultSchemaPeriod());
  const dsId = 'tpl_preview';
  const columns = cols.map(c => ({ key: c.key, label: c.label, type: c.type }));
  DS[dsId] = {
    id: dsId, name: `Пример: ${tpl.name}`, kind: 'schema', preview: true, schema, columns,
    metrics: schemaMetrics(columns, null), mainDttm: (columns.find(c => c.type === 'date') || {}).key || null,
    description: SCHEMA_NOTE, rows: generateSchemaRows(schema),
  };
  const id = createFromTemplate(tpl, DS[dsId], { title: `Пример: ${tpl.name}`, preview: true });
  if (!id) { delete DS[dsId]; return null; }
  return id;
}
/* Убираем примеры, когда человек ушёл с них: иначе они осядут в состоянии */
function purgePreviews(keepId) {
  let had = false;
  Object.values(STATE.dashboards).forEach(d => {
    if (!d.preview || d.id === keepId) return;
    d.tabs.forEach(t => t.items.forEach(i => { if (i.chartId) delete STATE.charts[i.chartId]; }));
    delete STATE.dashboards[d.id];
    had = true;
  });
  if (had) Object.keys(DS).forEach(k => { if (DS[k].preview && !Object.values(STATE.dashboards).some(d => d.fromTemplate && d.fromTemplate.datasetId === k)) delete DS[k]; });
  return had;
}
